    { id: 241, category: "예술과 문화", difficulty: "easy", question: "파블로 피카소가 창시한 미술 사조로, 대상을 여러 방향에서 본 모습을 하나의 평면 위에 분해하고 재조립하여 기하학적으로 표현한 양식은?", options: ["야수파", "초현실주의", "입체파(큐비즘)", "인상파"], correctAnswer: 2, explanation: "입체파는 전통적인 원근법을 파괴하고 사물을 입체적으로 재구성한 현대 미술의 혁명입니다." },
    { id: 242, category: "예술과 문화", difficulty: "easy", question: "19세기 후반 프랑스에서 일어난 미술 사조로, 빛의 변화에 따라 시시각각 변하는 사물의 색채를 묘사한 클로드 모네가 대표적인 이 화파는?", options: ["낭만주의", "인상주의", "사실주의", "상징주의"], correctAnswer: 1, explanation: "모네의 작품 '인상, 해돋이'에서 '인상주의'라는 명칭이 유래했습니다." },
    { id: 243, category: "예술과 문화", difficulty: "easy", question: "캠벨 수프 깡통, 코카콜라 병, 마릴린 먼로 등 대중적인 이미지를 실크스크린 기법으로 대량 생산하여 팝아트를 이끈 미국의 거장은?", options: ["앤디 워홀", "로이 리히텐슈타인", "장 미셸 바스키아", "키스 해링"], correctAnswer: 0, explanation: "앤디 워홀은 일상적인 상업 이미지를 예술의 경지로 끌어올린 팝아트의 황제입니다." },
    { id: 244, category: "예술과 문화", difficulty: "easy", question: "교향곡에 처음으로 성악을 도입한 베토벤의 마지막 교향곡으로, 4악장에 프리드리히 실러의 시 '환희의 송가' 합창이 들어간 이 곡은 몇 번일까요?", options: ["교향곡 3번(영웅)", "교향곡 5번(운명)", "교향곡 6번(전원)", "교향곡 9번(합창)"], correctAnswer: 3, explanation: "교향곡 9번은 인류애와 평화의 메시지를 담은 클래식 역사상 최고의 걸작 중 하나입니다." },
    { id: 245, category: "예술과 문화", difficulty: "easy", question: "르네상스 시대의 천재 미켈란젤로가 바티칸의 시스틴 성당 천장에 4년 동안 누워서 그린 거대한 프레스코화의 이름은?", options: ["최후의 만찬", "아테네 학당", "천지창조", "비너스의 탄생"], correctAnswer: 2, explanation: "'천지창조'는 구약성서 창세기의 이야기를 9개의 장면으로 묘사한 웅장한 천장화입니다." },
    { id: 246, category: "예술과 문화", difficulty: "easy", question: "매년 5월 프랑스 남부의 휴양 도시에서 열리며, 최고상인 '황금종려상'을 수여하는 세계 3대 영화제 중 하나는?", options: ["베니스 영화제", "베를린 영화제", "선댄스 영화제", "칸 영화제"], correctAnswer: 3, explanation: "칸(Cannes) 영화제는 예술성과 상업성이 조화된 세계 최고 권위의 국제 영화제입니다." },
    { id: 247, category: "예술과 문화", difficulty: "easy", question: "스페인의 소설가 세르반테스가 지은 소설로, 자신을 기사라 착각하고 풍차를 거인으로 여겨 돌진하는 엉뚱한 주인공을 다룬 작품은?", options: ["데카메론", "신곡", "돈키호테", "걸리버 여행기"], correctAnswer: 2, explanation: "돈키호테는 근대 소설의 효시로 평가받으며, 이상주의와 현실주의의 대립을 유쾌하게 그렸습니다." },
    { id: 248, category: "예술과 문화", difficulty: "easy", question: "프랑스 파리의 오페라 극장 지하에 숨어 사는 얼굴이 흉측한 천재 음악가와 아름다운 프리마돈나 크리스틴의 사랑을 그린 유명 뮤지컬은?", options: ["레 미제라블", "오페라의 유령", "캣츠", "시카고"], correctAnswer: 1, explanation: "앤드루 로이드 웨버가 작곡한 '오페라의 유령'은 브로드웨이 최장기 공연 기록을 세운 명작입니다." },
    { id: 249, category: "예술과 문화", difficulty: "easy", question: "짙은 일자 눈썹과 멕시코 전통 의상이 특징이며, 교통사고로 인한 육체적 고통을 강렬하고 초현실적인 자화상으로 승화시킨 여성 화가는?", options: ["조지아 오키프", "프리다 칼로", "카미유 끌로델", "아르테미시아 젠틸레스키"], correctAnswer: 1, explanation: "프리다 칼로는 멕시코의 민족주의와 자신의 페미니즘적 자의식을 예술로 표현했습니다." },
    { id: 250, category: "예술과 문화", difficulty: "easy", question: "치즈처럼 사방으로 흘러내리는 시계 등 무의식과 꿈의 세계를 기괴하게 그려낸 '기억의 지속'으로 유명한 스페인의 초현실주의 화가는?", options: ["살바도르 달리", "르네 마그리트", "마르크 샤갈", "호안 미로"], correctAnswer: 0, explanation: "살바도르 달리는 특유의 콧수염과 기행, 그리고 기발한 상상력으로 초현실주의를 대표합니다." },
    { id: 251, category: "예술과 문화", difficulty: "easy", question: "J.R.R. 톨킨의 동명 소설을 원작으로 하며, 세상을 지배할 수 있는 절대반지를 파괴하기 위해 호빗 '프로도'가 떠나는 여정을 그린 판타지 영화 시리즈는?", options: ["해리 포터", "스타워즈", "반지의 제왕", "나니아 연대기"], correctAnswer: 2, explanation: "피터 잭슨 감독의 '반지의 제왕'은 판타지 영화의 교과서이자 아카데미 시상식을 휩쓴 명작입니다." },
    { id: 252, category: "예술과 문화", difficulty: "easy", question: "러시아의 작곡가 차이콥스키의 3대 발레 음악 중 하나로, 크리스마스 이브를 배경으로 장난감 병정들이 살아 움직이는 환상적인 동화 발레는?", options: ["백조의 호수", "잠자는 숲속의 미녀", "호두까기 인형", "지젤"], correctAnswer: 2, explanation: "'호두까기 인형'은 연말연시 전 세계 발레단이 가장 많이 무대에 올리는 대표적인 가족 레퍼토리입니다." },
    { id: 253, category: "예술과 문화", difficulty: "easy", question: "2024년, '채식주의자', '소년이 온다' 등의 작품으로 한국 작가 최초이자 아시아 여성 최초로 노벨 문학상을 수상한 소설가는?", options: ["박경리", "한강", "신경숙", "공지영"], correctAnswer: 1, explanation: "소설가 한강의 노벨상 수상은 한국 문학의 세계적 위상을 크게 높인 역사적 사건이었습니다." },
    { id: 254, category: "예술과 문화", difficulty: "easy", question: "1970년대 미국 뉴욕 브롱크스의 아프리카계 및 히스패닉계 빈민가 청년들을 중심으로 시작된 랩, 디제잉, 그래피티, 브레이크 댄스를 포괄하는 문화는?", options: ["로큰롤", "재즈", "힙합", "디스코"], correctAnswer: 2, explanation: "힙합(Hip-hop)은 길거리 문화에서 시작하여 현재 전 세계 대중음악의 가장 주류 장르가 되었습니다." },
    { id: 255, category: "예술과 문화", difficulty: "easy", question: "대중가요(Pop)와 오페라(Opera)의 합성어로, 성악 발성으로 대중적인 노래를 부르거나 팝송에 클래식 편곡을 가미하는 크로스오버 음악 장르는?", options: ["뮤지컬", "가곡", "아카펠라", "팝페라"], correctAnswer: 3, explanation: "사라 브라이트만, 안드레아 보첼리, 일 디보 등이 팝페라(Popera) 장르를 대중화시켰습니다." },

    // ==========================================
    // [예술과 문화] Level 3: 보통 (medium) - 15문제
    // ==========================================
    { id: 256, category: "예술과 문화", difficulty: "medium", question: "윌리엄 셰익스피어의 4대 비극 중 하나로, 삼촌에게 아버지를 잃고 \"사느냐 죽느냐 그것이 문제로다\"라며 고뇌하는 덴마크 왕자의 이야기를 다룬 작품은?", options: ["맥베스", "리어왕", "오셀로", "햄릿"], correctAnswer: 3, explanation: "햄릿은 인간의 깊은 내적 갈등과 복수, 삶의 의미를 탐구한 문학사상 최고의 희곡입니다." },
    { id: 257, category: "예술과 문화", difficulty: "medium", question: "스페인 내전 당시 나치 독일 공군이 스페인의 작은 바스크 마을을 무차별 폭격한 참상을 고발한 파블로 피카소의 거대한 흑백 벽화 이름은?", options: ["우는 여인", "아비뇽의 처녀들", "게르니카", "한국에서의 학살"], correctAnswer: 2, explanation: "게르니카(Guernica)는 전쟁의 비극과 폭력성을 상징하는 20세기 최고의 반전(反戰) 미술 작품입니다." },
    { id: 258, category: "예술과 문화", difficulty: "medium", question: "단테의 '신곡'에서 영감을 받아 제작된 청동 조각문 '지옥의 문' 윗부분에서, 턱을 괴고 인간의 번뇌를 고민하는 웅장한 남성 조각상은?", options: ["다비드 상", "원반 던지는 사람", "생각하는 사람", "피에타"], correctAnswer: 2, explanation: "프랑스의 조각가 오귀스트 로댕이 만든 '생각하는 사람'은 세계에서 가장 유명한 조각상 중 하나입니다." },
    { id: 259, category: "예술과 문화", difficulty: "medium", question: "이탈리아의 바로크 작곡가 안토니오 비발디의 대표적인 바이올린 협주곡으로, 사계절의 자연 풍경을 실감 나게 음악으로 묘사한 작품은?", options: ["사계", "피터와 늑대", "동물의 사육제", "행성 조곡"], correctAnswer: 0, explanation: "'사계(The Four Seasons)'는 각 계절을 설명하는 소네트(짧은 시)가 악보에 함께 적혀 있는 표제 음악입니다." },
    { id: 260, category: "예술과 문화", difficulty: "medium", question: "미국 뉴욕 맨해튼 중심부를 가로지르는 극장가로, 런던의 웨스트엔드와 함께 세계 연극과 상업 뮤지컬의 심장부로 불리는 지역의 이름은?", options: ["할리우드", "타임스퀘어", "브로드웨이", "소호"], correctAnswer: 2, explanation: "브로드웨이(Broadway)는 세계 최고의 뮤지컬들이 초연되고 장기 공연되는 무대 예술의 성지입니다." },
    { id: 261, category: "예술과 문화", difficulty: "medium", question: "인상주의 화파에 속하면서도 풍경보다는 발레 무용수들의 역동적인 움직임과 무대 뒤의 고단한 일상을 즐겨 그려 '발레의 화가'로 불린 프랑스 화가는?", options: ["폴 세잔", "피에르 오귀스트 르누아르", "에드가 드가", "앙리 마티스"], correctAnswer: 2, explanation: "에드가 드가(Edgar Degas)는 정확한 소묘력과 파스텔을 이용해 찰나의 움직임을 포착했습니다." },
    { id: 262, category: "예술과 문화", difficulty: "medium", question: "스페인 바르셀로나에 위치하며, 천재 건축가 안토니 가우디가 설계하여 1882년부터 현재까지 140년 넘게 건축이 진행 중인 미완성의 대성당은?", options: ["밀라노 대성당", "노트르담 대성당", "사그라다 파밀리아", "성 베드로 대성당"], correctAnswer: 2, explanation: "사그라다 파밀리아(성가족 성당)는 가우디 사후 100주년이 되는 2026년에 완공을 목표로 하고 있습니다." },
    { id: 263, category: "예술과 문화", difficulty: "medium", question: "한 명의 소리꾼이 고수(북 치는 사람)의 장단에 맞추어 창(노래), 아니리(말), 너름새(몸짓)를 섞어 긴 이야기를 엮어가는 유네스코 인류무형문화유산인 한국 전통 음악은?", options: ["가곡", "민요", "판소리", "산조"], correctAnswer: 2, explanation: "판소리는 서민들의 삶과 희로애락을 해학과 풍자로 담아낸 조선 후기의 대표적인 구비 문학이자 음악입니다." },
    { id: 264, category: "예술과 문화", difficulty: "medium", question: "1919년 발터 그로피우스가 독일 바이마르에 설립한 예술 및 건축 학교로, 예술과 기술의 통합을 주장하며 현대 디자인과 모더니즘 건축에 지대한 영향을 미친 이곳은?", options: ["에콜 데 보자르", "바우하우스", "블룸즈버리 그룹", "구겐하임"], correctAnswer: 1, explanation: "바우하우스(Bauhaus)는 비록 나치에 의해 폐교되었으나, 그 교육 철학은 전 세계로 퍼져 현대 디자인의 기초가 되었습니다." },
    { id: 265, category: "예술과 문화", difficulty: "medium", question: "19세기 프랑스 대혁명과 6월 봉기를 배경으로, 빵 한 조각을 훔친 죄로 19년을 복역한 장 발장의 생애를 통해 인간의 구원과 사랑을 그린 빅토르 위고의 대하소설은?", options: ["적과 흑", "몽테크리스토 백작", "레 미제라블", "오페라의 유령"], correctAnswer: 2, explanation: "'불쌍한 사람들'이라는 뜻의 '레 미제라블'은 소설뿐 아니라 세계 4대 뮤지컬로도 유명합니다." },
    { id: 266, category: "예술과 문화", difficulty: "medium", question: "19세기 말에서 20세기 초 미국 뉴올리언스의 아프리카계 미국인들 사이에서 탄생했으며, 싱코페이션(당김음)과 즉흥 연주(Improvisation)가 큰 특징인 음악 장르는?", options: ["블루스", "솔(Soul)", "로큰롤", "재즈(Jazz)"], correctAnswer: 3, explanation: "재즈는 흑인의 아프리카 리듬과 백인의 유럽 화성이 결합하여 탄생한 미국을 대표하는 독창적 예술입니다." },
    { id: 267, category: "예술과 문화", difficulty: "medium", question: "얼굴을 철저히 숨긴 채 전 세계 거리의 벽이나 담장에 전쟁, 자본주의 등을 풍자하는 그래피티 스텐실 작품을 남기고 사라지는 영국의 익명 미술가는?", options: ["키스 해링", "뱅크시(Banksy)", "장 미셸 바스키아", "데미안 허스트"], correctAnswer: 1, explanation: "뱅크시는 자신의 작품이 경매에서 낙찰되는 순간 액자 내부에 숨긴 파쇄기로 그림을 스스로 찢어버리는 기행으로도 유명합니다." },
    { id: 268, category: "예술과 문화", difficulty: "medium", question: "17~19세기 일본 에도 시대에 서민들 사이에서 크게 유행했던 다색 목판화로, 반 고흐와 모네 등 19세기 유럽 인상파 화가들에게 깊은 영감을 준 미술 양식은?", options: ["수묵화", "우키요에", "탱화", "만다라"], correctAnswer: 1, explanation: "우키요에는 서양 미술계에 자포니즘(Japonism, 일본풍 유행)을 불러일으킨 중요한 매개체였습니다." },
    { id: 269, category: "예술과 문화", difficulty: "medium", question: "미국 저널리즘 및 문학계 최고 권위의 상으로, 신문인 조지프 퓰리처의 유산으로 제정되어 매년 언론, 문학, 음악 부문 등에서 뛰어난 업적을 이룬 사람에게 수여되는 상은?", options: ["노벨상", "부커상", "퓰리처상", "공쿠르상"], correctAnswer: 2, explanation: "퓰리처상은 특히 언론계에서 '기자들의 노벨상'으로 불릴 만큼 명예로운 상입니다." },
    { id: 270, category: "예술과 문화", difficulty: "medium", question: "제1차 세계대전 중인 1916년 스위스 취리히에서 시작되어, 이성의 파산과 전쟁의 참혹함에 반발하며 기존의 모든 예술 형식과 도덕적 가치를 부정하고 파괴하려 했던 '반(反)예술' 운동은?", options: ["미니멀리즘", "다다이즘", "미래주의", "표현주의"], correctAnswer: 1, explanation: "다다(Dada)는 무의미함, 우연성, 비합리성을 추구하며 이후 초현실주의로 발전하는 토대가 되었습니다." },

    // ==========================================
    // [예술과 문화] Level 4: 어려움 (hard) - 15문제
    // ==========================================
    { id: 271, category: "예술과 문화", difficulty: "hard", question: "1917년, 마르셀 뒤샹이 공장에서 대량 생산된 남성용 소변기를 거꾸로 뉘어 놓고 'R. Mutt'라는 가짜 사인을 하여 출품한 기성품(레디메이드) 작품으로, 현대 미술의 개념을 뒤바꾼 이 작품의 이름은?", options: ["변기", "파이프", "샘(Fountain)", "자전거 바퀴"], correctAnswer: 2, explanation: "'샘'은 미술의 본질이 '시각적 아름다움을 만드는 것'에서 '아이디어와 개념의 창조'로 바뀌었음을 선언한 상징적 작품입니다." },
    { id: 272, category: "예술과 문화", difficulty: "hard", question: "독일의 작곡가 리하르트 바그너가 북유럽 게르만 신화를 바탕으로 작사, 작곡, 연출까지 도맡아 완성한 4부작의 방대한 악극으로, 훗날 판타지 소설 '반지의 제왕'에 큰 모티브를 제공한 작품은?", options: ["마탄의 사수", "탄호이저", "로엔그린", "니벨룽의 반지"], correctAnswer: 3, explanation: "공연에만 며칠이 걸리는 '니벨룽의 반지'는 음악, 연극, 시, 무대 미술이 하나로 통합된 바그너 예술의 결정체입니다." },
    { id: 273, category: "예술과 문화", difficulty: "hard", question: "조르주 쇠라가 발전시킨 신인상주의의 미술 기법으로, 팔레트에서 물감을 섞지 않고 캔버스 위에 원색의 작은 점들을 수없이 찍어 관찰자의 눈에서 시각적으로 색이 섞여 보이게(병치 혼합) 한 기법은?", options: ["임파스토", "마블링", "그라타주", "점묘법"], correctAnswer: 3, explanation: "대표작 '그랑드 자트 섬의 일요일 오후'는 과학적인 색채 이론을 바탕으로 점묘법을 완성한 대작입니다." },
    { id: 274, category: "예술과 문화", difficulty: "hard", question: "1940~1950년대 할리우드에서 유행한 영화 장르로, 범죄와 폭력을 다루며 흑백의 음영이 극명하게 대비되는 조명, 팜 파탈(치명적인 여인), 냉소적이고 비관적인 분위기가 특징인 영화 양식은?", options: ["누벨 바그", "네오 리얼리즘", "필름 누아르(Film Noir)", "스파게티 웨스턴"], correctAnswer: 2, explanation: "프랑스어로 '검은 영화'라는 뜻의 필름 누아르는 전후 미국의 불안한 사회 심리를 어둡고 스타일리시하게 묘사했습니다." },
    { id: 275, category: "예술과 문화", difficulty: "hard", question: "독일 문학의 최고봉인 요한 볼프강 폰 괴테가 20대부터 죽기 직전까지 무려 60년에 걸쳐 완성한 필생의 대작 희곡으로, 우주의 원리를 깨닫고자 악마 메피스토펠레스와 영혼을 건 계약을 맺는 노학자의 이야기를 다룬 작품은?", options: ["젊은 베르테르의 슬픔", "도적들", "파우스트", "빌헬름 마이스터의 수업시대"], correctAnswer: 2, explanation: "'파우스트'는 인간의 끊임없는 욕망과 타락, 그리고 구원의 문제를 장엄하게 그려낸 세계 문학사의 금자탑입니다." },
    { id: 276, category: "예술과 문화", difficulty: "hard", question: "영화 편집(몽타주) 이론에서, 무표정한 배우의 얼굴 클로즈업 샷에 수프, 관, 노는 아이의 화면을 각각 이어 붙였을 때 관객이 스스로 배우의 표정에서 '배고픔, 슬픔, 기쁨'의 감정을 읽어내는 인지적, 심리적 현상을 지칭하는 용어는?", options: ["맥거핀 효과", "플라시보 효과", "쿨레쇼프 효과", "미장센"], correctAnswer: 2, explanation: "소련의 영화 감독 레프 쿨레쇼프가 실험을 통해 증명한 이 효과는, 영화의 의미가 개별 샷이 아니라 샷과 샷의 연결(편집)에서 생성됨을 보여줍니다." },
    { id: 277, category: "예술과 문화", difficulty: "hard", question: "1776년 예카테리나 2세의 지시로 설립되어 세계에서 가장 오래되고 규모가 큰 발레단 중 하나로, 상트페테르부르크의 '마린스키 발레단'과 함께 러시아 발레의 양대 산맥을 이루는 모스크바의 이 발레단 이름은?", options: ["아메리칸 발레 시어터", "파리 오페라 발레단", "로열 발레단", "볼쇼이 발레단"], correctAnswer: 3, explanation: "러시아어로 '크다'라는 뜻의 볼쇼이(Bolshoi) 발레단은 남성 무용수의 웅장하고 역동적인 테크닉으로 유명합니다." },
    { id: 278, category: "예술과 문화", difficulty: "hard", question: "17~18세기 이탈리아 크레모나 지역의 현악기 명장 가문이 만든 바이올린으로, 현대의 과학 기술로도 그 신비로운 음색과 울림을 완벽하게 재현하지 못해 오늘날 경매에서 수십억 원을 호가하는 세계 최고의 명기는?", options: ["과르네리", "아마티", "스트라디바리우스", "스타인웨이"], correctAnswer: 2, explanation: "안토니오 스트라디바리가 제작한 명기들은 전 세계 수많은 바이올린 거장들의 분신으로 사랑받고 있습니다." },
    { id: 279, category: "예술과 문화", difficulty: "hard", question: "러시아의 연출가이자 배우가 창시한 현대 연기 이론으로, 배우가 억지스러운 연기를 버리고 배역이 처한 상황과 내면적 심리, 동기를 깊이 이해하여 '자신이 곧 그 인물'이 된 것처럼 진실하게 행동하도록 훈련하는 시스템은?", options: ["브레히트의 서사극", "메소드 연기(스타니슬랍스키 시스템)", "메이예르홀트의 생체역학", "그로토프스키의 가난한 연극"], correctAnswer: 1, explanation: "콘스탄틴 스타니슬랍스키가 확립한 이 시스템은 이후 할리우드로 넘어가 말론 브란도, 알 파치노 등이 구사하는 '메소드 연기'의 뼈대가 되었습니다." },
    { id: 280, category: "예술과 문화", difficulty: "hard", question: "19세기 말에서 20세기 초 유럽에서 크게 유행한 예술 양식으로, 산업화에 반발하여 식물의 덩굴, 꽃 등 자연에서 영감을 받은 유기적이고 구불구불한 곡선을 건축, 가구, 공예, 포스터 디자인 등에 적극적으로 활용한 장식 미술 양식은?", options: ["아르 데코", "바우하우스", "팝아트", "아르 누보(Art Nouveau)"], correctAnswer: 3, explanation: "프랑스어로 '새로운 예술'을 뜻하는 아르 누보는 알폰스 무하의 화려한 포스터와 가우디의 건축물이 대표적입니다." },
    { id: 281, category: "예술과 문화", difficulty: "hard", question: "제2차 세계대전 전후 프랑스의 장 폴 사르트르, 알베르 카뮈 등으로 대표되며, \"실존은 본질에 앞선다\"는 명제를 바탕으로 신이나 절대적 가치가 상실된 부조리한 세상 속에서 개인의 뼈아픈 자유와 주체적인 선택, 책임을 강조한 20세기 철학 및 문학 사조는?", options: ["구조주의", "낭만주의", "실존주의", "포스트모더니즘"], correctAnswer: 2, explanation: "실존주의 문학은 불안과 소외 속에서도 삶의 의미를 스스로 만들어가는 현대인의 초상을 그려냈습니다." },
    { id: 282, category: "예술과 문화", difficulty: "hard", question: "기원전 27년 고대 로마 시대에 지어진 신전으로 '모든 신을 위한 신전'이라는 뜻을 가지며, 기둥 없이 지어진 거대한 돔 천장 중앙에 뚫린 둥근 구멍(오쿨루스)으로 햇빛이 쏟아져 들어오는 완벽한 비례의 건축물은?", options: ["콜로세움", "파르테논 신전", "하기아 소피아", "판테온(Pantheon)"], correctAnswer: 3, explanation: "판테온은 로마 건축 기술의 정수를 보여주며, 미켈란젤로가 '천사의 설계'라 극찬할 만큼 보존 상태가 뛰어납니다." },
    { id: 283, category: "예술과 문화", difficulty: "hard", question: "프랑스의 작곡가로, 기존 고전주의의 엄격한 형식과 화성학 규칙에서 벗어나 동양의 음계와 불협화음을 자유롭게 섞어 쓰며 몽환적이고 색채감 넘치는 분위기를 자아내 '음악의 인상주의'를 확립한 인물(대표작: 달빛, 목신의 오후에 전주곡)은?", options: ["모리스 라벨", "카미유 생상스", "클로드 드뷔시", "엑토르 베를리오즈"], correctAnswer: 2, explanation: "클로드 드뷔시는 모네의 그림이 미술계에 일으킨 혁명처럼, 모호하고 신비로운 화성으로 현대 음악의 새로운 지평을 열었습니다." },
    { id: 284, category: "예술과 문화", difficulty: "hard", question: "19세기 중반 프랑스에서 고전적인 아카데미 화풍과 신화적 주제에 반발하여, 자연의 빛과 색을 그리기 위해 야외로 나간 인상주의 화가들의 선구적 역할을 했으며, '풀밭 위의 점심 식사', '올랭피아' 등의 파격적인 작품으로 당대 파리 살롱전에 거대한 스캔들을 일으킨 화가는?", options: ["폴 고갱", "에두아르 마네", "피에르 오귀스트 르누아르", "폴 세잔"], correctAnswer: 1, explanation: "에두아르 마네는 평면적인 채색과 동시대 파리 시민들의 일상을 적나라하게 묘사하여 현대 회화의 문을 열었다는 평가를 받습니다." },
    { id: 285, category: "예술과 문화", difficulty: "hard", question: "1920년대 멕시코 혁명 이후, 글을 모르는 원주민과 민중들에게 국가의 역사와 혁명의 이상을 교육하기 위해 정부 주도로 공공건물 벽에 거대한 그림을 그렸던 '벽화 운동'을 이끈 3대 거장 중 한 명이자, 초현실주의 여성 화가 프리다 칼로의 남편으로도 유명한 인물은?", options: ["페르난도 보테로", "다비드 알파로 시케이로스", "호세 클레멘테 오로스코", "디에고 리베라"], correctAnswer: 3, explanation: "디에고 리베라는 멕시코의 민족주의와 사회주의 신념을 웅장한 프레스코 벽화에 담아내어 라틴아메리카 예술에 큰 족적을 남겼습니다." },

    // ==========================================
    // [예술과 문화] Level 5: 매우 어려움 (very_hard) - 15문제
    // ==========================================
    { id: 286, category: "예술과 문화", difficulty: "very_hard", question: "미국의 전위 음악가 존 케이지가 1952년에 발표한 곡으로, 연주자가 무대에 올라와 피아노 뚜껑을 열고 악보에 지시된 시간 동안 아무런 연주도 하지 않고 퇴장하여 그 시간 동안 관객석에서 발생하는 '모든 소음' 자체를 음악으로 간주한 파격적인 작품의 제목은?", options: ["봄의 제전", "우연성의 음악", "4분 33초", "달에 홀린 피에로"], correctAnswer: 2, explanation: "존 케이지의 '4분 33초'는 서양 음악의 근간이었던 '음표'와 '작곡가의 통제'를 부정하고 우연성(Chance music)과 침묵을 예술로 끌어들인 20세기 최대의 음악적 스캔들입니다." },
    { id: 287, category: "예술과 문화", difficulty: "very_hard", question: "1917년 네덜란드의 화가 피에트 몬드리안과 테오 반 두스부르흐 등이 주도한 추상 미술 및 디자인 운동으로, 우주의 절대적 진리와 조화를 표현하기 위해 사물의 형태를 수직선과 수평선, 그리고 빨강, 파랑, 노랑의 3원색과 무채색만으로 극도로 환원시킨 미술 사조의 명칭은?", options: ["입체주의(Cubism)", "신조형주의(De Stijl, 데 스틸)", "절대주의(Suprematism)", "구성주의(Constructivism)"], correctAnswer: 1, explanation: "데 스틸(De Stijl, 영어로 The Style) 운동의 기하학적이고 수학적인 미학은 패션(이브 생 로랑의 몬드리안 룩)과 현대 건축 설계에 막대한 영향을 미쳤습니다." },
    { id: 288, category: "예술과 문화", difficulty: "very_hard", question: "아일랜드의 소설가 제임스 조이스의 대표작으로, 1904년 6월 16일 하루 동안 더블린 시내에서 일어나는 주인공 레오폴드 블룸의 평범하고 세속적인 일상을 인간의 무의식적 사고 흐름을 여과 없이 묘사하는 '의식의 흐름(Stream of consciousness)' 기법으로 서술한 20세기 모더니즘 문학의 최고봉은?", options: ["잃어버린 시간을 찾아서", "댈러웨이 부인", "율리시스", "분노의 포도"], correctAnswer: 2, explanation: "호메로스의 서사시 '오디세이아'의 구조를 차용한 '율리시스'는 난해한 언어 실험과 심리 묘사로 현대 소설의 서사 방식을 완전히 해체하고 재창조했습니다." },
    { id: 289, category: "예술과 문화", difficulty: "hard", question: "1950년대 프랑스의 영화 평론 잡지 '카이에 뒤 시네마'의 평론가(프랑수아 트뤼포 등)들을 중심으로 제기된 영화 이론으로, 상업적인 스튜디오 시스템 안에서 만들어진 영화일지라도 감독 개인의 일관된 예술적 비전과 독창적인 미장센이 반영되어 있다면 영화의 진정한 '저자'는 시나리오 작가나 제작자가 아닌 '감독'으로 보아야 한다는 주장은?", options: ["누벨 바그", "네오 리얼리즘", "작가주의(Auteur theory)", "몽타주 이론"], correctAnswer: 2, explanation: "작가주의 이론은 알프레드 히치콕이나 존 포드 같은 상업 영화 감독들을 위대한 예술가의 반열에 올리는 결정적인 계기가 되었습니다." },
    { id: 290, category: "예술과 문화", difficulty: "very_hard", question: "1913년 파리 초연 당시, 파격적이고 불규칙한 불협화음과 원시 제의를 묘사한 파격적인 안무(바슬라프 니진스키)로 인해 극장 관객들 사이에 격렬한 몸싸움과 폭동을 일으켰으나, 오늘날 20세기 현대 음악의 가장 위대한 걸작으로 평가받는 이고르 스트라빈스키의 발레 음악은?", options: ["불새", "페트루슈카", "봄의 제전", "로미오와 줄리엣"], correctAnswer: 2, explanation: "세르게이 디아길레프가 이끄는 '발레 뤼스(Ballets Russes)'가 기획한 '봄의 제전'은 조성 파괴와 리듬의 해방으로 클래식 음악계에 원시주의 혁명을 일으켰습니다." },
    { id: 291, category: "예술과 문화", difficulty: "very_hard", question: "17세기 이탈리아 바로크 미술의 반항아 카라바조가 확립한 혁신적인 기법으로, 마치 연극 무대에 핀 조명을 비춘 것처럼 화면의 빛과 어둠(명암)을 극명하게 대비시켜 인물의 극적인 감정과 양감을 강조하는 명암법을 이탈리아어 원어로 무엇이라 하나요?", options: ["스푸마토", "프레스코", "키아로스쿠로(Chiaroscuro)", "임파스토"], correctAnswer: 2, explanation: "빛(chiaro)과 어두움(oscuro)의 합성어인 키아로스쿠로 기법은 이후 렘브란트, 벨라스케스 등 17세기 유럽 바로크 화가들에게 결정적인 영향을 주었습니다." },
    { id: 292, category: "예술과 문화", difficulty: "very_hard", question: "서스펜스의 거장 알프레드 히치콕 감독이 자신의 영화에서 즐겨 사용한 플롯 장치로, 스파이의 비밀 문서나 훔친 돈다발처럼 극 초반 줄거리 전개와 인물들의 동기 부여에는 매우 중요해 보이지만, 영화가 끝날 때쯤이면 그 정체나 결과가 실제로는 아무런 의미도 없는 대상(미끼)을 가리키는 영화 용어는?", options: ["클리셰", "미장센", "맥거핀(MacGuffin)", "데우스 엑스 마키나"], correctAnswer: 2, explanation: "맥거핀은 관객의 시선을 엉뚱한 곳으로 유도하여 진짜 사건(심리적 서스펜스)에 집중하게 만드는 히치콕 특유의 극적 속임수입니다." },
    { id: 293, category: "예술과 문화", difficulty: "very_hard", question: "제2차 세계대전 이후 1950년대에 등장한 아방가르드 연극 사조로, 뚜렷한 기승전결의 줄거리 없이 반복적이고 무의미한 대사를 통해 인간 존재의 목적 없음과 소통의 단절을 부조리하게 그려낸 사조이며, 오지 않는 누군가를 하염없이 기다리는 사무엘 베케트의 희곡 '고도를 기다리며'가 대표적인 이 사조는?", options: ["서사극", "잔혹극", "부조리극(Theatre of the Absurd)", "표현주의 연극"], correctAnswer: 2, explanation: "부조리극은 인간을 합리적인 존재로 보던 기존의 시각을 파괴하고, 우주적 고립과 실존적 불안을 해체된 언어와 무대 기법으로 표현했습니다." },
    { id: 294, category: "예술과 문화", difficulty: "very_hard", question: "19세기 후반 독일의 작곡가 리하르트 바그너의 악극(음악극)에서 본격적으로 확립된 기법으로, 특정한 인물, 사물, 감정, 사상 등이 무대에 등장하거나 암시될 때마다 그에 해당하는 고유한 짧은 선율(음악적 동기)을 반복해서 연주하여 관객에게 서사의 흐름을 무의식적으로 전달하는 기법은?", options: ["카덴차", "폴리포니", "유도동기(Leitmotif, 라이트모티프)", "아첼레란도"], correctAnswer: 2, explanation: "유도동기 기법은 현대 할리우드 영화 음악(예: 존 윌리엄스의 '다스 베이더 테마'나 '죠스 테마')의 뼈대가 된 혁명적인 작곡 방식입니다." },
    { id: 295, category: "예술과 문화", difficulty: "very_hard", question: "1915년 러시아의 화가 카지미르 말레비치가 창시한 기하학적 추상 미술 운동으로, 흰색 캔버스 위에 달랑 '검은 사각형' 하나만을 그려 넣음으로써 외부 세계의 재현을 완전히 배제하고 '순수한 예술적 감성의 절대성'을 추구한 이 사조의 명칭은?", options: ["구성주의", "절대주의(Suprematism)", "오르피즘", "야수파"], correctAnswer: 1, explanation: "말레비치의 절대주의는 회화가 무언가를 닮아야 한다는 수천 년의 관념을 부수고, 미술을 '0(제로)'의 상태로 되돌린 현대 추상 미술의 극한입니다." },
    { id: 296, category: "예술과 문화", difficulty: "very_hard", question: "20세기 초 오스트리아의 작곡가 아르놀트 쇤베르크가 창안한 무조(無調) 음악 작곡 기법으로, 한 옥타브 안의 12개 반음을 어떤 음도 중심음(으뜸음)의 역할을 하지 못하도록 수학적으로 동등하게 한 번씩만 배열하여 조성을 완전히 파괴한 현대 음악 기법은?", options: ["미니멀리즘", "우연성 음악", "12음기법(Dodecaphony)", "인상주의 음악"], correctAnswer: 2, explanation: "12음기법은 수백 년간 서양 음악을 지배했던 장조와 단조 체계(조성 음악)를 붕괴시키고, 현대 클래식 음악에 지적인 구조주의를 도입했습니다." },
    { id: 297, category: "예술과 문화", difficulty: "very_hard", question: "라틴아메리카 문학을 대표하는 독특한 서사 양식으로, 지극히 현실적이고 세밀한 일상생활의 묘사 속에 환상적이고 마법적인 요소(유령, 기적 등)를 아무렇지 않은 사실처럼 결합하여 라틴아메리카의 비극적 역사를 고발한 양식이며, 가브리엘 가르시아 마르케스의 소설 '백년의 고독'이 대표적인 이 문학 사조는?", options: ["초현실주의", "낭만주의", "마술적 리얼리즘(Magic Realism)", "자연주의"], correctAnswer: 2, explanation: "마술적 리얼리즘은 제국주의 수탈과 군부 독재라는 폭력적인 현실을 신화적 상상력으로 극복하려 한 라틴아메리카 특유의 저항 미학입니다." },
    { id: 298, category: "예술과 문화", difficulty: "very_hard", question: "1905년 파리에서 열린 전시회(가을 살롱전)에서 처음 등장한 미술 운동으로, 앙리 마티스와 앙드레 드랭 등을 중심으로 입체적 원근법과 고유색을 무시하고 마치 '야생 동물'처럼 거칠고 강렬한 원색과 대담한 붓터치를 사용하여 주관적인 감정을 폭발시키듯 표현한 20세기 최초의 전위적 화파는?", options: ["미래주의", "표현주의", "야수파(Fauvism)", "상징주의"], correctAnswer: 2, explanation: "비평가 루이 보셀이 이들의 거친 그림들 사이에 놓인 고전 조각을 보고 \"야수(Fauves)들에 둘러싸인 도나텔로\"라고 조롱한 데서 이름이 유래했습니다." },
    { id: 299, category: "예술과 문화", difficulty: "very_hard", question: "독일의 철학자이자 문화 비평가 발터 벤야민이 1936년 에세이 '기술복제시대의 예술작품'에서 주창한 미학적 개념으로, 예술 작품의 원본이 시공간 속에서 단 한 점만 존재하기 때문에 뿜어내는 '유일무이하고 신비로우며 흉내 낼 수 없는 고고한 분위기'를 뜻하는 용어는?", options: ["카타르시스", "시뮬라크르", "아우라(Aura)", "푼크툼"], correctAnswer: 2, explanation: "벤야민은 사진과 영화 같은 기술 매체의 발달로 대량 복제가 가능해지면서 전통적 예술 작품이 지녔던 '아우라'가 붕괴되었다고 분석했습니다." },
    { id: 300, category: "예술과 문화", difficulty: "very_hard", question: "19세기 낭만주의 미학의 절정을 보여주는 개념으로, 음악, 연극, 무용, 시, 건축, 무대 미술 등 분리되어 있던 모든 개별 예술 장르들이 하나의 총체적인 공간 안에서 위계 없이 완벽하게 결합하여 이루어내는 '종합예술작품'을 일컫기 위해 리하르트 바그너가 지칭한 독일어 용어는?", options: ["치이트가이스트(Zeitgeist)", "게잠트쿤스트베르크(Gesamtkunstwerk)", "벨탄샤웅(Weltanschauung)", "슈투름 운트 드랑(Sturm und Drang)"], correctAnswer: 1, explanation: "바그너는 이 이상을 실현하기 위해 바이로이트에 자신만의 축제 극장을 직접 설계했으며, 이 개념은 현대 영화 예술의 토대가 되었습니다." },

    // ==========================================
    // [삼국지] Level 1: 매우 쉬움 (very_easy) - 15문제
    // ==========================================
    { id: 301, category: "삼국지", difficulty: "very_easy", question: "유비, 관우, 장비가 복숭아꽃이 핀 동산에서 형제의 의를 맺은 사건을 가리키는 사자성어는?", options: ["삼고초려", "도원결의", "적벽대전", "관도대전"], correctAnswer: 1, explanation: "'도원결의'는 뜻이 맞는 사람들이 큰 뜻을 이루기 위해 굳게 맹세함을 비유하는 말입니다." },
    { id: 302, category: "삼국지", difficulty: "very_easy", question: "유비가 제갈량을 자신의 참모로 맞이하기 위해 그의 초가집을 세 번이나 찾아간 일화에서 유래한 고사성어는?", options: ["읍참마속", "토사구팽", "삼고초려", "다다익선"], correctAnswer: 2, explanation: "인재를 얻기 위해 인내심을 가지고 진심으로 노력하는 모습을 뜻합니다." },
    { id: 303, category: "삼국지", difficulty: "very_easy", question: "조조의 백만 대군을 맞이하여 손권과 유비의 연합군이 양쯔강에서 '화공(불)'으로 크게 물리친 전투는?", options: ["관도대전", "이릉대전", "한중공방전", "적벽대전"], correctAnswer: 3, explanation: "적벽대전은 위, 촉, 오 삼국 정립의 결정적인 계기가 된 삼국지 최대의 전투입니다." },
    { id: 304, category: "삼국지", difficulty: "very_easy", question: "하루에 천 리를 달린다고 전해지며, 동탁과 여포를 거쳐 훗날 관우의 애마가 된 붉은 명마의 이름은?", options: ["적토마", "적로", "절영", "조황비전"], correctAnswer: 0, explanation: "'사람 중엔 여포, 말 중엔 적토'라는 말이 있을 정도로 뛰어난 명마였습니다." },
    { id: 305, category: "삼국지", difficulty: "very_easy", question: "중국 원말명초 시기에 진수의 정사 기록을 바탕으로 소설 '삼국지연의'를 집필한 작가는 누구인가요?", options: ["시내암", "오승은", "나관중", "조설근"], correctAnswer: 2, explanation: "나관중이 쓴 '삼국지연의'는 동아시아에서 가장 널리 읽히는 고전 소설입니다." },
    { id: 306, category: "삼국지", difficulty: "very_easy", question: "후한 말기의 '난세의 간웅'으로 불리며, 헌제를 옹립하여 천하의 패권을 쥐고 훗날 위나라의 기틀을 마련한 인물은?", options: ["유비", "손권", "조조", "원소"], correctAnswer: 2, explanation: "조조는 뛰어난 지략과 용인술로 화북 지방을 통일한 삼국지의 핵심 인물입니다." },
    { id: 307, category: "삼국지", difficulty: "very_easy", question: "중국을 통일하고 천하를 셋으로 나눈 '삼국지'의 세 나라 이름이 바르게 짝지어진 것은?", options: ["초, 한, 제", "고구려, 백제, 신라", "위, 촉, 오", "명, 청, 원"], correctAnswer: 2, explanation: "조비의 위(魏), 유비의 촉(蜀), 손권의 오(吳) 세 나라가 천하를 다투었습니다." },
    { id: 308, category: "삼국지", difficulty: "very_easy", question: "동탁을 암살하기 위해 사도 왕윤이 미인계를 쓸 때 이용한 가상의 양녀로, 중국 4대 미녀 중 하나로 꼽히는 인물은?", options: ["대교", "초선", "소교", "손상향"], correctAnswer: 1, explanation: "초선은 동탁과 여포 사이를 이간질하는 결정적인 역할을 했습니다." },
    { id: 309, category: "삼국지", difficulty: "very_easy", question: "관우의 상징과도 같은 무기로, 무게가 무려 82근에 달하며 칼날에 청룡이 새겨져 있는 이 무기의 이름은?", options: ["방천화극", "청룡언월도", "장팔사모", "쌍고검"], correctAnswer: 1, explanation: "청룡언월도는 소설 속 관우의 맹장으로서의 위엄을 상징하는 무기입니다." },
    { id: 310, category: "삼국지", difficulty: "very_easy", question: "천하제일의 무력을 자랑했으나, 정원과 동탁 등 양아버지를 두 번이나 배신하여 장비에게 '성 셋 가진 종놈'이라 욕을 먹은 인물은?", options: ["여포", "화웅", "안량", "문추"], correctAnswer: 0, explanation: "여포는 무력은 뛰어나나 의리가 없어 결국 조조에게 처형당합니다." },
    { id: 311, category: "삼국지", difficulty: "very_easy", question: "유비 군대의 맹장 장비가, 조운이 아두를 구해오자 뒤쫓아오는 조조의 대군을 호통 한 번으로 물러나게 한 다리의 이름은?", options: ["낙양교", "장판교", "오장원", "기산"], correctAnswer: 1, explanation: "장비가 장판교를 끊고 호통을 친 일화는 장비의 용맹함을 보여주는 명장면입니다." },
    { id: 312, category: "삼국지", difficulty: "very_easy", question: "제갈량이 유비의 아들 유선을 위해 전쟁(북벌)에 나서기 전, 나라를 향한 충성심을 담아 올린 유명한 표문의 이름은?", options: ["출사표", "정기록", "진정표", "계백서"], correctAnswer: 0, explanation: "'출사표를 읽고 눈물을 흘리지 않으면 충신이 아니다'라는 말이 있을 정도로 명문입니다." },
    { id: 313, category: "삼국지", difficulty: "very_easy", question: "촉나라의 오호대장군 중 한 명으로, 당양현 장판파에서 조조의 대군을 뚫고 유비의 아들 아두를 품에 안고 구출해 낸 맹장은?", options: ["마초", "황충", "조운(자룡)", "위연"], correctAnswer: 2, explanation: "조자룡(조운)은 충성심과 무력을 두루 갖춘 완벽한 장수로 묘사됩니다." },
    { id: 314, category: "삼국지", difficulty: "very_easy", question: "삼국지 초반부, 누런 수건을 머리에 두른 농민들이 부패한 후한 조정에 맞서 일으킨 대규모 반란은?", options: ["황건적의 난", "홍건적의 난", "흑산적의 난", "백련교도의 난"], correctAnswer: 0, explanation: "장각이 이끈 황건적의 난은 삼국지 영웅들이 역사 무대에 등장하는 계기가 됩니다." },
    { id: 315, category: "삼국지", difficulty: "very_easy", question: "강동의 호랑이 손견의 아들이자 손책의 동생으로, 훗날 오나라를 세우고 황제에 오른 인물은?", options: ["손권", "주유", "노숙", "육손"], correctAnswer: 0, explanation: "손권은 수성(守城)에 뛰어난 군주로 오나라의 기틀을 다졌습니다." },

    // ==========================================
    // [삼국지] Level 2: 쉬움 (easy) - 15문제
    // ==========================================
    { id: 316, category: "삼국지", difficulty: "easy", question: "조조가 하북의 지배자 원소와 맞붙어, 식량 창고인 오소를 기습하여 수적 열세를 극복하고 대승을 거둔 전투는?", options: ["관도대전", "적벽대전", "이릉대전", "합비 전투"], correctAnswer: 0, explanation: "관도대전은 삼국지 3대 대전 중 하나로, 조조가 화북의 패자가 된 결정적 전투입니다." },
    { id: 317, category: "삼국지", difficulty: "easy", question: "여포가 동탁을 배신하기 전 사용하던 무기로, 창날 양옆에 초승달 모양의 칼날이 달린 강력한 무기는?", options: ["장팔사모", "방천화극", "청룡언월도", "유성추"], correctAnswer: 1, explanation: "방천화극은 여포의 무력과 맹렬함을 상징하는 무기입니다." },
    { id: 318, category: "삼국지", difficulty: "easy", question: "제갈량이 적벽대전 당시 조조군의 화살을 소모시키기 위해 안개 낀 밤 풀단으로 위장한 배를 타고 가 10만 개의 화살을 얻어온 계책은?", options: ["고육지계", "연환계", "차전차화", "초선차전(초인차전)"], correctAnswer: 3, explanation: "노숙과 함께 배를 타고 가 짚단으로 화살을 받아온 제갈량의 지략을 보여주는 일화입니다." },
    { id: 319, category: "삼국지", difficulty: "easy", question: "유비가 관우의 복수를 위해 오나라를 공격했으나, 육손의 화공에 말려 촉나라 군대가 궤멸적인 타격을 입은 전투는?", options: ["한중공방전", "번성 공방전", "이릉대전", "관도대전"], correctAnswer: 2, explanation: "이릉대전의 대패로 촉한은 국력이 크게 쇠퇴하고 유비는 백제성에서 병사합니다." },
    { id: 320, category: "삼국지", difficulty: "easy", question: "삼국지연의에서 장비가 사용한 무기로, 뱀처럼 구불구불한 칼날이 끝에 달려 있는 창의 이름은?", options: ["청룡언월도", "장팔사모", "쌍고검", "방천화극"], correctAnswer: 1, explanation: "장팔사모는 장비의 거친 성격과 어울리는 1장 8척 길이의 긴 창입니다." },
    { id: 321, category: "삼국지", difficulty: "easy", question: "적벽대전에서 오나라의 대도독으로 활약하며 연합군을 지휘했으나, 훗날 제갈량과의 지략 대결에 스트레스를 받아 일찍 요절한 인물은?", options: ["여몽", "육손", "노숙", "주유"], correctAnswer: 3, explanation: "주유는 '하늘은 어찌 주유를 낳고 또 제갈량을 낳으셨단 말인가'라는 유언을 남긴 것으로 소설에 묘사됩니다." },
    { id: 322, category: "삼국지", difficulty: "easy", question: "위나라의 군사이자 제갈량의 최대 라이벌로, 촉나라의 북벌을 번번이 막아냈으며 훗날 손자 사마염이 진(晉)나라를 세우는 기틀을 닦은 인물은?", options: ["곽가", "사마의", "순욱", "가후"], correctAnswer: 1, explanation: "사마의(사마중달)는 인내심과 지략으로 삼국 통일의 최종 승리자 가문이 됩니다." },
    { id: 323, category: "삼국지", difficulty: "easy", question: "유비, 관우, 장비의 호로관 전투에서 관우가 아직 무명 시절일 때, 술이 식기 전에 적장 화웅의 목을 베어 돌아온 일화가 있습니다. 이때 관우가 마신 술의 종류는?", options: ["차가운 술", "데운 술", "독주", "막걸리"], correctAnswer: 1, explanation: "'이 술이 식기 전에 돌아오겠소'라는 관우의 명대사로 유명합니다." },
    { id: 324, category: "삼국지", difficulty: "easy", question: "관우가 조조에게 포로로 잡혀있을 때 조조가 하사한 보물들을 모두 남겨두고 유비를 찾아 떠나며 5개의 관문을 돌파하고 6명의 장수를 벤 일화는?", options: ["단기필마", "오관참육장", "칠종칠금", "백의종군"], correctAnswer: 1, explanation: "오관참육장(五關斬六將)은 관우의 흔들리지 않는 충의를 보여주는 소설 속 명장면입니다." },
    { id: 325, category: "삼국지", difficulty: "easy", question: "촉나라의 늙은 맹장으로, 정군산 전투에서 위나라의 명장 하후연을 활과 칼로 베어 죽인 오호대장군의 일원은?", options: ["마초", "조운", "황충", "강유"], correctAnswer: 2, explanation: "황충은 노익장의 대명사로, 활쏘기의 명수이기도 했습니다." },
    { id: 326, category: "삼국지", difficulty: "easy", question: "조조가 서주를 정벌할 때, 자신의 부친(조숭)을 죽인 원수를 갚는다는 명분으로 서주의 백성들을 무참히 학살한 사건의 피해 지역은?", options: ["형주", "서주", "익주", "기주"], correctAnswer: 1, explanation: "조조의 서주 대학살은 그의 잔혹함을 보여주는 대표적인 역사적 오점입니다." },
    { id: 327, category: "삼국지", difficulty: "easy", question: "제갈량이 남만을 정벌할 때, 남만의 왕 맹획을 일곱 번 사로잡고 일곱 번 풀어주어 진심으로 항복하게 만든 고사성어는?", options: ["칠종칠금", "삼고초려", "오관참육장", "읍참마속"], correctAnswer: 0, explanation: "칠종칠금(七縱七擒)은 무력보다 마음을 얻어 다스리는 제갈량의 통치술을 보여줍니다." },
    { id: 328, category: "삼국지", difficulty: "easy", question: "유비가 서촉(익주)을 차지하기 전까지 오랜 기간 머물며 기반을 다졌던 곳으로, 위·촉·오 삼국이 가장 치열하게 영토 분쟁을 벌인 형주의 요충지는?", options: ["낙양", "장안", "형주", "건업"], correctAnswer: 2, explanation: "형주는 천하의 중심에 위치하여 적벽대전 이후 삼국의 각축장이 되었습니다." },
    { id: 329, category: "삼국지", difficulty: "easy", question: "조조가 죽은 후 그의 뒤를 이어 위나라 왕이 되었고, 한 헌제를 압박해 선양을 받아 위나라 초대 황제로 등극한 인물은?", options: ["조식", "조비", "조창", "조예"], correctAnswer: 1, explanation: "조비(위 문제)는 구품관인법을 실시하고 문학에도 재능이 뛰어났던 인물입니다." },
    { id: 330, category: "삼국지", difficulty: "easy", question: "오나라의 명장 여몽이 학문을 게을리하다가 주군의 권유로 글을 읽은 후 괄목상대(刮目相對)할 정도로 성장했다는 고사성어의 주인공은 누구의 권유를 받았나?", options: ["주유", "손권", "노숙", "육손"], correctAnswer: 1, explanation: "손권의 권유로 학문에 정진한 여몽은 훗날 관우를 포획하는 대공을 세웁니다." },

    // ==========================================
    // [삼국지] Level 3: 보통 (medium) - 15문제
    // ==========================================
    { id: 331, category: "삼국지", difficulty: "medium", question: "제갈량이 1차 북벌 당시, 군령을 어기고 가정(街亭) 산꼭대기에 진을 쳤다가 대패한 애제자 마속의 목을 눈물을 머금고 벤 고사성어는?", options: ["읍참마속", "토사구팽", "배수지진", "파죽지세"], correctAnswer: 0, explanation: "읍참마속(泣斬馬謖)은 사사로운 감정을 버리고 엄격하게 법을 집행함을 의미합니다." },
    { id: 332, category: "삼국지", difficulty: "medium", question: "적벽대전에서 조조군을 속이기 위해 오나라의 황개와 주유가 짜고, 황개가 스스로 곤장을 맞아 거짓 투항하게 한 계책은?", options: ["미인계", "반간계", "고육지계", "공성계"], correctAnswer: 2, explanation: "고육지계(苦肉之計)는 자신의 몸을 상하게 하면서까지 적을 속이는 계책입니다." },
    { id: 333, category: "삼국지", difficulty: "medium", question: "조조가 총애하던 참모로, '십승십패'를 논하며 관도대전의 승리를 예견했으나 요절하여 조조가 적벽대전 대패 후 그의 이름을 부르며 통곡한 인물은?", options: ["순욱", "곽가", "가후", "정욱"], correctAnswer: 1, explanation: "곽가(봉효)는 조조 진영 최고의 책사 중 한 명으로 일찍 병사했습니다." },
    { id: 334, category: "삼국지", difficulty: "medium", question: "유비 진영의 모사로 '봉추(鳳雛)'라 불리며 제갈량(와룡)과 쌍벽을 이루었으나, 낙봉파에서 화살에 맞아 일찍 전사한 인물은?", options: ["서서", "법정", "방통", "이적"], correctAnswer: 2, explanation: "방통은 외모는 볼품없었으나 뛰어난 지략을 가졌던 인물로 적벽대전에서 연환계를 짰습니다." },
    { id: 335, category: "삼국지", difficulty: "medium", question: "동탁 암살에 실패한 조조가 도망치던 중 여백사의 집에 머물 때, 오해로 인해 여백사 일가족을 몰살하고 남긴 조조의 유명한 명대사는?", options: ["내가 천하를 버릴지언정, 천하가 나를 버리게 하지는 않겠다.", "치세의 능신, 난세의 간웅.", "내 사전엔 불가능이란 없다.", "배신은 두 번 하지 않는다."], correctAnswer: 0, explanation: "이 대사는 소설 속 조조의 이기적이고 냉혹한 간웅으로서의 면모를 가장 잘 보여줍니다." },
    { id: 336, category: "삼국지", difficulty: "medium", question: "제갈량이 사마의의 대군이 몰려올 때, 성문을 활짝 열고 홀로 누각에서 거문고를 타며 복병이 있는 것처럼 속여 사마의를 퇴각시킨 계책은?", options: ["공성계", "성동격서", "암도진창", "차도살인"], correctAnswer: 0, explanation: "공성계(空城計)는 방어할 병력이 없을 때 오히려 성을 비워 적의 의심을 유발하는 심리전입니다." },
    { id: 337, category: "삼국지", difficulty: "medium", question: "조조의 핵심 참모였으나, 조조가 위공(魏公)에 오르는 것을 반대하다가 빈 도시락 상자(빈 찬합)를 받고 스스로 목숨을 끊은 인물은?", options: ["정욱", "순욱", "순유", "곽가"], correctAnswer: 1, explanation: "순욱은 한나라의 충신으로 남고자 했기에 조조의 야심을 막으려다 죽음을 맞이합니다." },
    { id: 338, category: "삼국지", difficulty: "medium", question: "관도대전에서 조조군이 원소군의 화살 공격을 막기 위해 벼락차(발석차)를 발명하여 돌을 날려 부순 원소군의 시설물은?", options: ["누각", "망루(정란)", "투석기", "지하 터널"], correctAnswer: 1, explanation: "원소군이 흙산을 쌓고 정란(망루) 위에서 화살을 쏘자 조조군은 발석차(벽력차)로 대응했습니다." },
    { id: 339, category: "삼국지", difficulty: "medium", question: "관우가 형주를 지키다가 오나라 여몽의 기습을 받고 포위되어, 아들 관평과 함께 처형당한 장소는?", options: ["맥성", "번성", "양양성", "강릉"], correctAnswer: 0, explanation: "관우는 맥성으로 퇴각해 농성하다가 탈출 중 붙잡혀 오나라 군에 의해 참수됩니다." },
    { id: 340, category: "삼국지", difficulty: "medium", question: "조비의 동생으로 무예가 출중하여 '황수아(노란 수염의 아이)'라 불렸으며, 북방 유목민 토벌에 큰 공을 세운 조조의 아들은?", options: ["조앙", "조식", "조충", "조창"], correctAnswer: 3, explanation: "조창은 용맹함으로 조조의 사랑을 받았으나 권력 투쟁에서는 조비에게 밀렸습니다." },
    { id: 341, category: "삼국지", difficulty: "medium", question: "관우의 죽음 이후 슬픔에 빠진 장비가 부하들에게 무리한 요구(흰 갑옷 제작)를 하다가 원한을 품은 부하 두 명에게 암살당합니다. 이 두 명의 부하 이름은?", options: ["범강, 장달", "이각, 곽사", "문추, 안량", "채모, 장윤"], correctAnswer: 0, explanation: "범강과 장달은 장비를 암살한 뒤 그 목을 들고 오나라로 도망칩니다." },
    { id: 342, category: "삼국지", difficulty: "medium", question: "유비가 서촉(익주)을 정벌할 때, 원래 유장 측의 모사였으나 지형도를 유비에게 바치며 촉 정벌의 일등 공신이 된 인물은?", options: ["장송", "맹달", "법정", "이엄"], correctAnswer: 0, explanation: "장송은 조조에게 버림받고 유비에게 서촉 지도를 바치며 훗날 법정과 함께 유비를 돕습니다." },
    { id: 343, category: "삼국지", difficulty: "medium", question: "오나라의 명장 여몽이 관우가 지키는 형주를 기습할 때, 병사들을 일반 백성이나 상인으로 위장시켜 관우의 봉화대를 무력화시킨 작전은?", options: ["백의도강", "암도진창", "성동격서", "수전지계"], correctAnswer: 0, explanation: "흰 옷을 입고 강을 건넜다는 뜻의 백의도강(白衣渡江)은 여몽의 뛰어난 지략을 보여줍니다." },
    { id: 344, category: "삼국지", difficulty: "medium", question: "조조가 암살 위협에 시달리며 주변을 극도로 경계하다가 생긴 일화로, 잠결에 이불을 덮어주던 시종을 칼로 베어 죽인 뒤 한 핑계는?", options: ["자객인 줄 알았다.", "나는 꿈속에서 사람을 죽인다.", "칼이 저절로 움직였다.", "아무도 내 곁에 오지 말라."], correctAnswer: 1, explanation: "조조는 '나는 꿈속에서 사람을 죽이는 버릇이 있다'며 자신의 경계심을 위장했습니다." },
    { id: 345, category: "삼국지", difficulty: "medium", question: "촉나라 오호대장군 중 하나인 마초의 아버지로, 동탁 토벌전에 참가했다가 훗날 이각과 곽사의 잔당에게 죽림을 당한(연의 기준) 혹은 조조에게 참수당한(정사 기준) 서량의 제후는?", options: ["마대", "마등", "한수", "동승"], correctAnswer: 1, explanation: "마등은 서량 지역을 지배하던 군벌로, 그의 죽음은 마초가 조조에게 반기를 드는 결정적 원인이 됩니다." },

    // ==========================================
    // [삼국지] Level 4: 어려움 (hard) - 15문제
    // ==========================================
    { id: 346, category: "삼국지", difficulty: "hard", question: "제갈량이 죽은 뒤, 촉나라의 군권을 쥐고 아홉 차례나 중원(북벌)을 공격했으나 위나라의 등애와 종회에게 막혀 뜻을 이루지 못한 촉의 대장군은?", options: ["위연", "강유", "마대", "왕평"], correctAnswer: 1, explanation: "강유는 원래 위나라 장수였으나 제갈량에게 귀순한 뒤 그의 병법을 물려받아 끝까지 촉한을 위해 싸웠습니다." },
    { id: 347, category: "삼국지", difficulty: "hard", question: "조조가 한중을 두고 유비와 대치할 때, 나아가기도 어렵고 물러나기도 아쉬운 애매한 상황을 암호(군호)로 삼아 전했던 닭의 갈비라는 뜻의 단어는?", options: ["계륵(鷄肋)", "토사구팽", "사면초가", "수어지교"], correctAnswer: 0, explanation: "양수(楊脩)가 이 '계륵'의 참뜻을 알아채고 철수를 준비하다가 조조의 노여움을 사 처형당합니다." },
    { id: 348, category: "삼국지", difficulty: "hard", question: "사마의의 두 아들로, 위나라의 실권을 완전히 장악하고 훗날 진(晉)나라 건국의 기틀을 다진 형제의 이름은?", options: ["사마사, 사마소", "사마염, 사마유", "사마랑, 사마부", "사마건, 사마륜"], correctAnswer: 0, explanation: "형 사마사와 동생 사마소는 위나라 황제를 허수아비로 만들고 조씨 정권을 전복시킵니다." },
    { id: 349, category: "삼국지", difficulty: "hard", question: "삼국지 최고의 명의(의사)로 꼽히며, 관우의 독화살 맞은 팔을 뼈를 긁어내며 치료해주었고 훗날 조조의 두통을 치료하려다 옥사한 인물은?", options: ["장중경", "화타", "편작", "동봉"], correctAnswer: 1, explanation: "화타는 최초로 마취제(마불산)를 발명했다고 전해지는 전설적인 명의입니다." },
    { id: 350, category: "삼국지", difficulty: "hard", question: "유비의 아내 미부인이 장판파에서 아두(유선)를 조운에게 맡기고 자결하기 위해 뛰어든 곳은?", options: ["절벽", "우물", "불길", "강물"], correctAnswer: 1, explanation: "미부인은 자신이 짐이 될 것을 염려해 우물에 뛰어들었고, 조운은 우물을 허물어 시신을 숨깁니다." },
    { id: 351, category: "삼국지", difficulty: "hard", question: "원소 휘하의 맹장이었으나, 관도대전 당시 조조군의 오소 식량 창고 기습을 막지 못해 패배의 책임을 뒤집어쓸 것을 두려워하여 조조에게 투항한 장수는?", options: ["안량", "문추", "장합", "고람"], correctAnswer: 2, explanation: "장합은 조조에게 투항한 후 위나라의 핵심 명장(오자양장)으로 크게 활약합니다." },
    { id: 352, category: "삼국지", difficulty: "hard", question: "동탁 사후 권력을 잡은 이각과 곽사의 횡포를 피해 헌제가 장안을 탈출했을 때, 그를 호위하여 낙양으로 모신 공로로 천하의 주도권을 쥐게 된 제후는?", options: ["원소", "원술", "조조", "마등"], correctAnswer: 2, explanation: "조조는 '천자를 끼고 제후들을 호령한다(협천자 이령제후)'는 전략으로 압도적인 명분을 얻었습니다." },
    { id: 353, category: "삼국지", difficulty: "hard", question: "오나라 손권이 요동의 공손연과 손을 잡기 위해 사신을 보냈다가, 공손연이 배신하여 오나라 사신의 목을 베어 위나라에 바친 사건이 있었습니다. 이때 죽은 오나라의 사신(학자)은?", options: ["장소", "장홍", "고옹", "제갈각"], correctAnswer: 1, explanation: "장홍은 손권의 곁에서 바른말을 하던 충신이었으나 요동 사행길에서 억울한 죽음을 맞았습니다." },
    { id: 354, category: "삼국지", difficulty: "hard", question: "촉한 멸망 시, 위나라 장수 등애가 험준한 산악 지대를 목숨을 걸고 돌파하여 촉의 심장부로 쳐들어간 작전 경로는?", options: ["검각", "음평 샛길", "기산", "오장원"], correctAnswer: 1, explanation: "등애는 아무도 예상 못한 음평의 절벽을 담요로 몸을 감고 굴러 내려가 성도를 기습했습니다." },
    { id: 355, category: "삼국지", difficulty: "hard", question: "조비의 동생으로 시재(시 짓는 재주)가 매우 뛰어나 조비의 견제를 받았으며, 일곱 걸음을 걷는 동안 시를 지어 목숨을 건진 '칠보시' 일화의 주인공은?", options: ["조창", "조식", "조앙", "조충"], correctAnswer: 1, explanation: "조식은 콩을 삶는 콩깍지에 빗대어 형제가 서로 해치는 것을 슬퍼하는 시를 지어 조비를 울렸습니다." },
    { id: 356, category: "삼국지", difficulty: "hard", question: "적벽대전 당시, 조조군의 배들을 쇠사슬로 묶게 만들어 화공의 효과를 극대화시킨 '연환계'를 조조에게 직접 제안한 인물은?", options: ["주유", "제갈량", "방통", "서서"], correctAnswer: 2, explanation: "방통은 조조 진영에 위장 잠입하여 배 멀미를 막는다는 핑계로 배들을 사슬로 묶게 꼬드겼습니다." },
    { id: 357, category: "삼국지", difficulty: "hard", question: "유비의 촉한 건국 개국 공신 중 한 명으로, 관우와 장비가 죽은 후 이릉대전에 출전하는 유비에게 유일하게 목숨을 걸고 직언하며 반대했던 인물은?", options: ["제갈량", "조운", "법정", "이엄"], correctAnswer: 1, explanation: "조운은 사사로운 원수(오나라)보다 국가적 대의(위나라 정벌)가 먼저라며 유비의 출병을 말렸습니다." },
    { id: 358, category: "삼국지", difficulty: "hard", question: "제갈량이 죽은 오장원 전투에서, 제갈량이 미리 나무로 깎아 만든 자신의 좌상(인형)을 수레에 태워 사마의의 추격군을 기겁하여 도망치게 한 일화에서 유래한 말은?", options: ["사공명 주생중달", "삼고초려", "읍참마속", "수어지교"], correctAnswer: 0, explanation: "'죽은 제갈량이 산 사마의를 도망치게 하다'라는 뜻의 죽은 후에도 위력을 떨친 제갈량의 일화입니다." },
    { id: 359, category: "삼국지", difficulty: "hard", question: "동탁을 처단한 여포를 쫓아내고 장안을 점령했던 이각과 곽사 무리 중, 훗날 헌제를 호위하던 조조군에게 패배하여 참수된 잔당의 우두머리 두 명 중 한 명은?", options: ["화웅", "이각", "이숙", "장제"], correctAnswer: 1, explanation: "이각과 곽사는 동탁 사후 잠시 권력을 잡았으나 내분과 조조의 개입으로 자멸했습니다." },
    { id: 360, category: "삼국지", difficulty: "hard", question: "손권의 여동생이자 유비의 부인이 된 인물로, 무예를 즐겨 시녀들에게 무장을 시키고 유비를 벌벌 떨게 했다는 당찬 여성은?", options: ["오국태", "대교", "손상향(손부인)", "보연사"], correctAnswer: 2, explanation: "손상향은 정략결혼으로 유비와 맺어졌으나 기가 세고 무예를 즐겼던 것으로 묘사됩니다." },

    // ==========================================
    // [삼국지] Level 5: 매우 어려움 (very_hard) - 15문제
    // ==========================================
    { id: 361, category: "삼국지", difficulty: "very_hard", question: "삼국지연의 1회에서 황건적의 난을 일으킨 장각, 장보, 장량 삼형제가 신봉하며 퍼뜨렸던 도교계통의 사이비 종교 이름은?", options: ["백련교", "오두미도", "태평도", "천사도"], correctAnswer: 2, explanation: "장각은 태평도를 창시하고 자신을 '대현양사'라 칭하며 수십만 명의 신도를 모아 반란을 일으켰습니다." },
    { id: 362, category: "삼국지", difficulty: "very_hard", question: "263년, 촉한 멸망의 결정적 계기가 된 전투로, 종회의 대군을 막던 강유가 굳게 지키고 있던 촉나라의 철벽 요새 이름은?", options: ["검각", "양평관", "백제성", "가맹관"], correctAnswer: 0, explanation: "검각은 천혜의 요새였으나, 등애가 음평 샛길로 우회하여 성도를 기습하면서 촉한은 멸망하게 됩니다." },
    { id: 363, category: "삼국지", difficulty: "very_hard", question: "사마의가 조조 일족(조상)을 축출하고 위나라의 실권을 완전히 장악한 249년의 친위 쿠데타 사건의 명칭은?", options: ["고평릉의 변", "십상시의 난", "황건적의 난", "팔왕의 난"], correctAnswer: 0, explanation: "사마의는 황제 조방이 조상과 함께 고평릉으로 참배를 간 틈을 타 낙양을 장악하고 조상 일파를 숙청했습니다." },
    { id: 364, category: "삼국지", difficulty: "very_hard", question: "유비가 서촉의 유장을 공격할 때, 유장의 부하로 낙성 방어를 지휘하며 유비군의 방통을 화살로 쏘아 죽인 촉장의 이름은?", options: ["장임", "엄안", "황권", "이엄"], correctAnswer: 0, explanation: "장임은 주군에 대한 충성심이 깊어 유비에게 끝까지 항복하지 않고 죽음을 택한 명장입니다." },
    { id: 365, category: "삼국지", difficulty: "very_hard", question: "촉한 멸망 후, 위나라 장수 종회와 결탁하여 등애를 모함하고 위나라에 반기를 들어 촉의 부흥을 도모하려다 실패하고 피살된 촉나라 마지막 대장군은?", options: ["장익", "요화", "강유", "왕평"], correctAnswer: 2, explanation: "강유는 거짓 항복 후 종회를 부추겨 반란을 일으키게 했으나 부하들의 배신으로 실패하고 자결합니다." },
    { id: 366, category: "삼국지", difficulty: "very_hard", question: "역사서 『정사 삼국지』를 편찬한 진수(陳壽)는 본래 어느 나라 출신의 학자(관료)였나요?", options: ["위나라", "촉나라", "오나라", "진(晉)나라"], correctAnswer: 1, explanation: "진수는 본래 촉한의 관료였으나 촉 멸망 후 서진(晉)에 출사하여 삼국지를 편찬했습니다." },
    { id: 367, category: "삼국지", difficulty: "very_hard", question: "원소가 공손찬을 멸망시키고 하북을 제패할 때 활약했던 원소 휘하의 4대 맹장(안량, 문추, 장합) 중 나머지 한 명의 이름은?", options: ["고람", "국의", "저수", "전풍"], correctAnswer: 0, explanation: "고람은 장합과 함께 관도대전 중 조조에게 투항하여 조조군의 장수로 활약하게 됩니다." },
    { id: 368, category: "삼국지", difficulty: "very_hard", question: "정사 삼국지에서 유비가 '조운의 담력은 온몸이 담덩어리다(일신시담)'라고 극찬했던 한중공방전 당시 조운의 대담한 심리전 계책은?", options: ["공성계", "만천과해", "배수지진", "성동격서"], correctAnswer: 0, explanation: "조운은 소수의 병력으로 조조의 대군을 맞이하자, 오히려 성문을 열고 깃발을 숨겨 조조군을 철수하게 만든 공성계를 썼습니다." },

    // --- [3.1] 로컬 데이터 관리자 (LocalDataManager) ---
    class LocalDataManager {
        getGameHistory() {
            return JSON.parse(localStorage.getItem('brainArenaHistory') || '[]');
        }
        saveGameResult(result) {
            const history = this.getGameHistory();
            history.push({
                ...result,
                timestamp: new Date().toLocaleDateString() + ' ' + new Date().toLocaleTimeString()
            });
            localStorage.setItem('brainArenaHistory', JSON.stringify(history));
        }
        getBestScore() {
            const history = this.getGameHistory();
            return history.length ? Math.max(...history.map(h => h.totalScore)) : 0;
        }
    }
    const dataManager = new LocalDataManager();

    // --- [3.4] 다크모드 및 사운드 시스템 ---
    let isDarkMode = localStorage.getItem('darkMode') === 'true';
    let soundEnabled = true;
    
    // 오디오 컨텍스트 (브라우저 내장 신디사이저)
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    
    function playSound(type) {
        if (!soundEnabled) return;
        if (audioCtx.state === 'suspended') audioCtx.resume();
        
        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        osc.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        
        if (type === 'correct') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(600, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
            gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            osc.start(); osc.stop(audioCtx.currentTime + 0.3);
        } else if (type === 'wrong') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(300, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(150, audioCtx.currentTime + 0.2);
            gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            osc.start(); osc.stop(audioCtx.currentTime + 0.3);
        }
    }

    function toggleDarkMode() {
        isDarkMode = !isDarkMode;
        document.body.classList.toggle('dark-mode', isDarkMode);
        document.getElementById('dark-mode-btn').innerText = isDarkMode ? "☀️ 라이트모드" : "🌙 다크모드";
        localStorage.setItem('darkMode', isDarkMode);
    }

    function toggleSound() {
        soundEnabled = !soundEnabled;
        document.getElementById('sound-btn').innerText = soundEnabled ? "🔊 사운드 ON" : "🔇 사운드 OFF";
    }

    // 초기 테마 설정
    if (isDarkMode) {
        document.body.classList.add('dark-mode');
        document.getElementById('dark-mode-btn').innerText = "☀️ 라이트모드";
    }

    // --- 점수 및 게임 로직 (2단계 기능 포함) ---
    class ScoreManager {
        calculateScore(isCorrect, timeSpent, consecutiveCorrect, hintUsed) {
            let score = 0;
            if (isCorrect) {
                score += 10;
                if (timeSpent < 10) score += 3;
                if (!hintUsed) score += 2;
                if (consecutiveCorrect >= 3) score += 3;
            }
            return score;
        }
    }
    const scoreManager = new ScoreManager();

    const gameModes = {
        full: { questions: 375, timeLimit: null },
        category: { questions: 15, timeLimit: null },
        speed: { questions: 75, timeLimit: 15 }
    };

    let activeQuestions = [], currentMode = null, currentQuestionIndex = 0;
    let stats = { totalScore: 0, correctAnswers: 0, totalQuestions: 0, hintsLeft: 3, currentStreak: 0 };
    let timerInterval = null, timeSpentOnCurrent = 0, questionStartTime = 0, isPaused = false;

    // --- 화면 및 게임 제어 ---
    function showScreen(id) {
        document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    function selectMode(mode) {
        currentMode = gameModes[mode];
        if (mode === 'category') {
            document.getElementById('category-selection').style.display = 'block';
            renderCategoryButtons();
        } else {
            initGame(mode, null);
        }
    }

    function renderCategoryButtons() {
        const categories = [...new Set(allQuizData.map(q => q.category))];
        const container = document.getElementById('category-container');
        container.innerHTML = '';
        categories.forEach(cat => {
            const btn = document.createElement('button');
            btn.className = 'primary-btn';
            btn.innerText = cat;
            btn.style.margin = '0';
            btn.onclick = () => initGame('category', cat);
            container.appendChild(btn);
        });
    }

    function initGame(modeName, category) {
        const difficulty = document.getElementById('difficulty-select').value;
        let pool = [...allQuizData];
        
        // 필터링 적용 (카테고리 및 난이도)
        if (category) pool = pool.filter(q => q.category === category);
        if (difficulty !== 'all') pool = pool.filter(q => q.difficulty === difficulty);
        
        if (pool.length === 0) {
            alert("선택한 조건에 맞는 문제가 없습니다. 난이도를 변경해 보세요!");
            return;
        }

        pool.sort(() => Math.random() - 0.5);
        activeQuestions = pool.slice(0, Math.min(pool.length, gameModes[modeName].questions));
        stats = { totalScore: 0, correctAnswers: 0, totalQuestions: activeQuestions.length, hintsLeft: 3, currentStreak: 0, mode: modeName };

        if (gameModes[modeName].timeLimit) document.getElementById('timer-container').style.display = 'block';
        showScreen('quiz-screen');
        loadQuestion();
    }

    function loadQuestion() {
        const q = activeQuestions[currentQuestionIndex];
        stats.currentHintUsed = false;
        timeSpentOnCurrent = 0;
        
        document.getElementById('progress-text').innerText = `${currentQuestionIndex + 1} / ${stats.totalQuestions}`;
        document.getElementById('score-display').innerText = `Score: ${stats.totalScore}`;
        document.getElementById('combo-display').innerText = stats.currentStreak > 1 ? `${stats.currentStreak} Combo! 🔥` : '';
        document.getElementById('hint-count').innerText = stats.hintsLeft;
        
        document.getElementById('question-text').innerText = q.question;
        const opts = document.getElementById('options-container');
        opts.innerHTML = '';
        
        q.options.forEach((opt, idx) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = opt;
            btn.onclick = () => handleAnswer(idx, btn);
            opts.appendChild(btn);
        });

        document.getElementById('feedback-area').style.display = 'none';
        questionStartTime = Date.now();
        if (currentMode.timeLimit) startTimer();
    }

    // --- 유틸리티 기능 ---
    function useHint() {
        if (stats.hintsLeft <= 0 || stats.currentHintUsed) return;
        const q = activeQuestions[currentQuestionIndex];
        const btns = document.querySelectorAll('.option-btn');
        const wrongIndices = [0, 1, 2, 3].filter(i => i !== q.correctAnswer).sort(() => Math.random() - 0.5);
        
        wrongIndices.slice(0, 2).forEach(idx => {
            btns[idx].disabled = true;
            btns[idx].style.opacity = '0.3';
        });
        stats.hintsLeft--; stats.currentHintUsed = true;
        document.getElementById('hint-count').innerText = stats.hintsLeft;
    }

    function startTimer() {
        clearInterval(timerInterval);
        const limit = currentMode.timeLimit;
        timerInterval = setInterval(() => {
            timeSpentOnCurrent = (Date.now() - questionStartTime) / 1000;
            let timeLeft = limit - timeSpentOnCurrent;
            const bar = document.getElementById('timer-bar');
            bar.style.width = `${(timeLeft / limit) * 100}%`;
            bar.style.backgroundColor = timeLeft > 5 ? '#198754' : '#dc3545';
            if (timeLeft <= 0) { clearInterval(timerInterval); handleAnswer(-1, null); }
        }, 100);
    }

    function handleAnswer(selectedIndex, selectedBtn) {
        clearInterval(timerInterval);
        timeSpentOnCurrent = (Date.now() - questionStartTime) / 1000;
        const q = activeQuestions[currentQuestionIndex];
        const isCorrect = (selectedIndex === q.correctAnswer);
        const btns = document.querySelectorAll('.option-btn');
        btns.forEach(b => b.disabled = true);

        if (isCorrect) {
            stats.correctAnswers++; stats.currentStreak++;
            if (selectedBtn) selectedBtn.classList.add('correct');
            playSound('correct');
        } else {
            stats.currentStreak = 0;
            if (selectedBtn) selectedBtn.classList.add('wrong');
            btns[q.correctAnswer].classList.add('correct');
            playSound('wrong');
        }

        stats.totalScore += scoreManager.calculateScore(isCorrect, timeSpentOnCurrent, stats.currentStreak, stats.currentHintUsed);
        
        document.getElementById('explanation').innerText = selectedIndex === -1 ? "⏰ 시간 초과!\n" + q.explanation : q.explanation;
        document.getElementById('score-display').innerText = `Score: ${stats.totalScore}`;
        
        const nextBtn = document.getElementById('next-btn');
        nextBtn.innerText = (currentQuestionIndex === stats.totalQuestions - 1) ? "최종 결과 보기" : "다음 문제";
        document.getElementById('feedback-area').style.display = 'block';
    }

    function nextQuestion() {
        currentQuestionIndex++;
        if (currentQuestionIndex < stats.totalQuestions) loadQuestion();
        else endGame();
    }

    // --- [3.2 & 3.5] 결과 및 클립보드 공유 ---
    function endGame() {
        showScreen('result-screen');
        const accuracy = Math.round((stats.correctAnswers / stats.totalQuestions) * 100);
        document.getElementById('res-score').innerText = stats.totalScore;
        document.getElementById('res-accuracy').innerText = `${accuracy}% (${stats.correctAnswers}/${stats.totalQuestions})`;
        
        // 데이터 저장
        dataManager.saveGameResult({
            score: stats.totalScore,
            accuracy: accuracy,
            mode: stats.mode
        });
    }

    function shareResult() {
        const text = `🧠 브레인 아레나 결과!\n🎯 모드: ${stats.mode}\n🏆 점수: ${stats.totalScore}점\n✅ 정답률: ${Math.round((stats.correctAnswers / stats.totalQuestions) * 100)}%`;
        navigator.clipboard.writeText(text).then(() => {
            alert("결과가 클립보드에 복사되었습니다! 친구들에게 공유해 보세요.");
        });
    }

    // --- [3.3] 통계 대시보드 렌더링 ---
    function renderDashboard() {
        const history = dataManager.getGameHistory();
        document.getElementById('dash-plays').innerText = `${history.length}회`;
        document.getElementById('dash-best').innerText = `${dataManager.getBestScore()}점`;

        const list = document.getElementById('dash-history');
        list.innerHTML = '';
        
        // 최신순 정렬 후 상위 5개 노출
        const recent = history.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp)).slice(0, 5);
        
        if (recent.length === 0) {
            list.innerHTML = '<li style="justify-content:center;">아직 플레이 기록이 없습니다.</li>';
            return;
        }

        recent.forEach(record => {
            const li = document.createElement('li');
            li.innerHTML = `
                <div><span style="color:var(--text-sub); font-size:0.8em; margin-right:10px;">${record.timestamp.split(' ')[0]}</span> <strong>${record.mode.toUpperCase()}</strong></div>
                <div style="font-weight:bold;">${record.score}점 <span style="font-size:0.8em; color:var(--text-sub);">(${record.accuracy}%)</span></div>
            `;
            list.appendChild(li);
        });
    }

</script>
