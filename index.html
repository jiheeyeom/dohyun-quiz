<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>브레인 아레나 - 파이널 에디션</title>
    <style>
        /* [3.4] CSS 변수를 활용한 다크모드/라이트모드 지원 */
        :root {
            --bg-color: #f0f2f5;
            --container-bg: #ffffff;
            --text-main: #333333;
            --text-sub: #6c757d;
            --primary-btn-bg: #e7f1ff;
            --primary-btn-text: #0d6efd;
            --primary-btn-border: #b6d4fe;
            --action-btn-bg: #0d6efd;
            --action-btn-hover: #0b5ed7;
            --option-bg: #f8f9fa;
            --option-border: #dee2e6;
            --option-hover: #e2e6ea;
            --border-color: #dee2e6;
            --card-bg: #f8f9fa;
        }

        body.dark-mode {
            --bg-color: #121212;
            --container-bg: #1e1e1e;
            --text-main: #f0f0f0;
            --text-sub: #a0a0a0;
            --primary-btn-bg: #2c3e50;
            --primary-btn-text: #6ea8fe;
            --primary-btn-border: #4a6fa5;
            --action-btn-bg: #3b82f6;
            --action-btn-hover: #2563eb;
            --option-bg: #2d2d2d;
            --option-border: #444444;
            --option-hover: #3d3d3d;
            --border-color: #444444;
            --card-bg: #2a2a2a;
        }

        body { font-family: 'Pretendard', sans-serif; background-color: var(--bg-color); color: var(--text-main); display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; transition: background-color 0.3s, color 0.3s; }
        .app-container { background-color: var(--container-bg); border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.1); width: 100%; max-width: 500px; padding: 30px; box-sizing: border-box; position: relative; overflow: hidden; transition: background-color 0.3s; }
        h1, h2, h3 { text-align: center; margin-top: 0; }
        
        button { font-family: inherit; cursor: pointer; border-radius: 8px; transition: all 0.2s ease; border: none; color: var(--text-main); }
        .screen { display: none; }
        .screen.active { display: block; animation: fadeIn 0.4s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* 버튼 스타일 */
        .primary-btn { display: block; width: 100%; padding: 15px; margin-bottom: 10px; background-color: var(--primary-btn-bg); color: var(--primary-btn-text); border: 2px solid var(--primary-btn-border); font-size: 1.1em; font-weight: bold; }
        .primary-btn:hover { filter: brightness(0.95); }
        .action-btn { width: 100%; padding: 15px; background-color: var(--action-btn-bg); color: white; font-size: 1.1em; font-weight: bold; margin-bottom: 10px; }
        .action-btn:hover { background-color: var(--action-btn-hover); }
        
        /* 유틸리티 바 (다크모드, 사운드 등) */
        .utility-bar { display: flex; justify-content: space-between; margin-bottom: 20px; border-bottom: 1px solid var(--border-color); padding-bottom: 15px; }
        .util-btn { background: transparent; border: 1px solid var(--border-color); padding: 5px 10px; font-size: 0.9em; border-radius: 4px; color: var(--text-main); }
        
        /* 퀴즈 UI */
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; background: var(--card-bg); padding: 10px; border-radius: 8px; }
        .stat-badge { font-weight: bold; font-size: 0.9em; color: var(--text-sub); }
        .combo-text { color: #dc3545; font-weight: bold; animation: pop 0.3s ease; }
        #timer-container { width: 100%; height: 8px; background-color: var(--border-color); border-radius: 4px; margin-bottom: 20px; overflow: hidden; display: none; }
        #timer-bar { height: 100%; width: 100%; background-color: #198754; transition: width 0.1s linear; }

        .quiz-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        #question-text { font-size: 1.2em; text-align: left; margin-bottom: 25px; line-height: 1.4; word-break: keep-all; }
        
        .option-btn { display: block; width: 100%; padding: 15px; margin-bottom: 10px; background-color: var(--option-bg); border: 2px solid var(--option-border); font-size: 1em; text-align: left; color: var(--text-main); }
        .option-btn:hover:not(:disabled) { background-color: var(--option-hover); }
        .option-btn:disabled { cursor: not-allowed; opacity: 0.5; }
        
        /* 정답/오답 명시성 (다크모드에서도 잘 보이도록) */
        .option-btn.correct { background-color: #198754 !important; border-color: #146c43 !important; color: white !important; opacity: 1; }
        .option-btn.wrong { background-color: #dc3545 !important; border-color: #b02a37 !important; color: white !important; opacity: 1; }

        #feedback-area { margin-top: 20px; padding-top: 20px; border-top: 1px solid var(--border-color); display: none; }
        #explanation { font-size: 0.95em; color: var(--text-sub); margin-bottom: 15px; line-height: 1.5; }

        /* 결과 & 대시보드 UI */
        .result-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 20px 0; }
        .result-box { background: var(--card-bg); padding: 15px; border-radius: 8px; text-align: center; border: 1px solid var(--border-color); }
        .result-box div:first-child { font-size: 0.85em; color: var(--text-sub); margin-bottom: 5px; }
        .result-box div:last-child { font-size: 1.2em; font-weight: bold; color: var(--primary-btn-text); }
        
        .dashboard-list { list-style: none; padding: 0; margin: 0; }
        .dashboard-list li { background: var(--card-bg); margin-bottom: 8px; padding: 12px; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; border-left: 4px solid var(--primary-btn-text); font-size: 0.9em; }

        /* 옵션 선택 영역 */
        .select-group { margin-bottom: 15px; text-align: left; }
        .select-group select { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid var(--border-color); background: var(--container-bg); color: var(--text-main); font-family: inherit; }

        @keyframes pop { 0% { transform: scale(1); } 50% { transform: scale(1.2); } 100% { transform: scale(1); } }
    </style>
</head>
<body>

<div class="app-container">

    <div id="start-screen" class="screen active">
        <div class="utility-bar">
            <button class="util-btn" onclick="toggleDarkMode()" id="dark-mode-btn">🌙 다크모드</button>
            <button class="util-btn" onclick="toggleSound()" id="sound-btn">🔊 사운드 ON</button>
            <button class="util-btn" onclick="showScreen('dashboard-screen'); renderDashboard();">📊 내 대시보드</button>
        </div>

        <h1>브레인 아레나 🧠</h1>
        
        <div class="select-group">
            <label style="font-size: 0.9em; color: var(--text-sub);">난이도 선택</label>
            <select id="difficulty-select">
    <option value="all">모든 난이도 (랜덤)</option>
    <option value="very_easy">매우 쉬움 (Level 1)</option>
    <option value="easy">쉬움 (Level 2)</option>
    <option value="medium">보통 (Level 3)</option>
    <option value="hard">어려움 (Level 4)</option>
    <option value="very_hard">매우 어려움 (Level 5)</option>
</select>
        </div>

        <button class="primary-btn" onclick="selectMode('full')">전체 도전 모드 (375문제)</button>
        <button class="primary-btn" onclick="selectMode('speed')">스피드 퀴즈 모드 (15초 제한)</button>
        <button class="primary-btn" onclick="selectMode('category')">카테고리 집중 모드</button>
        
        <div id="category-selection" style="display:none; margin-top: 15px; padding-top: 15px; border-top: 1px solid var(--border-color);">
            <div id="category-container" style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;"></div>
        </div>
    </div>

    <div id="quiz-screen" class="screen">
        <div class="top-bar">
            <span class="stat-badge" id="combo-display">0 Combo</span>
            <div>
                <button class="util-btn" id="hint-btn" onclick="useHint()" style="background:#ffc107; color:#000; border:none; font-weight:bold;">힌트 (<span id="hint-count">3</span>)</button>
                <button class="util-btn" onclick="togglePause()">일시정지</button>
            </div>
        </div>
        
        <div id="timer-container"><div id="timer-bar"></div></div>
        
        <div class="quiz-header">
            <div id="progress-text"></div>
            <div id="score-display" class="stat-badge" style="color:var(--primary-btn-text);">Score: 0</div>
        </div>
        
        <h2 id="question-text">문제 텍스트</h2>
        <div id="options-container" tabindex="0"></div>
        
        <div id="feedback-area">
            <p id="explanation"></p>
            <button class="action-btn" id="next-btn" onclick="nextQuestion()">다음 문제</button>
        </div>
    </div>

    <div id="result-screen" class="screen">
        <h2>게임 종료! 🎉</h2>
        <div class="result-grid">
            <div class="result-box"><div>최종 점수</div><div id="res-score">0</div></div>
            <div class="result-box"><div>정답률</div><div id="res-accuracy">0%</div></div>
        </div>
        
        <button class="action-btn" onclick="shareResult()">결과 클립보드에 복사 📋</button>
        <button class="primary-btn" onclick="location.reload()">타이틀로 돌아가기</button>
        <button class="primary-btn" onclick="showScreen('dashboard-screen'); renderDashboard();">내 통계 보기</button>
    </div>

    <div id="dashboard-screen" class="screen">
        <h2>내 통계 대시보드 📊</h2>
        
        <div class="result-grid">
            <div class="result-box"><div>총 플레이 횟수</div><div id="dash-plays">0회</div></div>
            <div class="result-box"><div>개인 최고 점수</div><div id="dash-best">0점</div></div>
        </div>

        <h3 style="font-size: 1em; text-align: left; color: var(--text-sub); margin-top: 20px;">최근 플레이 기록 (Top 5)</h3>
        <ul class="dashboard-list" id="dash-history"></ul>

        <button class="action-btn" onclick="location.reload()" style="margin-top: 20px;">타이틀로 돌아가기</button>
    </div>

</div>

<script>
    // ==========================================
    // 데이터 삽입 영역 (375문제 배열)
    // ==========================================
  const allQuizData = [
    // ==========================================
    // [한국사] Level 1: 매우 쉬움 (very_easy) - 15문제
    // ==========================================
    { id: 1, category: "한국사", difficulty: "very_easy", question: "기원전 2333년, 한반도 최초의 국가인 고조선을 건국했다고 전해지는 인물은?", options: ["주몽", "단군왕검", "박혁거세", "수로왕"], correctAnswer: 1, explanation: "단군왕검은 홍익인간의 이념을 바탕으로 고조선을 건국했습니다." },
    { id: 2, category: "한국사", difficulty: "very_easy", question: "1443년 백성들이 쉽게 글을 읽고 쓸 수 있도록 훈민정음(한글)을 창제한 조선의 왕은?", options: ["태조", "세종대왕", "영조", "정조"], correctAnswer: 1, explanation: "세종대왕은 집현전 학자들과 함께 한글을 창제하여 1446년 반포했습니다." },
    { id: 3, category: "한국사", difficulty: "very_easy", question: "1592년 발발한 임진왜란 당시, 거북선과 판옥선을 이끌고 조선 수군을 승리로 이끈 성웅은?", options: ["강감찬", "이순신", "을지문덕", "권율"], correctAnswer: 1, explanation: "이순신 장군은 한산도 대첩, 명량 대첩 등에서 왜군을 크게 물리쳤습니다." },
    { id: 4, category: "한국사", difficulty: "very_easy", question: "1919년 3월 1일 일어난 민족 해방 운동의 이름은 무엇인가요?", options: ["3.1 운동", "6.10 만세운동", "물산장려운동", "동학농민운동"], correctAnswer: 0, explanation: "3.1 운동은 일제의 식민 통치에 항거하여 전국적으로 일어난 최대 규모의 만세 운동입니다." },
    { id: 5, category: "한국사", difficulty: "very_easy", question: "대한민국이 일본의 식민 지배에서 벗어나 빛을 되찾은 '광복절'은 언제인가요?", options: ["3월 1일", "7월 17일", "8월 15일", "10월 3일"], correctAnswer: 2, explanation: "1945년 8월 15일 일본이 항복하면서 대한민국은 광복을 맞이했습니다." },
    { id: 6, category: "한국사", difficulty: "very_easy", question: "668년, 고구려를 멸망시키며 한반도 최초로 삼국 통일을 이룩한 국가는?", options: ["고구려", "백제", "신라", "가야"], correctAnswer: 2, explanation: "신라는 나당 연합군을 결성하여 백제와 고구려를 차례로 멸망시키고 삼국을 통일했습니다." },
    { id: 7, category: "한국사", difficulty: "very_easy", question: "1392년 위화도 회군을 계기로 고려를 무너뜨리고 조선을 건국한 태조의 이름은?", options: ["이성계", "이방원", "왕건", "최영"], correctAnswer: 0, explanation: "이성계는 신진 사대부와 결탁하여 조선을 건국하고 한양으로 도읍을 옮겼습니다." },
    { id: 8, category: "한국사", difficulty: "very_easy", question: "1950년 6월 25일 북한의 남침으로 한반도에서 발발한 전쟁은?", options: ["청일전쟁", "임진왜란", "병자호란", "6.25 전쟁"], correctAnswer: 3, explanation: "6.25 전쟁은 1950년에 발발하여 1953년에 정전 협정이 체결되었습니다." },
    { id: 9, category: "한국사", difficulty: "very_easy", question: "1909년, 만주 하얼빈 역에서 한국 침략의 원흉인 이토 히로부미를 사살한 독립운동가는?", options: ["김구", "안중근", "윤봉길", "유관순"], correctAnswer: 1, explanation: "안중근 의사는 대한제국의 주권을 뺏은 이토 히로부미를 처단했습니다." },
    { id: 10, category: "한국사", difficulty: "very_easy", question: "고려를 건국하고 후삼국을 통일한 고려의 제1대 왕은?", options: ["궁예", "견훤", "왕건", "광종"], correctAnswer: 2, explanation: "왕건은 918년 고려를 건국하고 936년 후삼국을 통일했습니다." },
    { id: 11, category: "한국사", difficulty: "very_easy", question: "조선 시대 한양을 둘러싼 4대문 중, 현재 '남대문'으로 불리며 국보 1호로 지정된 건축물은?", options: ["흥인지문", "숭례문", "돈의문", "숙정문"], correctAnswer: 1, explanation: "숭례문은 조선 시대 한양 도성의 정문으로 예를 숭상한다는 뜻을 담고 있습니다." },
    { id: 12, category: "한국사", difficulty: "very_easy", question: "고구려의 전성기를 이끌며 영토를 크게 확장하여 만주 지역까지 세력을 넓힌 왕은?", options: ["광개토대왕", "장수왕", "소수림왕", "동명성왕"], correctAnswer: 0, explanation: "광개토대왕은 활발한 정복 활동으로 고구려의 영토를 크게 넓혔습니다." },
    { id: 13, category: "한국사", difficulty: "very_easy", question: "조선 후기, 실학을 집대성하고 수원 화성을 설계한 학자는?", options: ["이황", "이이", "정약용", "박지원"], correctAnswer: 2, explanation: "다산 정약용은 거중기를 발명하여 수원 화성 축조에 큰 기여를 했습니다." },
    { id: 14, category: "한국사", difficulty: "very_easy", question: "1919년 3.1 운동 당시, 아우내 장터에서 만세 운동을 주도하다 서대문 형무소에서 순국한 인물은?", options: ["유관순", "신사임당", "나혜석", "김마리아"], correctAnswer: 0, explanation: "유관순 열사는 어린 나이에도 일제에 굴하지 않고 독립 만세 운동을 이끌었습니다." },
    { id: 15, category: "한국사", difficulty: "very_easy", question: "신라 시대, 화랑도를 국가적인 조직으로 개편하고 진흥왕 순수비를 세운 왕은?", options: ["지증왕", "법흥왕", "진흥왕", "무열왕"], correctAnswer: 2, explanation: "진흥왕은 한강 유역을 차지하고 화랑도를 개편하여 삼국 통일의 기반을 마련했습니다." },

    // ==========================================
    // [한국사] Level 2: 쉬움 (easy) - 15문제
    // ==========================================
    { id: 16, category: "한국사", difficulty: "easy", question: "698년, 고구려 멸망 후 유민들을 이끌고 동모산에서 '발해'를 건국한 인물은?", options: ["주몽", "대조영", "장보고", "궁예"], correctAnswer: 1, explanation: "대조영은 말갈족과 고구려 유민을 통합하여 발해를 세웠습니다." },
    { id: 17, category: "한국사", difficulty: "easy", question: "612년, 살수(청천강)에서 수나라의 30만 대군을 크게 무찌른 고구려의 장군은?", options: ["을지문덕", "연개소문", "강감찬", "계백"], correctAnswer: 0, explanation: "을지문덕의 살수대첩은 한국사에서 가장 위대한 승리 중 하나로 꼽힙니다." },
    { id: 18, category: "한국사", difficulty: "easy", question: "고려 시대 부처의 힘으로 몽골의 침입을 막아내기 위해 목판에 새겨 만든 불교 경전은?", options: ["무구정광대다라니경", "직지심체요절", "팔만대장경", "조선왕조실록"], correctAnswer: 2, explanation: "합천 해인사에 보관된 팔만대장경은 고려 시대 몽골 항쟁의 상징입니다." },
    { id: 19, category: "한국사", difficulty: "easy", question: "1932년 상하이 훙커우 공원에서 열린 일본 전승 기념식장에 폭탄을 투척한 독립운동가는?", options: ["안중근", "윤봉길", "이봉창", "김원봉"], correctAnswer: 1, explanation: "윤봉길 의사의 의거는 침체된 독립운동에 활기를 불어넣고 중국의 지원을 이끌어냈습니다." },
    { id: 20, category: "한국사", difficulty: "easy", question: "조선 시대 왕의 곁에서 역사를 기록하고 편찬하는 업무를 담당했던 관청은?", options: ["춘추관", "승정원", "사헌부", "홍문관"], correctAnswer: 0, explanation: "춘추관은 역사 기록을 전담하여 훗날 조선왕조실록 편찬의 기초를 마련했습니다." },
    { id: 21, category: "한국사", difficulty: "easy", question: "1894년, 전봉준을 중심으로 부패한 관리와 외세에 맞서 농민들이 일으킨 대규모 사회 개혁 운동은?", options: ["동학 농민 운동", "갑신정변", "임술 농민 봉기", "홍경래의 난"], correctAnswer: 0, explanation: "동학 농민 운동은 반봉건, 반외세의 기치를 내건 근대 민족 운동입니다." },
    { id: 22, category: "한국사", difficulty: "easy", question: "조선 후기, 서양의 문물(천주교 등)과 세력을 배척하기 위해 흥선대원군이 전국 각지에 세운 비석은?", options: ["진흥왕 순수비", "척화비", "대첩비", "황초령비"], correctAnswer: 1, explanation: "흥선대원군은 병인양요와 신미양요를 겪은 후 통상 수교 거부 의지를 담은 척화비를 세웠습니다." },
    { id: 23, category: "한국사", difficulty: "easy", question: "1960년 4월 19일, 이승만 정권의 3.15 부정 선거에 항거하여 일어난 민주주의 혁명은?", options: ["5.18 민주화 운동", "4.19 혁명", "6월 민주 항쟁", "부마 민주 항쟁"], correctAnswer: 1, explanation: "4.19 혁명은 학생과 시민이 중심이 되어 독재 정권을 무너뜨린 민주주의 혁명입니다." },
    { id: 24, category: "한국사", difficulty: "easy", question: "고려 말, 화약 제조법을 알아내어 화통도감을 설치하고 진포 대첩에서 왜구를 크게 무찌른 인물은?", options: ["최무선", "이종무", "장영실", "이순신"], correctAnswer: 0, explanation: "최무선은 우리나라 최초로 화약을 개발하여 왜구 격퇴에 큰 공을 세웠습니다." },
    { id: 25, category: "한국사", difficulty: "easy", question: "일제강점기인 1919년, 상하이에 수립되어 독립운동을 총지휘한 기관의 이름은?", options: ["조선 총독부", "대한민국 임시 정부", "독립 협회", "신민회"], correctAnswer: 1, explanation: "대한민국 임시 정부는 3.1 운동을 계기로 수립된 최초의 민주 공화제 정부입니다." },
    { id: 26, category: "한국사", difficulty: "easy", question: "백제 제25대 왕으로, 웅진(공주) 시기에 지방을 통제하기 위해 22담로에 왕족을 파견한 왕은?", options: ["고이왕", "근초고왕", "무령왕", "성왕"], correctAnswer: 2, explanation: "무령왕은 22담로 파견과 양나라와의 교류를 통해 백제의 부흥을 이끌었습니다." },
    { id: 27, category: "한국사", difficulty: "easy", question: "1920년 김좌진 장군이 이끄는 북로 군정서군 등이 만주에서 일본군을 크게 대파한 전투는?", options: ["봉오동 전투", "청산리 대첩", "진주 대첩", "행주 대첩"], correctAnswer: 1, explanation: "청산리 대첩은 무장 독립 전쟁 사상 가장 빛나는 승리로 기록됩니다." },
    { id: 28, category: "한국사", difficulty: "easy", question: "조선 태종 때, 백성들의 억울한 일을 왕이 직접 듣고 해결해주기 위해 대궐 밖에 설치한 북의 이름은?", options: ["신문고", "자격루", "앙부일구", "혼천의"], correctAnswer: 0, explanation: "신문고는 백성의 억울함을 달래고 여론을 수렴하기 위한 제도였습니다." },
    { id: 29, category: "한국사", difficulty: "easy", question: "신라 시대 고분 중 유일하게 무덤의 주인이 누구인지 명확히 밝혀져 있는 웅진(공주) 지역의 무덤은?", options: ["천마총", "장군총", "무령왕릉", "황남대총"], correctAnswer: 2, explanation: "무령왕릉은 1971년 우연히 발견되어 백제 무덤 구조와 교류사를 밝히는 핵심 유적이 되었습니다." },
    { id: 30, category: "한국사", difficulty: "easy", question: "고려 전기, 거란의 1차 침입 때 뛰어난 외교 담판으로 강동 6주를 획득한 문신은?", options: ["강감찬", "서희", "윤관", "김종서"], correctAnswer: 1, explanation: "서희는 고려의 영토를 압록강 유역까지 확장하는 외교적 성과를 거두었습니다." },

    { id: 31, category: "한국사", difficulty: "medium", question: "고려 인종 때 묘청 등이 풍수지리설을 내세워 수도를 개경에서 다른 곳으로 옮길 것을 주장한 사건은?", options: ["위화도 회군", "서경 천도 운동", "무신 정변", "삼별초의 항쟁"], correctAnswer: 1, explanation: "묘청의 서경(평양) 천도 운동은 김부식이 이끄는 관군에 의해 진압되었습니다." },
    { id: 32, category: "한국사", difficulty: "medium", question: "조선 건국의 이념적 기틀을 마련하고 '경국대전'의 모태가 된 '조선경국전'을 편찬한 인물은?", options: ["정몽주", "정도전", "이색", "조광조"], correctAnswer: 1, explanation: "정도전은 태조 이성계를 도와 조선 건국을 주도한 핵심 개국 공신입니다." },
    { id: 33, category: "한국사", difficulty: "medium", question: "1636년 청나라의 침입으로 발발했으며, 인조가 남한산성으로 피난을 갔으나 결국 삼전도에서 굴욕적인 항복을 한 전쟁은?", options: ["임진왜란", "정묘호란", "병자호란", "나선정벌"], correctAnswer: 2, explanation: "병자호란으로 인해 조선은 청나라와 군신 관계를 맺게 되었습니다." },
    { id: 34, category: "한국사", difficulty: "medium", question: "1876년, 일본의 운요호 사건을 빌미로 체결된 조선 최초의 근대적 조약이자 불평등 조약은?", options: ["강화도 조약", "을사늑약", "조미 수호 통상 조약", "한성 조약"], correctAnswer: 0, explanation: "조일 수호 조규(강화도 조약) 체결로 조선은 부산, 원산, 인천 3개 항구를 개항했습니다." },
    { id: 35, category: "한국사", difficulty: "medium", question: "1895년, 일본의 자객들이 경복궁에 난입하여 조선의 국모인 명성황후를 시해한 사건의 명칭은?", options: ["임오군란", "갑신정변", "을미사변", "아관파천"], correctAnswer: 2, explanation: "을미사변 직후 분노한 백성들은 단발령 등에 반발하여 항일 의병 운동을 일으켰습니다." },
    { id: 36, category: "한국사", difficulty: "medium", question: "고려 시대, 김부식이 왕명에 따라 기전체 형식으로 편찬한 우리나라에 현존하는 가장 오래된 역사서는?", options: ["삼국유사", "삼국사기", "고려사", "동국통감"], correctAnswer: 1, explanation: "1145년에 편찬된 삼국사기는 유교적 합리주의 사관을 바탕으로 쓰였습니다." },
    { id: 37, category: "한국사", difficulty: "medium", question: "1884년, 김옥균, 박영효 등 급진 개화파가 청의 간섭에서 벗어나 근대 국가를 건설하기 위해 일으킨 정변은?", options: ["임오군란", "갑신정변", "동학 농민 운동", "갑오개혁"], correctAnswer: 1, explanation: "갑신정변은 3일 만에 실패로 끝났으나, 위로부터의 근대화 운동이라는 의의가 있습니다." },
    { id: 38, category: "한국사", difficulty: "medium", question: "1907년, 고종이 일제의 을사늑약의 부당함을 알리기 위해 네덜란드 헤이그에서 열린 만국 평화 회의에 파견한 특사 3인은?", options: ["이준, 이상설, 이위종", "김구, 윤봉길, 이봉창", "안창호, 양기탁, 신채호", "서재필, 이상재, 윤치호"], correctAnswer: 0, explanation: "일제는 헤이그 특사 파견을 빌미로 고종을 강제 퇴위시켰습니다." },
    { id: 39, category: "한국사", difficulty: "medium", question: "조선 영조 때 붕당의 대립을 완화하고 왕권을 강화하기 위해 각 붕당의 인재를 고르게 등용했던 정책은?", options: ["탕평책", "호포제", "균역법", "대동법"], correctAnswer: 0, explanation: "영조는 탕평책을 실시하고 성균관에 탕평비를 세워 붕당 정치의 폐해를 막고자 했습니다." },
    { id: 40, category: "한국사", difficulty: "medium", question: "1896년 서재필 등이 중심이 되어 창립하였으며, '만민 공동회'를 개최하여 자주독립과 자유 민권 사상을 고취한 단체는?", options: ["독립협회", "신민회", "대한 자강회", "신간회"], correctAnswer: 0, explanation: "독립협회는 독립문을 건립하고 대중적인 집회를 통해 민중 계몽에 힘썼습니다." },
    { id: 41, category: "한국사", difficulty: "medium", question: "고려 후기, 원나라의 간섭기에서 벗어나기 위해 몽골풍을 폐지하고 쌍성총관부를 공격하여 영토를 수복한 왕은?", options: ["태조", "광종", "성종", "공민왕"], correctAnswer: 3, explanation: "공민왕은 반원 자주 정책을 강력하게 추진하여 고려의 자주성을 회복하려 했습니다." },
    { id: 42, category: "한국사", difficulty: "medium", question: "1927년, 일제강점기에 비타협적 민족주의 세력과 사회주의 세력이 연합하여 결성한 최대 규모의 항일 민족 운동 단체는?", options: ["신민회", "신간회", "의열단", "근우회"], correctAnswer: 1, explanation: "신간회는 이념의 차이를 넘어 민족의 역량을 하나로 모으려 한 좌우 합작 단체입니다." },
    { id: 43, category: "한국사", difficulty: "medium", question: "조선 시대 군포의 부담을 줄여주기 위해 영조 대에 기존의 2필에서 1필로 감면해준 조세 제도는?", options: ["대동법", "균역법", "영정법", "호포법"], correctAnswer: 1, explanation: "균역법 시행으로 줄어든 재정은 결작, 선무군관포 등으로 보충했습니다." },
    { id: 44, category: "한국사", difficulty: "medium", question: "1987년, 박종철 고문 치사 사건과 4.13 호헌 조치에 반발하여 전국적으로 일어났으며, 결국 대통령 직선제 개헌을 이끌어낸 민주화 운동은?", options: ["4.19 혁명", "5.18 민주화 운동", "6월 민주 항쟁", "부마 민주 항쟁"], correctAnswer: 2, explanation: "6월 민주 항쟁의 결과로 6.29 민주화 선언이 발표되어 대통령 직선제가 도입되었습니다." },
    { id: 45, category: "한국사", difficulty: "medium", question: "조선 후기 광해군 때 처음 실시되었으며, 특산물 대신 쌀이나 베, 돈 등으로 세금을 통일하여 징수하게 한 제도는?", options: ["조세제", "대동법", "균역법", "과전법"], correctAnswer: 1, explanation: "대동법의 실시로 방납의 폐단이 줄어들고 공인이 등장하여 상품 화폐 경제가 발달했습니다." },

    { id: 46, category: "한국사", difficulty: "hard", question: "신라 시대의 엄격한 신분 제도로, 출신 성분에 따라 관직 승진의 한계와 일상생활까지 규제했던 제도의 이름은?", options: ["골품제", "화랑도", "민정문서", "상수리 제도"], correctAnswer: 0, explanation: "골품제는 성골, 진골과 6두품~1두품으로 나뉘었으며, 6두품은 승진에 큰 제한을 받았습니다." },
    { id: 47, category: "한국사", difficulty: "hard", question: "발해의 제10대 왕으로, 말갈족을 대부분 복속시키고 요동 지역까지 진출하여 당나라로부터 '해동성국'이라 불리게 한 왕은?", options: ["고왕", "무왕", "문왕", "선왕"], correctAnswer: 3, explanation: "선왕 대에 이르러 발해는 최대 영토를 확보하며 전성기를 맞이했습니다." },
    { id: 48, category: "한국사", difficulty: "hard", question: "고려 성종 때 유학자 최승로가 불교의 폐단을 비판하고 유교를 정치 이념으로 삼을 것을 건의한 상소문의 이름은?", options: ["시무 28조", "훈요 10조", "계백서", "봉사 10조"], correctAnswer: 0, explanation: "성종은 최승로의 시무 28조를 수용하여 유교 정치 체제를 확립하고 12목에 지방관을 파견했습니다." },
    { id: 49, category: "한국사", difficulty: "hard", question: "조선 시대 토지 제도의 기본으로, 전직 및 현직 관리에게 경기도 내의 토지에 대한 수조권을 지급했던 제도는?", options: ["전시과", "녹읍", "과전법", "직전법"], correctAnswer: 2, explanation: "과전법은 1391년 고려 말에 제정되어 신진 사대부의 경제적 기반이 되었습니다." },
    { id: 50, category: "한국사", difficulty: "hard", question: "1866년, 미국 상선이 평양 군민들의 화공으로 대동강에서 불타 침몰한 사건으로, 훗날 신미양요의 원인이 된 사건은?", options: ["운요호 사건", "제너럴 셔먼호 사건", "병인박해", "오페르트 도굴 사건"], correctAnswer: 1, explanation: "제너럴 셔먼호 사건을 구실로 1871년 미군이 강화도를 침략하는 신미양요가 발생했습니다." },
    { id: 51, category: "한국사", difficulty: "hard", question: "1907년 안창호, 양기탁 등이 중심이 되어 조직한 비밀 결사 단체로, 대성 학교와 오산 학교를 설립하고 민족 산업 육성에 힘쓴 단체는?", options: ["독립협회", "신민회", "의열단", "근우회"], correctAnswer: 1, explanation: "신민회는 공화정 체제의 근대 국가 수립을 목표로 한 최초의 단체이며 105인 사건으로 해체되었습니다." },
    { id: 52, category: "한국사", difficulty: "hard", question: "1811년, 세도 정치의 수탈과 서북 지역(평안도)에 대한 차별에 반발하여 일어난 대규모 농민 반란은?", options: ["홍경래의 난", "임술 농민 봉기", "망이 망소이의 난", "만적의 난"], correctAnswer: 0, explanation: "몰락 양반인 홍경래가 주도하여 청천강 이북을 장악했으나 결국 관군에게 진압되었습니다." },
    { id: 53, category: "한국사", difficulty: "hard", question: "1920년대 초, 일본 상품에 맞서 \"우리가 만든 것 우리가 쓰자\"라는 구호를 내걸고 평양에서 조만식 등을 중심으로 시작된 민족 운동은?", options: ["물산 장려 운동", "국채 보상 운동", "브나로드 운동", "형평 운동"], correctAnswer: 0, explanation: "물산 장려 운동은 민족 자본을 육성하여 경제적 자립을 이루고자 한 운동입니다." },
    { id: 54, category: "한국사", difficulty: "hard", question: "광복 직후인 1948년, 일제강점기 동안 일제에 협력했던 친일파를 처벌하기 위해 제헌 국회에서 제정한 특별법에 의해 구성된 기구는?", options: ["건국준비위원회", "반민족행위특별조사위원회(반민특위)", "비변사", "조선건국동맹"], correctAnswer: 1, explanation: "반민특위는 이승만 정부의 소극적 태도와 친일 세력의 방해로 1년 만에 와해되었습니다." },
    { id: 55, category: "한국사", difficulty: "hard", question: "조선 선조 때, 사림파가 이조 전랑직 임명 문제와 척신 정치 청산 문제를 둘러싸고 분열하여 형성된 최초의 붕당 2개는?", options: ["남인과 북인", "동인과 서인", "노론과 소론", "시파와 벽파"], correctAnswer: 1, explanation: "신진 사림인 동인과 기성 사림인 서인으로 분열되며 본격적인 붕당 정치가 시작되었습니다." },
    { id: 56, category: "한국사", difficulty: "hard", question: "고려 전기, 관직 복무의 대가로 관리의 등급에 따라 토지(전지)와 임야(시지)의 수조권을 나누어 지급했던 토지 제도는?", options: ["녹읍", "과전법", "직전법", "전시과"], correctAnswer: 3, explanation: "전시과는 경종 대에 처음 마련되어 목종, 문종을 거치며 정비되었습니다." },
    { id: 57, category: "한국사", difficulty: "hard", question: "1871년 신미양요 당시, 강화도 광성보에서 수적 열세에도 불구하고 미군에 맞서 결사적으로 항전하다 전사한 조선의 장군은?", options: ["양헌수", "어재연", "정문부", "최익현"], correctAnswer: 1, explanation: "어재연 장군은 미군의 압도적인 화력 앞에서도 끝까지 물러서지 않고 항전했습니다." },
    { id: 58, category: "한국사", difficulty: "hard", question: "1910년대 일제강점기 무단 통치 시기, 일제가 한국인의 경제적 기반을 약화시키고 식민지 지배의 재정을 확보하기 위해 실시한 토지 조사 사업의 방식은?", options: ["기한부 신고제", "영구 소유권 인정", "농지 개혁", "소작농 보호"], correctAnswer: 0, explanation: "기한 내에 신고하지 않은 토지나 문중의 토지 등은 대부분 조선 총독부의 소유가 되었습니다." },
    { id: 59, category: "한국사", difficulty: "hard", question: "조선 중기, 성리학의 심원한 이치를 그림으로 설명하여 선조에게 바친 이황의 저서 이름은?", options: ["성학십도", "성학집요", "동호문답", "격몽요결"], correctAnswer: 0, explanation: "이황은 10개의 도식으로 성리학의 핵심을 요약한 '성학십도'를 지었습니다. (이이는 '성학집요')"},
    { id: 60, category: "한국사", difficulty: "hard", question: "1882년 임오군란 직후 체결되었으며, 거중 조정 조항과 조선 최초의 최고 대우 조항(최혜국 대우)이 포함된 서양 국가와의 첫 번째 조약은?", options: ["조일 수호 조규", "조미 수호 통상 조약", "한성 조약", "텐진 조약"], correctAnswer: 1, explanation: "조미 수호 통상 조약은 청나라의 알선으로 체결되었으며 관세 부과 조항이 포함되었습니다." },

    { id: 61, category: "한국사", difficulty: "very_hard", question: "철기 시대를 바탕으로 성장한 초기 국가 부여에서 12월에 열렸던 제천 행사의 이름은?", options: ["동맹", "무천", "영고", "수릿날"], correctAnswer: 2, explanation: "부여는 수렵 사회의 전통을 보여주는 제천 행사 '영고'를 12월에 개최했습니다. (고구려는 동맹, 동예는 무천)" },
    { id: 62, category: "한국사", difficulty: "very_hard", question: "통일신라 시대 서원경(청주) 인근 4개 촌락의 뽕나무, 잣나무 수와 인구 변동 상황 등을 3년마다 기록한 문서를 부르는 명칭은?", options: ["신라장적(민정문서)", "양안", "호적", "대명률"], correctAnswer: 0, explanation: "민정문서는 국가가 백성들의 노동력과 생산 자원을 철저히 파악하여 세금을 징수하기 위한 목적이었습니다." },
    { id: 63, category: "한국사", difficulty: "very_hard", question: "고려 광종 때 후주에서 귀화한 쌍기의 건의를 받아들여, 호족 세력을 견제하고 유교적 소양을 갖춘 관리를 선발하기 위해 최초로 실시한 제도는?", options: ["음서제", "과거제", "천거제", "독서삼품과"], correctAnswer: 1, explanation: "광종은 과거제와 노비안검법을 실시하여 왕권을 획기적으로 강화했습니다." },
    { id: 64, category: "한국사", difficulty: "very_hard", question: "고려 시대, 국자감의 교육 환경을 개선하고 양현고를 설치하여 관학(국가 교육)을 진흥시키고자 '관학 7재'를 설치한 왕은?", options: ["성종", "문종", "예종", "공민왕"], correctAnswer: 2, explanation: "예종은 사학(사립학교) 12도가 융성하자 이를 견제하고 관학을 육성하기 위해 7재를 두었습니다." },
    { id: 65, category: "한국사", difficulty: "very_hard", question: "조선 세종 때 서울을 기준으로 천체 운동을 정확하게 계산하여 편찬한 조선 최초의 독자적인 역법서(달력)의 이름은?", options: ["칠정산", "농사직설", "향약집성방", "동의보감"], correctAnswer: 0, explanation: "칠정산은 원나라의 수시력과 아라비아의 회회력을 참조하여 조선의 실정에 맞게 재편찬한 역법입니다." },
    { id: 66, category: "한국사", difficulty: "very_hard", question: "1898년, 서울의 상인들이 외국 상인의 도성 내 내륙 상권 침투에 맞서 철시(상점 문을 닫음) 투쟁을 벌이며 조직한 상권 수호 단체는?", options: ["독립협회", "황국중앙총상회", "보부상단", "보안회"], correctAnswer: 1, explanation: "황국중앙총상회는 시전 상인들이 중심이 되어 외국인의 불법적인 상업 활동을 배격했습니다." },
    { id: 67, category: "한국사", difficulty: "very_hard", question: "1904년, 영국인 베델과 한국인 양기탁이 창간하였으며, 항일 논설을 적극적으로 게재하고 국채 보상 운동을 가장 주도적으로 지원했던 언론의 이름은?", options: ["한성순보", "황성신문", "독립신문", "대한매일신보"], correctAnswer: 3, explanation: "대한매일신보는 영국인이 사장이었기 때문에 일본의 사전 검열을 피해 강력한 항일 논조를 펼칠 수 있었습니다." },
    { id: 68, category: "한국사", difficulty: "very_hard", question: "1942년, 일제가 우리말 사전(조선어 사전) 편찬 작업을 하던 학자들을 '치안유지법' 위반으로 대거 구속하고 고문한 사건은?", options: ["조선어학회 사건", "105인 사건", "신간회 해산", "브나로드 운동"], correctAnswer: 0, explanation: "조선어학회 사건으로 이윤재, 한징 등의 학자가 옥중에서 순국하는 등 민족 문화 말살이 극에 달했습니다." },
    { id: 69, category: "한국사", difficulty: "very_hard", question: "1972년, 남북이 분단 이후 최초로 통일의 3대 원칙(자주, 평화, 민족 대단결)을 합의하여 서울과 평양에서 동시에 발표한 성명은?", options: ["남북 기본 합의서", "6.15 남북 공동 선언", "7.4 남북 공동 성명", "10.4 남북 정상 선언"], correctAnswer: 2, explanation: "7.4 남북 공동 성명은 통일 원칙에 합의했으나, 직후 남북 모두 독재 체제(유신 체제 등)를 강화하는 데 이용되었습니다." },
    { id: 70, category: "한국사", difficulty: "very_hard", question: "초기 국가 동예에서 다른 씨족의 생활 구역을 침범하면 노비, 소, 말 등으로 배상하게 했던 엄격한 부족 간 경계 존중 풍습의 이름은?", options: ["책화", "서옥제", "민며느리제", "골품제"], correctAnswer: 0, explanation: "책화는 산천을 경계로 각 부족의 생활권을 엄격히 인정했던 동예의 독특한 풍습입니다." },
    { id: 71, category: "한국사", difficulty: "very_hard", question: "고구려 소수림왕 대에 체제 정비를 위해 실시한 3가지 핵심 정책이 아닌 것은?", options: ["불교 수용", "태학 설립", "율령 반포", "지방 22담로 파견"], correctAnswer: 3, explanation: "지방 주요 거점인 22담로에 왕족을 파견한 것은 백제의 무령왕입니다." },
    { id: 72, category: "한국사", difficulty: "very_hard", question: "고려 시대, 현존하는 우리나라 최고(最古)의 의학 서적으로, 우리 풍토에 맞는 향약(국산 약재)을 이용한 치료법을 정리한 책은?", options: ["동의보감", "의방유취", "향약구급방", "향약집성방"], correctAnswer: 2, explanation: "향약구급방은 고려 고종 때 강화도에서 간행된 것으로 전해지는 현존 최고 의서입니다." },
    { id: 73, category: "한국사", difficulty: "very_hard", question: "1861년, 김정호가 전통적인 지도 제작 기술을 집대성하여 산맥과 하천의 모습을 정밀하게 목판본으로 인쇄하여 펴낸 전국 지도의 이름은?", options: ["혼일강리역대국도지도", "동국지도", "대동여지도", "팔도도"], correctAnswer: 2, explanation: "대동여지도는 10리를 눈금으로 표시하여 거리를 측정할 수 있게 했으며 휴대가 편리하게 분첩 절첩식으로 제작되었습니다." },
    { id: 74, category: "한국사", difficulty: "very_hard", question: "고려 무신 정권기 최충헌의 사노비였던 인물이 '왕후장상의 씨가 따로 있겠는가'라며 신분 해방을 부르짖고 개경에서 난을 모의했던 사건은?", options: ["망이 망소이의 난", "만적의 난", "김사미와 효심의 난", "조위총의 난"], correctAnswer: 1, explanation: "만적의 난은 비록 사전에 발각되어 실패했으나 가장 대표적인 신분 해방 운동으로 꼽힙니다." },
    { id: 75, category: "한국사", difficulty: "very_hard", question: "일제강점기인 1923년, 김원봉이 이끌던 의열단의 독립운동 지침으로 신채호가 작성하여 폭력 암살 파괴 활동의 정당성을 부여한 선언문의 이름은?", options: ["조선 혁명 선언", "대한 독립 선언서", "기미 독립 선언서", "건국 강령"], correctAnswer: 0, explanation: "신채호의 '조선 혁명 선언'은 민중의 직접 폭력 혁명만이 독립을 쟁취할 수 있는 유일한 방법이라고 주장했습니다." },

    { id: 76, category: "과학", difficulty: "very_easy", question: "수소(H) 원자 2개와 산소(O) 원자 1개가 결합하여 만들어진 흔한 물질의 화학식은 H2O입니다. 이 물질은 무엇일까요?", options: ["소금", "물", "설탕", "공기"], correctAnswer: 1, explanation: "물(H2O)은 생명체가 살아가는 데 필수적인 물질입니다." },
    { id: 77, category: "과학", difficulty: "very_easy", question: "지구에서 위로 던진 물체가 다시 땅으로 떨어지게 만드는, 지구 중심 방향으로 끌어당기는 힘은 무엇인가요?", options: ["마찰력", "탄성력", "자기력", "중력"], correctAnswer: 3, explanation: "중력(Gravity)은 질량을 가진 물체들이 서로 끌어당기는 힘으로, 뉴턴이 만유인력의 법칙으로 설명했습니다." },
    { id: 78, category: "과학", difficulty: "very_easy", question: "우리 태양계의 행성들 중, 질량과 부피를 기준으로 가장 크기가 큰 행성은 무엇인가요?", options: ["지구", "화성", "목성", "토성"], correctAnswer: 2, explanation: "목성은 태양계에서 가장 거대한 가스 행성입니다." },
    { id: 79, category: "과학", difficulty: "very_easy", question: "1기압 상태에서 순수한 물이 액체에서 고체(얼음)로 어는 온도는 섭씨 몇 도(℃)인가요?", options: ["-100도", "-10도", "0도", "10도"], correctAnswer: 2, explanation: "순수한 물은 1기압에서 0℃일 때 얼기 시작하고 녹기 시작합니다." },
    { id: 80, category: "과학", difficulty: "very_easy", question: "식물이 햇빛, 물, 이산화탄소를 이용하여 스스로 양분을 만들고 산소를 내뿜는 과정을 무엇이라고 하나요?", options: ["호흡", "광합성", "소화", "증산 작용"], correctAnswer: 1, explanation: "식물은 잎의 엽록체에서 광합성을 통해 생존에 필요한 양분을 생산합니다." },
    { id: 81, category: "과학", difficulty: "very_easy", question: "사람의 몸에서 온몸으로 피(혈액)를 뿜어내어 순환시키는 '펌프' 역할을 하는 장기는?", options: ["간", "폐", "위", "심장"], correctAnswer: 3, explanation: "심장은 끊임없이 수축과 이완을 반복하며 온몸으로 혈액을 보냅니다." },
    { id: 82, category: "과학", difficulty: "very_easy", question: "태양계의 8개 행성 중, 태양과 가장 가까운 궤도를 도는 첫 번째 행성은 무엇인가요?", options: ["수성", "금성", "지구", "화성"], correctAnswer: 0, explanation: "태양계 행성은 태양에서 가까운 순서대로 수성, 금성, 지구, 화성, 목성, 토성, 천왕성, 해왕성입니다." },
    { id: 83, category: "과학", difficulty: "very_easy", question: "우리가 숨을 들이마실 때 생명 유지에 반드시 필요하며, 지구 대기의 약 21%를 차지하는 기체는?", options: ["질소", "산소", "이산화탄소", "수소"], correctAnswer: 1, explanation: "산소는 생물의 호흡에 필수적이며 물질이 타는 연소 반응을 돕습니다." },
    { id: 84, category: "과학", difficulty: "very_easy", question: "자석에는 N극과 S극이 있습니다. 서로 같은 극(N극-N극 또는 S극-S극)을 가까이 대면 어떤 현상이 일어나나요?", options: ["서로 밀어낸다 (척력)", "서로 끌어당긴다 (인력)", "아무 반응이 없다", "불꽃이 튄다"], correctAnswer: 0, explanation: "자석은 같은 극끼리는 밀어내고, 다른 극끼리는 끌어당기는 성질이 있습니다." },
    { id: 85, category: "과학", difficulty: "very_easy", question: "빛의 3원색은 빨강(Red), 초록(Green) 그리고 나머지 하나는 무슨 색일까요?", options: ["노랑(Yellow)", "파랑(Blue)", "검정(Black)", "흰색(White)"], correctAnswer: 1, explanation: "빛의 3원색은 RGB(Red, Green, Blue)이며, 이 세 가지 빛을 모두 섞으면 흰색이 됩니다." },
    { id: 86, category: "과학", difficulty: "very_easy", question: "개미, 벌, 나비 등 '곤충'으로 분류되는 동물들의 공통적인 다리 개수는 몇 개인가요?", options: ["4개", "6개", "8개", "10개"], correctAnswer: 1, explanation: "거미(8개)와 달리, 곤충은 머리, 가슴, 배로 나뉘며 가슴에 3쌍(총 6개)의 다리가 있습니다." },
    { id: 87, category: "과학", difficulty: "very_easy", question: "지구의 유일한 자연 위성으로, 밀물과 썰물을 일으키는 주요 원인이 되는 천체는?", options: ["태양", "달", "화성", "금성"], correctAnswer: 1, explanation: "달의 중력은 지구의 바닷물을 끌어당겨 조수 간만의 차(밀물과 썰물)를 만듭니다." },
    { id: 88, category: "과학", difficulty: "very_easy", question: "물질의 상태 변화 중, 고체인 얼음이 녹아서 액체인 물이 되는 현상을 무엇이라고 하나요?", options: ["기화", "액화", "융해", "응고"], correctAnswer: 2, explanation: "얼음이 열을 흡수하여 물이 되는 현상을 '융해'라고 합니다." },
    { id: 89, category: "과학", difficulty: "very_easy", question: "사람의 뼈대 중, 뼈와 뼈가 서로 맞닿아 부드럽게 구부러지거나 움직일 수 있게 연결된 부분을 무엇이라고 하나요?", options: ["근육", "힘줄", "관절", "연골"], correctAnswer: 2, explanation: "무릎, 팔꿈치 등의 관절 덕분에 우리 몸은 자유롭게 움직일 수 있습니다." },
    { id: 90, category: "과학", difficulty: "very_easy", question: "밤하늘에 보이는 별자리 중, 북쪽을 가리켜 옛날 길을 찾는 나침반 역할을 했던 국자 모양의 7개 별 무리는?", options: ["북두칠성", "오리온자리", "카시오페이아자리", "백조자리"], correctAnswer: 0, explanation: "큰곰자리의 꼬리 부분에 해당하는 북두칠성은 북극성을 찾는 데 유용하게 쓰입니다." },

    // ==========================================
    // [과학] Level 2: 쉬움 (easy) - 15문제
    // ==========================================
    { id: 91, category: "과학", difficulty: "easy", question: "1기압 상태에서 순수한 액체 상태의 물이 끓어서 수증기로 변하기 시작하는 온도는 섭씨 몇 도(℃)인가요?", options: ["50도", "80도", "100도", "120도"], correctAnswer: 2, explanation: "1기압에서 물의 끓는점은 100℃입니다." },
    { id: 92, category: "과학", difficulty: "easy", question: "지구가 스스로 팽이처럼 팽그르르 도는 '자전'을 하기 때문에 생기는 현상은 무엇인가요?", options: ["계절의 변화", "낮과 밤의 반복", "지진 발생", "달의 위상 변화"], correctAnswer: 1, explanation: "지구가 24시간에 한 바퀴씩 자전하면서 태양빛을 받는 쪽(낮)과 못 받는 쪽(밤)이 생깁니다." },
    { id: 93, category: "과학", difficulty: "easy", question: "우주 공간은 매질(공기 등)이 없는 진공 상태입니다. 이 진공 상태에서 전달되지 않는 것은 무엇일까요?", options: ["빛", "소리", "열", "전파"], correctAnswer: 1, explanation: "빛이나 전파는 매질이 없어도 전달되지만, 소리는 공기나 물 같은 매질이 있어야만 전달됩니다." },
    { id: 94, category: "과학", difficulty: "easy", question: "우리 몸의 혈액(피) 속에 들어있으며, 온몸의 세포로 산소를 운반하는 핵심 역할을 하는 붉은색 세포는?", options: ["백혈구", "적혈구", "혈소판", "림프구"], correctAnswer: 1, explanation: "적혈구에 있는 헤모글로빈이라는 붉은 단백질이 산소와 결합하여 온몸으로 운반합니다." },
    { id: 95, category: "과학", difficulty: "easy", question: "표면의 산화철 때문에 붉은색을 띠며, 영화 '마션'의 배경이 된 '제2의 지구'로 불리는 행성은?", options: ["금성", "목성", "화성", "토성"], correctAnswer: 2, explanation: "화성은 지구와 환경이 가장 비슷하여 인류의 우주 탐사 1순위 목표로 꼽힙니다." },
    { id: 96, category: "과학", difficulty: "easy", question: "자전거나 자동차의 브레이크를 밟으면 바퀴가 멈추게 됩니다. 이때 바퀴와 브레이크 패드 사이에서 물체의 운동을 방해하는 힘은?", options: ["마찰력", "탄성력", "관성", "원심력"], correctAnswer: 0, explanation: "마찰력은 두 물체가 접촉하여 미끄러질 때 운동을 방해하는 방향으로 작용합니다." },
    { id: 97, category: "과학", difficulty: "easy", question: "모든 물질을 이루고 있는 가장 기본이 되는 아주 작은 알갱이를 부르는 과학 용어는?", options: ["분자", "세포", "원자", "전자"], correctAnswer: 2, explanation: "원자(Atom)는 물질을 구성하는 기본 단위이며, 원자들이 모여 분자를 이룹니다." },
    { id: 98, category: "과학", difficulty: "easy", question: "태양계 행성 중에서 암석과 얼음으로 이루어진 크고 아름다운 '고리'를 가진 것으로 가장 유명한 행성은?", options: ["수성", "천왕성", "해왕성", "토성"], correctAnswer: 3, explanation: "목성, 천왕성 등도 고리가 있지만, 가장 뚜렷하고 아름다운 고리를 가진 행성은 토성입니다." },
    { id: 99, category: "과학", difficulty: "easy", question: "건조한 겨울철, 스웨터를 벗을 때 '따닥' 소리와 함께 일어나는 전기 현상으로, 한곳에 머물러 있는 전기를 무엇이라 하나요?", options: ["직류", "교류", "정전기", "전자기 유도"], correctAnswer: 2, explanation: "정전기는 마찰에 의해 전자가 이동하면서 물체가 전하를 띠게 되어 발생합니다." },
    { id: 100, category: "과학", difficulty: "easy", question: "물질의 상태 변화 중, 고체인 드라이아이스가 액체로 녹지 않고 곧바로 기체(이산화탄소)로 변하는 현상은?", options: ["융해", "기화", "승화", "액화"], correctAnswer: 2, explanation: "고체가 기체로, 또는 기체가 고체로 직접 변하는 현상 모두를 '승화'라고 합니다." },
    { id: 101, category: "과학", difficulty: "easy", question: "물질의 산성과 염기성을 나타내는 단위인 pH(수소 이온 농도 지수) 척도에서, 중성인 순수한 물의 pH 수치는?", options: ["0", "1", "7", "14"], correctAnswer: 2, explanation: "pH는 0~14까지 있으며, 7 미만은 산성, 7은 중성, 7 초과는 염기성을 나타냅니다." },
    { id: 102, category: "과학", difficulty: "easy", question: "동물을 등뼈(척추)의 유무에 따라 분류할 때, '무척추동물'에 속하는 것은 어느 것인가요?", options: ["개구리", "뱀", "고등어", "오징어"], correctAnswer: 3, explanation: "오징어, 문어, 곤충, 거미 등은 등뼈가 없는 연체동물이나 절지동물 등 무척추동물입니다." },
    { id: 103, category: "과학", difficulty: "easy", question: "지진이 발생했을 때 지진이 방출한 총에너지의 크기를 절대적인 수치로 나타낸 단위를 무엇이라 하나요?", options: ["진도", "규모(리히터)", "데시벨", "헤르츠"], correctAnswer: 1, explanation: "규모는 지진 자체의 에너지를 뜻하며, 진도는 관측자가 느끼는 흔들림의 정도를 의미합니다." },
    { id: 104, category: "과학", difficulty: "easy", question: "구리, 은, 알루미늄처럼 전기가 매우 잘 통하는 물질을 부르는 명칭은 무엇인가요?", options: ["부도체", "절연체", "반도체", "도체"], correctAnswer: 3, explanation: "도체는 전자가 자유롭게 이동할 수 있어 전기가 잘 흐르는 물질입니다." },
    { id: 105, category: "과학", difficulty: "easy", question: "사람의 소화 기관 중에서 위(Stomach)를 거친 음식물이 들어가며, 영양분이 체내로 가장 많이 흡수되는 길고 꼬불꼬불한 기관은?", options: ["식도", "소장", "대장", "간"], correctAnswer: 1, explanation: "소장은 소화의 최종 단계가 이루어지며 대부분의 영양소를 흡수합니다." },

    // ==========================================
    // [과학] Level 3: 보통 (medium) - 15문제
    // ==========================================
    { id: 106, category: "과학", difficulty: "medium", question: "세포의 핵 속에 존재하며, 생물체의 모든 유전 정보를 담고 있는 이중 나선 구조의 화합물은?", options: ["RNA", "DNA", "ATP", "효소"], correctAnswer: 1, explanation: "DNA(데옥시리보핵산)는 생물의 유전 정보를 담은 유전 물질의 본체입니다." },
    { id: 107, category: "과학", difficulty: "medium", question: "뉴턴의 운동 제1법칙으로, 외부에서 힘이 가해지지 않으면 정지한 물체는 계속 정지해 있고 움직이는 물체는 계속 같은 속도로 움직이려는 성질은?", options: ["관성의 법칙", "가속도의 법칙", "작용 반작용의 법칙", "만유인력의 법칙"], correctAnswer: 0, explanation: "버스가 갑자기 출발할 때 몸이 뒤로 쏠리는 현상이 관성 때문입니다." },
    { id: 108, category: "과학", difficulty: "medium", question: "러시아의 학자 멘델레예프가 기틀을 잡은 '주기율표'에서 원자 번호 1번을 차지하는 가장 가벼운 원소는?", options: ["헬륨(He)", "탄소(C)", "산소(O)", "수소(H)"], correctAnswer: 3, explanation: "수소는 우주 질량의 약 75%를 차지하는 가장 풍부하고 가벼운 원소입니다." },
    { id: 109, category: "과학", difficulty: "medium", question: "우리 몸의 혈액에 있는 세포 중 하나로, 외부에서 침입한 세균이나 바이러스를 잡아먹어 몸을 보호하는(식균 작용) 역할을 하는 것은?", options: ["적혈구", "백혈구", "혈소판", "골수 세포"], correctAnswer: 1, explanation: "백혈구는 체내 면역 체계의 핵심 세포로 감염과 싸우는 역할을 합니다." },
    { id: 110, category: "과학", difficulty: "medium", question: "빛이 공기 중에서 물이나 유리로 들어갈 때처럼, 매질이 달라지면서 빛의 진행 방향이 꺾이는 현상을 무엇이라고 하나요?", options: ["반사", "굴절", "산란", "회절"], correctAnswer: 1, explanation: "물속에 담근 빨대가 꺾여 보이거나 렌즈로 빛을 모으는 것이 굴절 현상의 예입니다." },
    { id: 111, category: "과학", difficulty: "medium", question: "동식물 세포 내에 존재하며, 산소를 이용해 세포가 활동하는 데 필요한 에너지(ATP)를 생성하는 '세포의 발전소' 역할의 소기관은?", options: ["리보솜", "소포체", "골지체", "미토콘드리아"], correctAnswer: 3, explanation: "미토콘드리아는 세포 호흡을 담당하여 생명 활동에 필요한 에너지를 만듭니다." },
    { id: 112, category: "과학", difficulty: "medium", question: "지구 대기권 중 지상에서 약 10~50km 사이에 위치하며, 자외선을 흡수하여 생명체를 보호하는 '오존층'이 존재하는 층은?", options: ["대류권", "성층권", "중간권", "열권"], correctAnswer: 1, explanation: "오존층은 성층권에 띠 형태로 존재하며 해로운 자외선을 차단해 줍니다." },
    { id: 113, category: "과학", difficulty: "medium", question: "알베르트 아인슈타인의 질량-에너지 등가원리 공식인 'E=mc²'에서, 알파벳 'c'가 의미하는 것은 무엇인가요?", options: ["질량", "빛의 속도", "플랑크 상수", "중력 가속도"], correctAnswer: 1, explanation: "E는 에너지, m은 질량, c는 진공에서의 빛의 속도(약 30만 km/s)를 의미합니다." },
    { id: 114, category: "과학", difficulty: "medium", question: "철(Fe)로 된 못이 공기 중의 산소, 수분과 결합하여 붉게 녹스는 것은 화학 반응 중 어느 것에 해당하나요?", options: ["환원 반응", "산화 반응", "중화 반응", "분해 반응"], correctAnswer: 1, explanation: "물질이 산소와 결합하거나 전자를 잃는 반응을 산화 반응이라고 합니다." },
    { id: 115, category: "과학", difficulty: "medium", question: "정상적인 인간의 체세포 1개에 들어 있는 염색체의 총 개수는 몇 개인가요?", options: ["23개", "46개", "48개", "64개"], correctAnswer: 1, explanation: "사람은 부모로부터 각각 23개씩 물려받아 총 23쌍, 46개의 염색체를 가집니다." },
    { id: 116, category: "과학", difficulty: "medium", question: "판 구조론에 따르면 전 세계 지진과 화산 활동의 약 80%가 집중적으로 일어나는 태평양 가장자리의 지진대를 가리키는 별명은?", options: ["불의 고리", "태평양의 눈", "지옥의 문", "판게아"], correctAnswer: 0, explanation: "환태평양 조산대(Ring of Fire)는 지각판들이 부딪치는 경계에 있어 화산과 지진이 잦습니다." },
    { id: 117, category: "과학", difficulty: "medium", question: "온도를 측정하는 척도 중 하나로, 분자의 운동이 완전히 멈추는 이론상 가장 낮은 온도인 '절대 영도(0K)'는 섭씨로 약 몇 도인가요?", options: ["-100℃", "-200℃", "-273℃", "-300℃"], correctAnswer: 2, explanation: "절대 영도는 0 Kelvin(K)이며, 섭씨온도로는 영하 273.15℃에 해당합니다." },
    { id: 118, category: "과학", difficulty: "medium", question: "전기 회로에서 전류의 흐름을 방해하는 정도를 나타내는 '저항'의 국제 단위(기호: Ω)는 무엇인가요?", options: ["볼트(V)", "암페어(A)", "옴(Ω)", "와트(W)"], correctAnswer: 2, explanation: "독일의 물리학자 옴(Ohm)의 이름을 딴 단위로, 전압, 전류, 저항의 관계를 옴의 법칙이라 합니다." },
    { id: 119, category: "과학", difficulty: "medium", question: "동물 세포에는 없지만 식물 세포에는 존재하여, 식물의 형태를 꼿꼿하게 유지해주고 세포를 보호하는 단단한 바깥 층은?", options: ["세포막", "세포벽", "핵", "엽록체"], correctAnswer: 1, explanation: "식물 세포는 세포막 바깥쪽에 셀룰로오스로 이루어진 두꺼운 세포벽이 있습니다." },
    { id: 120, category: "과학", difficulty: "medium", question: "영국의 생물학자 찰스 다윈이 1859년에 출간하여 자연선택설을 바탕으로 생물의 진화를 설명한 기념비적인 저서의 제목은?", options: ["코스모스", "이기적 유전자", "종의 기원", "침묵의 봄"], correctAnswer: 2, explanation: "'종의 기원'은 인류의 세계관을 완전히 바꾸어 놓은 생물학 역사상 가장 중요한 책입니다." },

    // ==========================================
    // [과학] Level 4: 어려움 (hard) - 15문제
    // ==========================================
    { id: 121, category: "과학", difficulty: "hard", question: "블랙홀 주변에서 중력이 너무 강해 빛조차 빠져나갈 수 없는 공간의 경계면을 천체물리학에서 무엇이라 부르나요?", options: ["특이점", "사건의 지평선", "웜홀", "에르고스피어"], correctAnswer: 1, explanation: "사건의 지평선(Event Horizon)을 넘어서면 어떤 정보나 물질도 우주 밖으로 나올 수 없습니다." },
    { id: 122, category: "과학", difficulty: "hard", question: "양자역학의 불완전함을 비판하기 위해 고안된 사고 실험으로, 상자를 열어 관측하기 전까지는 살아있는 상태와 죽어있는 상태가 중첩되어 있다는 역설을 담은 실험의 이름은?", options: ["라플라스의 악마", "맥스웰의 도깨비", "파블로프의 개", "슈뢰딩거의 고양이"], correctAnswer: 3, explanation: "오스트리아의 물리학자 에르빈 슈뢰딩거가 제안한 양자 중첩에 관한 사고 실험입니다." },
    { id: 123, category: "과학", difficulty: "hard", question: "원자핵은 (+)전하를 띠는 양성자들이 모여있어 서로 밀어내야 하지만 흩어지지 않습니다. 이 양성자들과 중성자들을 강하게 묶어주는 우주의 4대 기본 힘 중 하나는?", options: ["전자기력", "약한 핵력", "강한 핵력", "중력"], correctAnswer: 2, explanation: "강한 핵력(강력)은 아주 짧은 거리에서 작용하며 우주에서 가장 강력한 힘입니다." },
    { id: 124, category: "과학", difficulty: "hard", question: "코일(도선) 주변에서 자석을 움직이면 자기장의 변화로 인해 전류가 흐르게 되는 '전자기 유도 현상'을 처음 발견한 영국의 과학자는?", options: ["아이작 뉴턴", "마이클 패러데이", "토머스 에디슨", "니콜라 테슬라"], correctAnswer: 1, explanation: "패러데이의 전자기 유도 법칙은 현대 발전기(전기 생산)와 모터의 기본 원리가 되었습니다." },
    { id: 125, category: "과학", difficulty: "hard", question: "단백질은 수많은 기본 단위 분자들이 펩타이드 결합으로 길게 연결된 고분자 물질입니다. 단백질을 구성하는 이 기본 단위는 무엇인가요?", options: ["포도당", "지방산", "뉴클레오타이드", "아미노산"], correctAnswer: 3, explanation: "생물체에는 약 20종류의 아미노산이 있으며, 이들의 배열 순서에 따라 단백질의 종류가 결정됩니다." },
    { id: 126, category: "과학", difficulty: "hard", question: "지구에서 관측할 때, 멀리 있는 은하들이 내뿜는 빛의 파장이 우주 팽창으로 인해 길어져 스펙트럼이 붉은색 쪽으로 치우치는 현상을 무엇이라 하나요?", options: ["도플러 효과", "적색 편이", "청색 편이", "광전 효과"], correctAnswer: 1, explanation: "에드윈 허블은 적색 편이(Redshift) 현상을 관측하여 우주가 팽창하고 있음을 증명했습니다." },
    { id: 127, category: "과학", difficulty: "hard", question: "우리 몸의 혈당량(혈액 속 포도당 농도)이 높아지면 이자(췌장)에서 분비되어 혈당을 낮추는 핵심 호르몬의 이름은?", options: ["글루카곤", "아드레날린", "티록신", "인슐린"], correctAnswer: 3, explanation: "인슐린이 제대로 분비되지 않거나 기능하지 못하면 당뇨병에 걸리게 됩니다." },
    { id: 128, category: "과학", difficulty: "hard", question: "물리학의 열역학 제2법칙에 따르면, 고립된 계에서 자연적인 현상은 무질서한 정도가 항상 증가하는 방향으로 일어납니다. 이 '무질서도'를 뜻하는 용어는?", options: ["엔탈피", "엔트로피", "엑서지", "운동 에너지"], correctAnswer: 1, explanation: "엔트로피(Entropy) 증가는 엎질러진 물을 다시 담을 수 없는 것과 같은 자연계의 비가역성을 설명합니다." },
    { id: 129, category: "과학", difficulty: "hard", question: "원자의 구조에서 화학 결합이나 반응에 직접 참여하며, 원자의 가장 바깥쪽 껍질에 존재하여 원소의 화학적 성질을 결정하는 전자를 무엇이라 하나요?", options: ["핵전자", "자유 전자", "원자가 전자", "음극선"], correctAnswer: 2, explanation: "원자가 전자(Valence electron)의 개수가 같은 원소들은 주기율표에서 같은 족에 속하며 비슷한 성질을 띱니다." },
    { id: 130, category: "과학", difficulty: "hard", question: "태양과 같은 항성(별)의 내부에서 막대한 빛과 열 에너지가 생성되는 주된 물리적 과정은 무엇인가요?", options: ["우라늄 핵분열 반응", "수소 핵융합 반응", "탄소 연소 반응", "중력 수축"], correctAnswer: 1, explanation: "태양의 중심부에서는 4개의 수소 원자핵이 융합하여 1개의 헬륨 원자핵이 되며 에너지를 냅니다." },
    { id: 131, category: "과학", difficulty: "hard", question: "지질 시대를 나눌 때, 암모나이트와 공룡이 번성했던 중생대(Mesozoic Era)를 시간 순서대로 3개의 기(Period)로 나눈 것은?", options: ["캄브리아기-오르도비스기-실루리아기", "트라이아스기-쥐라기-백악기", "고제3기-신제3기-제4기", "석탄기-페름기-데본기"], correctAnswer: 1, explanation: "중생대는 기후가 온난하여 파충류와 겉씨식물이 크게 번성한 시기입니다." },
    { id: 132, category: "과학", difficulty: "hard", question: "1901년, 인간의 혈액형을 A, B, O, AB형으로 구분하는 'ABO식 혈액형'을 최초로 발견하여 안전한 수혈의 길을 연 오스트리아의 생물학자는?", options: ["에드워드 제너", "루이 파스퇴르", "윌리엄 하비", "카를 란트슈타이너"], correctAnswer: 3, explanation: "카를 란트슈타이너는 이 발견으로 노벨 생리의학상을 수상했습니다." },
    { id: 133, category: "과학", difficulty: "hard", question: "산과 염기가 반응하여 물(H2O)과 염(Salt)을 생성하며 서로의 성질을 잃어버리는 화학 반응을 무엇이라 하나요?", options: ["산화 환원 반응", "중화 반응", "치환 반응", "분해 반응"], correctAnswer: 1, explanation: "위산 과다로 속이 쓰릴 때 염기성인 제산제를 먹는 것이 중화 반응의 대표적인 예입니다." },
    { id: 134, category: "과학", difficulty: "hard", question: "지구의 자전과 자전축의 기울기(약 23.5도)로 인해 발생하는 현상으로, 편서풍과 무역풍 같은 대기 대순환을 설명하는 가상의 힘(전향력)은?", options: ["코리올리 힘", "원심력", "구심력", "조석력"], correctAnswer: 0, explanation: "코리올리 효과로 인해 북반구에서는 태풍의 소용돌이가 반시계 방향으로 회전합니다." },
    { id: 135, category: "과학", difficulty: "hard", question: "1928년 스코틀랜드의 미생물학자 알렉산더 플레밍이 푸른곰팡이 배양액에서 우연히 발견한 인류 최초의 항생제 물질은?", options: ["아스피린", "백신", "페니실린", "스테로이드"], correctAnswer: 2, explanation: "페니실린의 발견은 제2차 세계대전 등에서 수많은 부상자의 세균 감염을 치료해 생명을 구했습니다." },

    // ==========================================
    // [과학] Level 5: 매우 어려움 (very_hard) - 15문제
    // ==========================================
    { id: 136, category: "과학", difficulty: "very_hard", question: "우주 전체 질량-에너지의 약 27%를 차지하지만, 빛과 상호작용하지 않아 눈에 보이지 않으며 오직 중력적 효과를 통해서만 그 존재를 추론할 수 있는 미지의 물질은?", options: ["반물질", "암흑 물질", "암흑 에너지", "힉스 보손"], correctAnswer: 1, explanation: "은하의 회전 속도 문제를 설명하기 위해 도입된 암흑 물질(Dark Matter)은 현대 물리학의 최대 난제 중 하나입니다." },
    { id: 137, category: "과학", difficulty: "very_hard", question: "1953년, 로절린드 프랭클린의 X선 회절 사진을 바탕으로 DNA가 '이중 나선 구조'로 이루어져 있음을 규명하여 노벨상을 공동 수상한 두 과학자는?", options: ["왓슨과 크릭", "보어와 하이젠베르크", "다윈과 월리스", "허블과 르메트르"], correctAnswer: 0, explanation: "제임스 왓슨과 프랜시스 크릭의 발견은 분자생물학 시대의 막을 올렸습니다." },
    { id: 138, category: "과학", difficulty: "very_hard", question: "입자물리학의 표준 모형에서, 우주 만물을 구성하는 기본 입자들에 질량을 부여하는 역할을 하며 2012년 CERN에서 발견되어 '신의 입자'로 불린 것은?", options: ["광자", "쿼크", "중성미자", "힉스 보손"], correctAnswer: 3, explanation: "힉스 보손(Higgs Boson)의 발견으로 현대 입자물리학의 표준 모형이 완성되었습니다." },
    { id: 139, category: "과학", difficulty: "very_hard", question: "현재 생명공학 분야에서 가장 혁명적인 기술로 평가받는 3세대 유전자 가위 기술로, 특정 DNA 염기서열을 정밀하게 자르고 교정할 수 있는 기술의 이름은?", options: ["PCR 증폭", "제한효소", "CRISPR-Cas9", "줄기세포 배양"], correctAnswer: 2, explanation: "크리스퍼(CRISPR) 기술은 유전병 치료부터 품종 개량까지 무궁무진한 활용 가능성을 지닙니다." },
    { id: 140, category: "과학", difficulty: "very_hard", question: "빅뱅(대폭발) 우주론의 결정적 증거 중 하나로, 초기 우주의 빛이 팽창하면서 파장이 길어져 현재 우주 전역에서 약 2.7K의 초마이크로파 형태로 관측되는 복사파는?", options: ["우주 배경 복사", "중력파", "적색 편이", "펄서 방출선"], correctAnswer: 0, explanation: "펜지어스와 윌슨이 우연히 통신 안테나의 잡음을 연구하다가 우주 배경 복사를 최초로 관측했습니다." },
    { id: 141, category: "과학", difficulty: "very_hard", question: "특정 온도 이하로 냉각된 초전도체가 내부의 자기장을 밖으로 밀어내어, 자석 위에 올려두었을 때 공중으로 떠오르게 되는 현상은?", options: ["홀 효과", "제베크 효과", "마이스너 효과", "패러데이 효과"], correctAnswer: 2, explanation: "마이스너 효과(Meissner effect)는 완전 반자성 성질로 초전도 자기 부상 열차의 원리가 됩니다." },
    { id: 142, category: "과학", difficulty: "very_hard", question: "인간의 뇌(대뇌 변연계) 깊숙한 곳에 위치하며, 일상적인 단기 기억을 장기 기억으로 전환하고 공간 지각을 담당하는 중요한 기관은?", options: ["편도체", "해마", "전두엽", "시상하부"], correctAnswer: 1, explanation: "해마(Hippocampus)가 손상되면 새로운 기억을 만들지 못하는 단기 기억 상실증에 걸릴 수 있습니다." },
    { id: 143, category: "과학", difficulty: "very_hard", question: "화학 반응의 활성화 에너지를 낮추어 반응 속도를 빠르게 하는 물질을 '촉매'라고 합니다. 생물체 내에서 합성되어 소화 등 다양한 생리 작용을 돕는 단백질 주성분의 생체 촉매는?", options: ["호르몬", "비타민", "효소(Enzyme)", "항체"], correctAnswer: 2, explanation: "우리 몸의 소화 효소인 아밀레이스, 펩신 등이 대표적인 생체 촉매입니다." },
    { id: 144, category: "과학", difficulty: "very_hard", question: "파장이 자외선보다 짧고 감마선보다 길어 물질을 투과하는 성질이 강하며, 병원에서 뼈나 내부 장기의 사진을 찍을 때 사용하는 전자기파의 명칭은 발견자의 이름을 따서 무엇이라 하나요?", options: ["뢴트겐선(X선)", "알파선", "베타선", "적외선"], correctAnswer: 0, explanation: "독일의 물리학자 뢴트겐은 X선을 발견한 공로로 제1회 노벨 물리학상을 받았습니다." },
    { id: 145, category: "과학", difficulty: "very_hard", question: "양자역학의 핵심 원리 중 하나로, 미시 세계의 입자는 '위치'와 '운동량'을 동시에 정확하게 측정하는 것이 근본적으로 불가능하다는 하이젠베르크의 원리는?", options: ["파울리 배타 원리", "상보성 원리", "불확정성 원리", "대응 원리"], correctAnswer: 2, explanation: "불확정성 원리(Uncertainty Principle)는 관측 행위 자체가 입자의 상태에 영향을 미치기 때문에 발생합니다." },
    { id: 146, category: "과학", difficulty: "very_hard", question: "두 개 이상의 양자 상태가 밀접하게 얽혀 있어, 아무리 거리가 멀어져도 한 입자의 상태를 측정하는 즉시 다른 입자의 상태가 즉각적으로 결정되는 비국소적인 양자 현상은?", options: ["양자 터널링", "양자 얽힘", "양자 도약", "스핀 메아리"], correctAnswer: 1, explanation: "아인슈타인은 양자 얽힘(Quantum Entanglement) 현상을 '유령 같은 원격 작용'이라 부르며 회의적이었으나 실험적으로 증명되었습니다." },
    { id: 147, category: "과학", difficulty: "very_hard", question: "1912년 독일의 기상학자 알프레트 베게너가 '대륙 이동설'을 주장하면서, 약 2억 5천만 년 전 지구상의 모든 대륙이 하나로 뭉쳐 있었을 것이라 명명한 거대한 초대륙의 이름은?", options: ["곤드와나", "로라시아", "판탈라사", "판게아"], correctAnswer: 3, explanation: "초대륙 판게아(Pangaea)는 그리스어로 '모든 땅'을 의미하며 이후 멘틀 대류에 의해 분리되었습니다." },
    { id: 148, category: "과학", difficulty: "very_hard", question: "진핵생물의 염색체 말단(끝부분)에 존재하는 반복적인 DNA 염기서열로, 세포 분열이 일어날 때마다 조금씩 짧아져 생명체의 '노화'와 수명을 결정짓는 역할을 하는 부분은?", options: ["센트로미어", "텔로미어", "엑손", "오페론"], correctAnswer: 1, explanation: "텔로미어(Telomere)가 한계치 이하로 짧아지면 세포는 더 이상 분열하지 못하고 사멸하게 됩니다." },
    { id: 149, category: "과학", difficulty: "very_hard", question: "초신성 폭발 이후 남은 질량이 큰 중심핵이 수축하여 만들어지며, 매우 빠른 속도로 자전하면서 양극단으로 강력한 전자기파 복사 빔을 규칙적으로 방출하는 고밀도 천체는?", options: ["블랙홀", "백색 왜성", "적색 거성", "펄서(중성자별)"], correctAnswer: 3, explanation: "맥동 전파원이라 불리는 펄서(Pulsar)는 우주의 등대처럼 일정한 주기로 신호를 보냅니다." },
    { id: 150, category: "과학", difficulty: "very_hard", question: "혈관과 림프관을 순환하며 적응 면역을 담당하는 림프구 중, 골수에서 생성된 후 '가슴샘(Thymus)'으로 이동하여 성숙하며 바이러스에 감염된 세포를 직접 파괴하는 세포성 면역을 주도하는 세포는?", options: ["B 세포", "T 세포", "대식세포", "NK 세포"], correctAnswer: 1, explanation: "T 세포는 항체를 생산하는 B 세포와 함께 우리 몸의 후천 면역을 담당하는 핵심 세포입니다." },

   // ==========================================
    // [지리] Level 1: 매우 쉬움 (very_easy) - 15문제

    { id: 151, category: "지리", difficulty: "very_easy", question: "지구 전체 표면적의 약 70%를 차지하며, 여러 대양 중 가장 넓은 면적을 가진 바다는 어디인가요?", options: ["대서양", "인도양", "북극해", "태평양"], correctAnswer: 3, explanation: "태평양은 아시아, 오세아니아, 남북아메리카 대륙 사이에 있는 세계 최대의 대양입니다." },
    { id: 152, category: "지리", difficulty: "very_easy", question: "지구본이나 지도에서 지구의 가장 북쪽 끝을 가리키는 지점의 명칭은 무엇인가요?", options: ["남극", "북극", "적도", "본초 자오선"], correctAnswer: 1, explanation: "북극은 북반구의 가장 끝 지점으로, 위도가 북위 90도인 곳입니다." },
    { id: 153, category: "지리", difficulty: "very_easy", question: "대한민국(남한)에서 가장 높은 산으로, 제주도 중앙에 위치한 화산의 이름은?", options: ["지리산", "설악산", "북한산", "한라산"], correctAnswer: 3, explanation: "한라산은 해발 고도 1,947m로 남한에서 가장 높은 산입니다." },
    { id: 154, category: "지리", difficulty: "very_easy", question: "아프리카 대륙의 동북부를 흐르며, 전체 길이를 기준으로 세계에서 가장 긴 강으로 꼽히는 이 강은?", options: ["아마존 강", "나일 강", "미시시피 강", "양쯔 강"], correctAnswer: 1, explanation: "나일 강은 빅토리아호에서 발원하여 지중해로 흘러드는 아프리카 최대의 하천입니다." },
    { id: 155, category: "지리", difficulty: "very_easy", question: "전 세계 국가 중 국토 면적이 가장 넓은 나라는 어디인가요?", options: ["미국", "캐나다", "중국", "러시아"], correctAnswer: 3, explanation: "러시아는 유라시아 대륙 북부에 걸쳐 있는 세계에서 가장 영토가 넓은 국가입니다." },
    { id: 156, category: "지리", difficulty: "very_easy", question: "세계적인 랜드마크인 에펠탑과 루브르 박물관이 위치한 프랑스의 수도는?", options: ["런던", "로마", "마드리드", "파리"], correctAnswer: 3, explanation: "파리는 프랑스의 정치, 경제, 문화 중심지이자 세계적인 관광 도시입니다." },
    { id: 157, category: "지리", difficulty: "very_easy", question: "강수량이 매우 적어 식물이 자라기 힘들며, 표면이 모래나 자갈로 덮여 있는 건조한 지형을 무엇이라 하나요?", options: ["습지", "초원", "사막", "툰드라"], correctAnswer: 2, explanation: "사막은 연평균 강수량이 250mm 미만인 척박하고 건조한 지역입니다." },
    { id: 158, category: "지리", difficulty: "very_easy", question: "다음 중 사면이 바다로 둘러싸인 '섬나라'가 아닌 국가는 어디인가요?", options: ["일본", "영국", "호주", "독일"], correctAnswer: 3, explanation: "독일은 유럽 중부에 위치하여 여러 나라와 육상 국경을 접하고 있는 대륙 국가입니다." },
    { id: 159, category: "지리", difficulty: "very_easy", question: "미국 본토와 북쪽 국경을 가장 길게 맞대고 있는 이웃 나라는 어디인가요?", options: ["멕시코", "캐나다", "브라질", "쿠바"], correctAnswer: 1, explanation: "캐나다는 북아메리카 대륙 북부에 위치하며 미국과 세계에서 가장 긴 국경을 공유합니다." },
    { id: 160, category: "지리", difficulty: "very_easy", question: "대한민국의 영토 중 가장 동쪽에 위치하며, 천연기념물로 지정된 아름다운 화산섬의 이름은?", options: ["울릉도", "마라도", "독도", "백령도"], correctAnswer: 2, explanation: "독도는 경상북도 울릉군에 속하는 대한민국의 확고한 고유 영토입니다." },
    { id: 161, category: "지리", difficulty: "very_easy", question: "2023년 UN 통계 기준으로, 중국을 제치고 세계에서 인구가 가장 많은 국가 1위로 올라선 아시아 국가는?", options: ["인도", "인도네시아", "파키스탄", "방글라데시"], correctAnswer: 0, explanation: "인도는 약 14억 명 이상의 인구를 보유하여 세계 인구 1위 국가가 되었습니다." },
    { id: 162, category: "지리", difficulty: "very_easy", question: "우리나라와 같이 사계절이 뚜렷한 북반구 중위도 지역에서, 1년 중 낮의 길이가 가장 긴 절기를 무엇이라 하나요?", options: ["춘분", "하지", "추분", "동지"], correctAnswer: 1, explanation: "하지(대략 6월 21일경)에는 태양이 가장 북쪽(북회귀선)에 위치하여 북반구의 낮이 가장 깁니다." },
    { id: 163, category: "지리", difficulty: "very_easy", question: "아시아 대륙의 동쪽에 튀어나와 있으며, 대한민국과 조선민주주의인민공화국이 위치한 반도의 지리적 명칭은?", options: ["이베리아 반도", "발칸 반도", "한반도", "아라비아 반도"], correctAnswer: 2, explanation: "한반도는 아시아 대륙 동북부에 남북으로 뻗어 있는 반도입니다." },
    { id: 164, category: "지리", difficulty: "very_easy", question: "미국 뉴욕의 항구에 서 있는 거대한 동상으로, 프랑스가 미국의 독립 100주년을 기념하여 선물한 건축물은?", options: ["자유의 여신상", "에펠탑", "빅벤", "콜로세움"], correctAnswer: 0, explanation: "자유의 여신상은 미국의 자유와 민주주의를 상징하는 세계적인 랜드마크입니다." },
    { id: 165, category: "지리", difficulty: "very_easy", question: "지구를 북반구와 남반구로 나누는 위도 0도의 가상의 선을 무엇이라고 부르나요?", options: ["본초 자오선", "적도", "날짜 변경선", "북회귀선"], correctAnswer: 1, explanation: "적도는 위도의 기준이 되며 적도 부근은 1년 내내 기온이 높은 열대 기후가 나타납니다." },

    // ==========================================
    // [지리] Level 2: 쉬움 (easy) - 15문제
    // ==========================================
    { id: 166, category: "지리", difficulty: "easy", question: "세계 최고봉인 에베레스트(8,848m)를 포함하여 아시아 남부를 가로지르는 세계에서 가장 높은 산맥은?", options: ["안데스 산맥", "알프스 산맥", "로키 산맥", "히말라야 산맥"], correctAnswer: 3, explanation: "히말라야 산맥은 인도판과 유라시아판이 충돌하여 형성된 높고 험준한 습곡 산맥입니다." },
    { id: 167, category: "지리", difficulty: "easy", question: "유럽 남부에 위치하며, 국토의 모양이 '장화'를 닮은 것으로 널리 알려진 국가는?", options: ["스페인", "그리스", "이탈리아", "포르투갈"], correctAnswer: 2, explanation: "이탈리아 반도는 지중해를 향해 길게 뻗어 있는 장화 모양의 지형을 특징으로 합니다." },
    { id: 168, category: "지리", difficulty: "easy", question: "유역 면적과 유량을 기준으로 할 때 세계에서 가장 규모가 큰 열대 우림 지역의 강은?", options: ["아마존 강", "황하", "콩고 강", "나일 강"], correctAnswer: 0, explanation: "아마존 강은 남미 대륙을 가로지르며 지구 산소의 상당량을 생산하는 열대 우림을 지납니다." },
    { id: 169, category: "지리", difficulty: "easy", question: "보스포루스 해협을 경계로 유럽과 아시아 두 대륙에 영토가 걸쳐 있으며, 이스탄불을 최대 도시로 둔 나라는?", options: ["이집트", "러시아", "그리스", "튀르키예(터키)"], correctAnswer: 3, explanation: "튀르키예는 지리적 요충지에 위치하여 동서양 문화가 교차하는 독특한 특징을 갖습니다." },
    { id: 170, category: "지리", difficulty: "easy", question: "우리나라를 둘러싼 바다 중 수심이 가장 얕고 조수 간만의 차가 커서 넓은 갯벌이 발달한 바다는?", options: ["동해", "남해", "황해(서해)", "대한해협"], correctAnswer: 2, explanation: "황해는 평균 수심이 44m로 얕고 밀물과 썰물의 차이가 커 갯벌과 간척 사업이 발달했습니다." },
    { id: 171, category: "지리", difficulty: "easy", question: "지하 깊은 곳의 마그마가 화산 활동을 통해 지표면 밖으로 흘러나온 물질을 무엇이라 부르나요?", options: ["화강암", "마그마", "용암", "화산재"], correctAnswer: 2, explanation: "마그마가 지표로 분출하여 가스가 빠져나가고 남은 용융 상태의 물질을 용암이라고 합니다." },
    { id: 172, category: "지리", difficulty: "easy", question: "미국 애리조나주에 위치하며, 콜로라도 강이 수백만 년 동안 고원을 깎아 만든 거대한 계곡은?", options: ["나이아가라 폭포", "요세미티", "그랜드 캐니언", "옐로스톤"], correctAnswer: 2, explanation: "그랜드 캐니언은 웅장한 규모와 다양한 지층을 보여주는 세계적인 지질학적 명소입니다." },
    { id: 173, category: "지리", difficulty: "easy", question: "영국의 수도 런던을 관통하여 북해로 흘러드는 유명한 강의 이름은?", options: ["센 강", "템스 강", "다뉴브 강", "라인 강"], correctAnswer: 1, explanation: "템스 강은 런던의 역사와 문화를 상징하는 강으로 강변에 타워 브리지 등이 있습니다." },
    { id: 174, category: "지리", difficulty: "easy", question: "동남아시아 서태평양에 위치하며 약 7천여 개의 섬으로 이루어진 섬나라이자 수도가 마닐라인 국가는?", options: ["인도네시아", "필리핀", "말레이시아", "태국"], correctAnswer: 1, explanation: "필리핀은 수많은 섬으로 구성된 군도 국가로 다양한 해양 환경을 가집니다." },
    { id: 175, category: "지리", difficulty: "easy", question: "아프리카 대륙 북부에 걸쳐 있는 세계 최대의 사막(극지방 빙설 사막 제외)의 이름은?", options: ["고비 사막", "사하라 사막", "나미브 사막", "칼라하리 사막"], correctAnswer: 1, explanation: "사하라 사막은 미국 영토와 맞먹는 거대한 넓이를 자랑하는 아프리카의 대표적 지형입니다." },
    { id: 176, category: "지리", difficulty: "easy", question: "바다의 파도와 연안류에 의해 모래가 해안에 운반되어 쌓인 모래사장(해수욕장) 지형을 지리학적으로 무엇이라 하나요?", options: ["사빈", "갯벌", "해안 절벽", "피오르"], correctAnswer: 0, explanation: "사빈은 파랑의 퇴적 작용으로 형성되며 주로 해수욕장으로 이용됩니다." },
    { id: 177, category: "지리", difficulty: "easy", question: "남아메리카 대륙에서 포르투갈어를 공용어로 사용하며, 삼바 축제와 아마존 열대 우림으로 유명한 가장 큰 국가는?", options: ["아르헨티나", "칠레", "브라질", "콜롬비아"], correctAnswer: 2, explanation: "브라질은 남미 면적의 절반가량을 차지하며 포르투갈의 식민 지배 영향으로 포르투갈어를 씁니다." },
    { id: 178, category: "지리", difficulty: "easy", question: "오세아니아 대륙에 속하는 섬나라로, 북섬과 남섬으로 나뉘어 있으며 수도가 웰링턴인 국가는?", options: ["호주", "피지", "파푸아뉴기니", "뉴질랜드"], correctAnswer: 3, explanation: "뉴질랜드는 빙하 지형과 화산 지형이 모두 발달한 천혜의 자연환경을 가진 나라입니다." },
    { id: 179, category: "지리", difficulty: "easy", question: "우리나라와 이웃한 일본을 구성하는 4개의 주요 섬 중 가장 크고, 수도 도쿄가 위치한 섬은?", options: ["홋카이도", "혼슈", "시코쿠", "규슈"], correctAnswer: 1, explanation: "혼슈는 일본 면적의 약 60%를 차지하는 본섬으로 정치와 경제의 중심지입니다." },
    { id: 180, category: "지리", difficulty: "easy", question: "물리적, 화학적 작용에 의해 거대한 바위나 돌이 점차 부서져 흙이나 모래가 되는 현상을 무엇이라 하나요?", options: ["퇴적 작용", "풍화 작용", "침식 작용", "융기"], correctAnswer: 1, explanation: "풍화 작용은 바람, 물, 기온 변화 등에 의해 암석이 잘게 부서지는 자연 현상입니다." },

    // ==========================================
    // [지리] Level 3: 보통 (medium) - 15문제
    // ==========================================
    { id: 181, category: "지리", difficulty: "medium", question: "아시아 대륙과 아프리카 대륙을 나누는 경계이자, 지중해와 홍해를 연결하여 유럽-아시아 항해 거리를 획기적으로 단축시킨 인공 운하는?", options: ["파나마 운하", "수에즈 운하", "코린토스 운하", "킬 운하"], correctAnswer: 1, explanation: "이집트의 수에즈 운하는 세계 해운 물류의 핵심 통로입니다." },
    { id: 182, category: "지리", difficulty: "medium", question: "남아메리카 대륙의 서쪽 태평양 연안을 따라 약 7,000km에 걸쳐 길게 뻗어 있는 세계에서 가장 긴 산맥은?", options: ["로키 산맥", "알프스 산맥", "우랄 산맥", "안데스 산맥"], correctAnswer: 3, explanation: "안데스 산맥은 나스카판과 남아메리카판이 충돌하여 형성된 거대한 습곡 산맥입니다." },
    { id: 183, category: "지리", difficulty: "medium", question: "과거 빙하기에 빙하가 이동하며 깎아 만든 U자형 골짜기에 빙하기가 끝나고 바닷물이 침수되어 형성된 좁고 깊은 만(만) 지형은?", options: ["리아스식 해안", "피오르(Fjord)", "삼각주", "석호"], correctAnswer: 1, explanation: "피오르 지형은 노르웨이, 뉴질랜드 남섬 등 고위도 빙하 지역 해안에서 잘 나타납니다." },
    { id: 184, category: "지리", difficulty: "medium", question: "석회암이 빗물이나 지하수에 녹아 형성되는 독특한 지형으로, 돌리네나 종유동굴이 발달하는 이 지형을 일컫는 학술 용어는?", options: ["카르스트 지형", "건조 지형", "화산 지형", "해안 단구"], correctAnswer: 0, explanation: "카르스트(Karst) 지형은 석회암의 주성분인 탄산칼슘이 용식 작용을 받아 형성됩니다." },
    { id: 185, category: "지리", difficulty: "medium", question: "전 세계 지진의 약 80%, 화산 활동의 75%가 발생하여 '불의 고리(Ring of Fire)'라 불리는 조산대의 공식 명칭은?", options: ["알프스·히말라야 조산대", "환태평양 조산대", "대서양 중앙 해령", "동아프리카 열곡대"], correctAnswer: 1, explanation: "환태평양 조산대는 태평양판이 주변 판들과 부딪치는 경계를 따라 원형으로 분포합니다." },
    { id: 186, category: "지리", difficulty: "medium", question: "경도의 기준이 되는 경도 0도의 가상 선으로, 영국의 런던 그리니치 천문대를 지나는 이 선의 이름은?", options: ["날짜 변경선", "적도", "본초 자오선", "북회귀선"], correctAnswer: 2, explanation: "본초 자오선(Prime Meridian)은 세계 표준시(GMT)를 정하는 기준선 역할을 합니다." },
    { id: 187, category: "지리", difficulty: "medium", question: "열대 해상에서 발생하는 강력한 열대 저기압을 지역에 따라 다르게 부릅니다. 북서태평양(아시아) 지역에서 발생하는 열대 저기압의 명칭은?", options: ["허리케인", "사이클론", "태풍(Typhoon)", "토네이도"], correctAnswer: 2, explanation: "동일한 기상 현상을 북미는 허리케인, 인도양은 사이클론, 아시아는 태풍이라 부릅니다." },
    { id: 188, category: "지리", difficulty: "medium", question: "우리나라와 같은 동아시아 지역 기후에 큰 영향을 미치며, 여름에는 바다에서 육지로, 겨울에는 육지에서 바다로 1년을 주기로 방향이 바뀌는 바람은?", options: ["편서풍", "무역풍", "계절풍(몬순)", "극동풍"], correctAnswer: 2, explanation: "계절풍의 영향으로 우리나라는 여름엔 고온 다습하고 겨울엔 한랭 건조한 기후를 보입니다." },
    { id: 189, category: "지리", difficulty: "medium", question: "함경남도 원산 부근에서 시작하여 동해안을 따라 부산까지 이어지며, 한반도의 척추(등뼈) 역할을 하는 가장 긴 산맥은?", options: ["소백산맥", "차령산맥", "노령산맥", "태백산맥"], correctAnswer: 3, explanation: "태백산맥은 한반도의 동고서저(동쪽이 높고 서쪽이 낮음) 지형을 결정짓는 1차 산맥입니다." },
    { id: 190, category: "지리", difficulty: "medium", question: "러시아 서부를 흐르며 유럽에서 가장 길이가 긴 강으로, 최종적으로 내륙호인 카스피해로 흘러 들어가는 강은?", options: ["볼가 강", "다뉴브 강", "라인 강", "엘베 강"], correctAnswer: 0, explanation: "볼가 강은 러시아의 중요한 수운 교통로이자 유럽 최장(약 3,530km) 하천입니다." },
    { id: 191, category: "지리", difficulty: "medium", question: "이탈리아 로마 시내에 위치한 면적 0.44㎢의 세계 최소 독립국으로, 가톨릭 교황이 통치하는 이 국가는?", options: ["모나코", "바티칸 시국", "산마리노", "안도라"], correctAnswer: 1, explanation: "바티칸 시국은 성 베드로 대성당 등이 있는 가톨릭의 총본산입니다." },
    { id: 192, category: "지리", difficulty: "medium", question: "중국 티베트 고원에서 발원하여 미얀마, 태국, 캄보디아, 베트남 등 인도차이나 반도의 6개국을 관통해 흐르는 '동남아시아의 젖줄'이라 불리는 강은?", options: ["갠지스 강", "인더스 강", "메콩 강", "살윈 강"], correctAnswer: 2, explanation: "메콩 강 유역은 비옥한 토양으로 세계적인 벼농사 및 곡창 지대를 형성하고 있습니다." },
    { id: 193, category: "지리", difficulty: "medium", question: "사막 지역에서 바람에 날려온 미세한 모래와 흙먼지가 오랜 세월 두껍게 쌓여 형성된 황갈색의 토양 지대를 무엇이라 하나요?", options: ["체르노젬", "테라로사", "라테라이트", "황토(Loess)"], correctAnswer: 3, explanation: "중국의 황토 고원이 대표적이며, 봄철 우리나라로 불어오는 황사의 발원지이기도 합니다." },
    { id: 194, category: "지리", difficulty: "medium", question: "1994년 출범했던 북미자유무역협정(NAFTA)을 대체하여, 2020년부터 발효된 미국, 멕시코, 캐나다 3국의 새로운 무역 협정 명칭은?", options: ["TPP", "USMCA", "AFTA", "MERCOSUR"], correctAnswer: 1, explanation: "USMCA는 세 나라 영문 국명의 앞 글자를 딴 것으로 NAFTA의 개정판입니다." },
    { id: 195, category: "지리", difficulty: "medium", question: "지구 대기 대순환에서 위도 30~60도 사이의 중위도 지역에서 1년 내내 서쪽에서 동쪽으로 부는 탁월풍의 이름은?", options: ["무역풍", "편서풍", "극동풍", "계절풍"], correctAnswer: 1, explanation: "편서풍의 영향으로 중위도 대륙 서안(서유럽 등)은 연중 온화한 해양성 기후가 나타납니다." },

    // ==========================================
    // [지리] Level 4: 어려움 (hard) - 15문제
    // ==========================================
    { id: 196, category: "지리", difficulty: "hard", question: "남아메리카 안데스 산맥 해발 고도 약 3,800m에 위치하여 볼리비아와 페루의 국경을 이루는, 상업용 선박이 다닐 수 있는 세계에서 가장 높은 호수는?", options: ["바이칼 호", "티티카카 호", "빅토리아 호", "카스피 해"], correctAnswer: 1, explanation: "티티카카 호수는 잉카 문명의 발상지 중 하나로 고지대 주민들의 중요한 생활 터전입니다." },
    { id: 197, category: "지리", difficulty: "hard", question: "유럽 북부의 스칸디나비아 반도를 구성하는 핵심 3개 국가는 스웨덴, 노르웨이, 그리고 어느 나라인가요?", options: ["덴마크", "아이슬란드", "핀란드", "네덜란드"], correctAnswer: 2, explanation: "스칸디나비아 반도에는 노르웨이, 스웨덴, 핀란드(북부 일부)가 위치해 있습니다." },
    { id: 198, category: "지리", difficulty: "hard", question: "독일의 기후학자 쾨펜의 기후 구분 중, 강수량이 매우 적은 건조 기후(B)에 속하지만 약간의 비가 내려 짧은 풀이 자라 유목이 이루어지는 기후는?", options: ["사막 기후", "사바나 기후", "스텝 기후(BS)", "툰드라 기후"], correctAnswer: 2, explanation: "스텝 기후는 사막 기후 주변에 나타나며 몽골의 초원 지대가 대표적입니다." },
    { id: 199, category: "지리", difficulty: "hard", question: "대서양 중앙을 남북으로 길게 가로지르며, 맨틀 물질이 솟아올라 새로운 해양 지각이 생성되는 발산형 경계의 해저 산맥은?", options: ["해구", "대서양 중앙 해령", "마리아나 해구", "심해 평원"], correctAnswer: 1, explanation: "해령(Ridge)에서는 마그마가 분출하며 양옆으로 지각이 확장되는 현상이 일어납니다." },
    { id: 200, category: "지리", difficulty: "hard", question: "사막 지역에서 바람에 의해 모래가 이동하며 쌓여 형성된, 양끝이 뾰족한 '초승달 모양'의 모래 언덕을 부르는 지리학 용어는?", options: ["바르한", "버섯바위", "선상지", "오아시스"], correctAnswer: 0, explanation: "바르한(Barchan)은 바람이 부는 방향을 향해 양 뿔 모양이 뻗어 나가는 형태로 이동합니다." },
    { id: 201, category: "지리", difficulty: "hard", question: "하천이 바다나 호수와 만나는 하구에서 유속이 느려지며 흙과 모래가 쌓여 형성된 부채꼴 또는 삼각형 모양의 퇴적 지형은?", options: ["범람원", "하안 단구", "삼각주(Delta)", "선상지"], correctAnswer: 2, explanation: "삼각주는 토지가 비옥하여 농경지로 널리 이용되며 나일 강 삼각주가 대표적입니다." },
    { id: 202, category: "지리", difficulty: "hard", question: "흑해와 마르마라해(지중해 방향)를 연결하며, 이스탄불을 유럽 측과 아시아 측으로 양분하는 매우 중요한 국제 해협은?", options: ["지브롤터 해협", "보스포루스 해협", "호르무즈 해협", "말라카 해협"], correctAnswer: 1, explanation: "보스포루스 해협은 흑해 연안 국가들이 바다로 나가는 유일한 출구 역할을 합니다." },
    { id: 203, category: "지리", difficulty: "hard", question: "적도 부근의 무역풍이 약해지면서 동태평양(페루 연안)의 해수면 온도가 평년보다 0.5도 이상 높은 상태가 지속되는 기후 이상 현상은?", options: ["라니냐", "엘니뇨", "열섬 현상", "지구 온난화"], correctAnswer: 1, explanation: "엘니뇨(El Niño)가 발생하면 페루 연안엔 홍수가, 서태평양(호주)엔 가뭄이 발생하기 쉽습니다." },
    { id: 204, category: "지리", difficulty: "hard", question: "이슬람교의 창시자 무함마드가 태어난 곳이자 전 세계 무슬림들이 평생 한 번은 순례를 떠나야 하는 성지인 '메카(Mecca)'가 위치한 국가는?", options: ["이란", "아랍에미리트", "사우디아라비아", "이라크"], correctAnswer: 2, explanation: "사우디아라비아는 이슬람교의 양대 성지인 메카와 메디나를 모두 보유하고 있습니다." },
    { id: 205, category: "지리", difficulty: "hard", question: "면적이 넓어 바다인지 호수인지에 대한 영유권 분쟁이 있었던 세계 최대의 내륙호 카스피해와 국경을 접하고 있지 않은 국가는?", options: ["러시아", "이란", "아제르바이잔", "우즈베키스탄"], correctAnswer: 3, explanation: "카스피해는 러시아, 이란, 카자흐스탄, 아제르바이잔, 투르크메니스탄 5개국에 둘러싸여 있습니다." },
    { id: 206, category: "지리", difficulty: "hard", question: "아프리카 대륙에서 인구가 약 2억 명으로 가장 많으며, 풍부한 석유 자원을 바탕으로 OPEC(석유수출국기구)에 가입되어 있는 기니만 연안의 국가는?", options: ["남아프리카 공화국", "나이지리아", "이집트", "케냐"], correctAnswer: 1, explanation: "나이지리아는 아프리카 최대 인구 대국이자 경제 대국 중 하나입니다." },
    { id: 207, category: "지리", difficulty: "hard", question: "미국은 본토 48개 주와 본토에서 떨어져 있는 2개의 주로 구성되어 있습니다. 캐나다 북서쪽의 '알래스카주' 외에 떨어진 또 다른 한 주는?", options: ["플로리다주", "텍사스주", "하와이주", "오하이오주"], correctAnswer: 2, explanation: "하와이주는 태평양 한가운데 위치한 화산섬들로 이루어진 미국의 50번째 주입니다." },
    { id: 208, category: "지리", difficulty: "hard", question: "화산 폭발 후 마그마 방이 비면서 화산의 중심부(분화구)가 함몰되거나 붕괴하여 형성된 대규모 원형의 웅덩이 지형을 무엇이라 하나요?", options: ["칼데라", "용암 대지", "주상 절리", "오름(기생화산)"], correctAnswer: 0, explanation: "백두산 천지는 칼데라에 물이 고여 형성된 대표적인 칼데라호입니다." },
    { id: 209, category: "지리", difficulty: "hard", question: "유럽연합(EU)의 본부와 나토(NATO) 본부가 위치해 있어 '유럽의 수도' 역할을 하며, 북부의 플랑드르어와 남부의 프랑스어 사용권으로 나뉘어 갈등을 겪는 국가는?", options: ["네덜란드", "스위스", "오스트리아", "벨기에"], correctAnswer: 3, explanation: "벨기에 브뤼셀은 EU 산하 주요 기관들이 밀집한 유럽 통합의 상징적인 도시입니다." },
    { id: 210, category: "지리", difficulty: "hard", question: "강물이 굽이쳐 흐르는 '감입 곡류 하천' 주변에서 지반이 융기하거나 하천이 아래로 깊게 파고들면서 형성된 계단 모양의 지형은?", options: ["선상지", "하안 단구", "범람원", "삼각주"], correctAnswer: 1, explanation: "하안 단구는 과거 하천의 바닥이나 범람원이었던 곳이 융기하여 물 위로 솟아오른 지형으로 홍수 피해가 적어 취락이 입지합니다." },

    // ==========================================
    // [지리] Level 5: 매우 어려움 (very_hard) - 15문제
    // ==========================================
    { id: 211, category: "지리", difficulty: "very_hard", question: "동아프리카 대지구대는 두 개의 지각판이 양옆으로 점차 멀어지면서 형성된 거대한 골짜기입니다. 이러한 지각판의 경계를 지질학에서 무엇이라 하나요?", options: ["수렴형 경계", "보존형 경계", "발산형 경계", "충돌형 경계"], correctAnswer: 2, explanation: "발산형 경계에서는 새로운 지각이 생성되거나 지구대가 형성되며, 화산과 천발 지진이 발생합니다." },
    { id: 212, category: "지리", difficulty: "very_hard", question: "여름철은 아열대 고압대의 영향으로 고온 건조하고, 겨울철은 편서풍의 영향으로 온난 다습한 기후로 올리브, 포도 농사가 활발한 이 기후를 쾨펜 기후 기호로 나타내면?", options: ["Cfa (온난 습윤)", "Cfb (서안 해양성)", "Cs (지중해성 기후)", "Aw (사바나)"], correctAnswer: 2, explanation: "지중해성 기후(Cs)의 여름(Summer) 건조(Dry) 특징을 기호 s로 표기합니다." },
    { id: 213, category: "지리", difficulty: "very_hard", question: "멕시코 유카탄 반도에 위치한 '칙술루브 크레이터(Chicxulub crater)'는 약 6,600만 년 전 백악기 말기 공룡 멸종의 가장 유력한 원인으로 지목되는 지형입니다. 무엇이 충돌하여 생겼을까요?", options: ["거대 화산 폭발", "소행성(운석) 충돌", "외계 비행체", "지각판의 급격한 융기"], correctAnswer: 1, explanation: "지름 약 10km의 소행성 충돌로 엄청난 먼지가 햇빛을 가려 지구 환경이 급변한 것으로 추정됩니다." },
    { id: 214, category: "지리", difficulty: "very_hard", question: "세계에서 유일하게 영토가 적도와 본초 자오선(및 날짜변경선)을 모두 걸치고 있어 북반구, 남반구, 동반구, 서반구 네 반구에 모두 영토가 존재하는 태평양의 섬나라는?", options: ["키리바시", "피지", "투발루", "마셜 제도"], correctAnswer: 0, explanation: "키리바시 공화국은 영해와 영토가 광활하게 퍼져 있어 지리적으로 유일한 4개 반구 교차 국가입니다." },
    { id: 215, category: "지리", difficulty: "very_hard", question: "페르시아만과 오만만(아라비아해)을 연결하는 좁은 해협으로, 전 세계 석유 해상 물동량의 약 20%가 통과하는 중동의 핵심 전략 요충지 이름은?", options: ["수에즈 해협", "호르무즈 해협", "말라카 해협", "바브엘만데브 해협"], correctAnswer: 1, explanation: "호르무즈 해협은 이란과 아라비아반도 사이에 위치하며 원유 수송의 생명선이라 불립니다." },
    { id: 216, category: "지리", difficulty: "very_hard", question: "과거 빙하기에 여러 방향으로 흐르던 산악 빙하들의 침식 작용으로 깎여 형성된, 날카로운 피라미드나 뿔 모양을 한 산봉우리(예: 스위스의 마터호른)를 가리키는 지형학 용어는?", options: ["혼(Horn)", "권곡(카르)", "드럼린", "모레인"], correctAnswer: 0, explanation: "혼(Horn)은 빙하의 측면 침식으로 인해 산 정상이 뾰족하게 남은 지형입니다." },
    { id: 217, category: "지리", difficulty: "very_hard", question: "중국 서북부 신장 웨이우얼 자치구에 위치한 타림 분지 내부의 거대한 사막으로, 위구르어로 '들어가면 나올 수 없다'는 뜻을 가진 이 사막은?", options: ["고비 사막", "타클라마칸 사막", "룹알할리 사막", "카라쿰 사막"], correctAnswer: 1, explanation: "타클라마칸 사막은 세계에서 두 번째로 큰 이동성 사막으로 과거 실크로드의 큰 장애물이었습니다." },
    { id: 218, category: "지리", difficulty: "very_hard", question: "미국 중서부 및 북동부 일대로, 과거 철강, 자동차 등 중화학 공업이 번성했으나 1970년대 이후 제조업 쇠퇴로 철제 기계들이 녹슬었다는 데서 유래한 지역 명칭은?", options: ["선 벨트(Sun Belt)", "실리콘 밸리", "러스트 벨트(Rust Belt)", "콘 벨트"], correctAnswer: 2, explanation: "러스트 벨트는 디트로이트, 피츠버그 등을 포함하며 미국의 산업 구조 변화와 정치 지형에 큰 영향을 미칩니다." },
    { id: 219, category: "지리", difficulty: "very_hard", question: "해발 고도가 약 -430m로 지표면에서 가장 낮은 곳에 위치하며, 바닷물보다 염분이 8배나 높아 생물이 거의 살 수 없어 '죽은 바다'라 불리는 중동의 호수는?", options: ["카스피해", "아랄해", "사해(Dead Sea)", "빅토리아호"], correctAnswer: 2, explanation: "사해는 이스라엘과 요르단 국경에 위치하며 물이 빠져나가지 못하고 증발만 하여 염도가 극도로 높습니다." },
    { id: 220, category: "지리", difficulty: "very_hard", question: "인접한 두 하천 사이에서 침식력(특히 두부 침식)이 강한 하천이 분수계를 허물고 다른 하천의 상류 물길을 빼앗아 자신의 유역으로 합치는 지형적 현상은?", options: ["감입 곡류", "하천 쟁탈", "하상 침식", "역행 침식"], correctAnswer: 1, explanation: "하천 쟁탈이 일어나면 물길을 빼앗긴 하천은 물이 줄어들어 풍혈(바람구멍)이나 건천이 되기도 합니다." },
    { id: 221, category: "지리", difficulty: "very_hard", question: "석회동굴(카르스트 지형) 내부에서 천장에서 떨어지는 지하수에 녹아 있던 탄산칼슘이 굳어지면서 천장에 고드름처럼 매달려 자라는 동굴 생성물은?", options: ["석순", "석주", "돌리네", "종유석"], correctAnswer: 3, explanation: "천장에서 아래로 자라는 것은 종유석, 바닥에서 위로 자라는 것은 석순이며 둘이 만나 기둥이 된 것을 석주라 합니다." },
    { id: 222, category: "지리", difficulty: "very_hard", question: "도시의 중심부 기온이 인공열 배출, 아스팔트 포장, 고층 건물 밀집 등의 이유로 주변 교외 지역보다 섬처럼 높게 나타나는 현상을 무엇이라 하나요?", options: ["스모그 현상", "열섬 현상(Urban Heat Island)", "온실 효과", "역전층 현상"], correctAnswer: 1, explanation: "열섬 현상은 여름철 도시의 폭염과 열대야를 가중시키는 주요 원인입니다." },
    { id: 223, category: "지리", difficulty: "very_hard", question: "지리적으로 유럽 남동부의 '발칸 반도'에 속하지 않는 국가는 다음 중 어디인가요?", options: ["그리스", "크로아티아", "불가리아", "스페인"], correctAnswer: 3, explanation: "스페인과 포르투갈은 유럽 서남부 끝에 위치한 '이베리아 반도' 국가입니다." },
    { id: 224, category: "지리", difficulty: "very_hard", question: "카자흐스탄과 우즈베키스탄 사이에 위치한 내륙호로, 구소련 시절 목화 재배를 위해 호수로 유입되는 두 강줄기를 무리하게 농업용수로 돌리면서 호수 면적이 10분의 1로 말라붙은 세계적인 환경 재앙의 상징은?", options: ["차드호", "바이칼호", "아랄해", "발하시호"], correctAnswer: 2, explanation: "아랄해의 고갈은 인간의 무분별한 개발이 초래한 20세기 최악의 환경 재앙 중 하나로 기록됩니다." },
    { id: 225, category: "지리", difficulty: "very_hard", question: "북아메리카의 거대한 5개 호수인 오대호(Great Lakes) 중에서, 캐나다와 국경을 공유하지 않고 유일하게 영토 전체가 오롯이 미국 영토 내에 속해 있는 호수는?", options: ["슈피리어호", "휴런호", "미시간호", "온타리오호"], correctAnswer: 2, explanation: "오대호 중 미시간호만 100% 미국 영토 내에 있으며, 시카고가 이 호수 연안에 위치해 있습니다." },

    // ==========================================
    // [예술과 문화] Level 1: 매우 쉬움 (very_easy) - 15문제

    { id: 226, category: "예술과 문화", difficulty: "very_easy", question: "프랑스 루브르 박물관에 소장되어 있으며, 신비로운 미소를 짓고 있는 여인을 그린 레오나르도 다 빈치의 명화는?", options: ["진주 귀걸이를 한 소녀", "모나리자", "비너스의 탄생", "최후의 만찬"], correctAnswer: 1, explanation: "모나리자는 르네상스 시대의 천재 다 빈치가 스푸마토 기법을 사용하여 그린 세계에서 가장 유명한 초상화입니다." },
    { id: 227, category: "예술과 문화", difficulty: "very_easy", question: "방탄소년단(BTS), 블랙핑크 등 한국의 아이돌 그룹을 중심으로 전 세계적으로 큰 인기를 끌고 있는 한국 대중음악을 일컫는 단어는?", options: ["J-pop", "C-pop", "Britpop", "K-pop"], correctAnswer: 3, explanation: "K-pop은 단순한 음악 장르를 넘어 안무, 패션 등을 포괄하는 글로벌 문화 현상이 되었습니다." },
    { id: 228, category: "예술과 문화", difficulty: "very_easy", question: "두꺼운 붓 터치와 강렬한 색채로 '별이 빛나는 밤', '해바라기' 등의 걸작을 남긴 네덜란드 출신의 후기 인상파 화가는?", options: ["파블로 피카소", "클로드 모네", "빈센트 반 고흐", "에두아르 마네"], correctAnswer: 2, explanation: "고흐는 생전에는 단 한 점의 그림만 팔릴 정도로 불우했으나, 사후에 세계 미술사에 가장 큰 영향을 미친 화가가 되었습니다." },
    { id: 229, category: "예술과 문화", difficulty: "very_easy", question: "미국 영화 예술 과학 아카데미가 수여하는 영화계 최고 권위의 시상식으로, 황금빛 기사상 트로피의 애칭을 따서 부르는 이름은?", options: ["그래미상", "오스카상", "에미상", "토니상"], correctAnswer: 1, explanation: "아카데미 시상식은 흔히 '오스카상(Oscars)'이라고도 불립니다." },
    { id: 230, category: "예술과 문화", difficulty: "very_easy", question: "영국 리버풀 출신의 4인조 밴드로 'Let It Be', 'Yesterday' 등의 명곡을 남기며 대중음악 역사상 가장 위대한 밴드로 꼽히는 그룹은?", options: ["비틀스", "퀸", "롤링 스톤스", "콜드플레이"], correctAnswer: 0, explanation: "비틀스(The Beatles)는 1960년대 팝 음악의 혁명을 일으킨 전설적인 밴드입니다." },
    { id: 231, category: "예술과 문화", difficulty: "very_easy", question: "미키 마우스, 도널드 덕 등의 캐릭터를 탄생시켰으며, 전 세계에 수많은 테마파크를 운영하는 거대한 엔터테인먼트 기업은?", options: ["워너브라더스", "유니버설 픽처스", "디즈니", "드림웍스"], correctAnswer: 2, explanation: "월트 디즈니 컴퍼니는 세계에서 가장 큰 미디어 및 애니메이션 왕국입니다." },
    { id: 232, category: "예술과 문화", difficulty: "very_easy", question: "영국의 작가 J.K. 롤링이 쓴 판타지 소설로, 이마에 번개 모양 흉터가 있는 소년 마법사의 이야기를 다룬 세계적인 베스트셀러는?", options: ["반지의 제왕", "나니아 연대기", "해리 포터", "헝거 게임"], correctAnswer: 2, explanation: "해리 포터 시리즈는 전 세계적으로 5억 부 이상 판매된 21세기 최고의 인기 판타지 문학입니다." },
    { id: 233, category: "예술과 문화", difficulty: "very_easy", question: "음악의 성인이라 불리며, 청력을 잃어가는 시련 속에서도 '운명 교향곡(교향곡 5번)' 등 위대한 명곡을 남긴 독일의 작곡가는?", options: ["모차르트", "바흐", "슈베르트", "루트비히 판 베토벤"], correctAnswer: 3, explanation: "베토벤은 고전주의를 완성하고 낭만주의의 문을 연 위대한 작곡가입니다." },
    { id: 234, category: "예술과 문화", difficulty: "very_easy", question: "영국이 낳은 세계 최고의 극작가로, '로미오와 줄리엣', '베니스의 상인' 등 수많은 희곡을 쓴 인물은?", options: ["조지 버나드 쇼", "아서 밀러", "윌리엄 셰익스피어", "오스카 와일드"], correctAnswer: 2, explanation: "셰익스피어는 영어 문학사에서 가장 훌륭한 작가로 존경받고 있습니다." },
    { id: 235, category: "예술과 문화", difficulty: "very_easy", question: "대사나 노래 없이 음악에 맞추어 무용수들의 우아한 춤과 마임으로 이야기를 전달하는 무대 예술로, '백조의 호수'가 대표적인 이 장르는?", options: ["오페라", "뮤지컬", "판소리", "발레"], correctAnswer: 3, explanation: "발레는 르네상스 시대 이탈리아 궁정에서 기원하여 프랑스와 러시아에서 꽃을 피운 서양 무용입니다." },
    { id: 236, category: "예술과 문화", difficulty: "very_easy", question: "한국에서 발상한 세로 스크롤 방식의 디지털 코믹스로, 최근 전 세계적으로 인기를 끌며 수많은 드라마와 영화의 원작이 되고 있는 것은?", options: ["그래픽 노블", "웹툰", "망가", "코믹스"], correctAnswer: 1, explanation: "웹툰(Webtoon)은 인터넷 환경에 맞게 발전한 한국 고유의 만화 연재 방식입니다." },
    { id: 237, category: "예술과 문화", difficulty: "very_easy", question: "5살 때부터 작곡을 시작한 오스트리아의 천재 음악가로, '마술피리', '피가로의 결혼' 등을 작곡한 인물은?", options: ["쇼팽", "모차르트", "비발디", "헨델"], correctAnswer: 1, explanation: "볼프강 아마데우스 모차르트는 35세의 짧은 생애 동안 600곡이 넘는 걸작을 남겼습니다." },
    { id: 238, category: "예술과 문화", difficulty: "very_easy", question: "대중음악계의 오스카상이라 불리며, 매년 미국 레코드 예술과학아카데미에서 뛰어난 음악가에게 수여하는 축음기 모양의 트로피 이름은?", options: ["에미 어워드", "빌보드 어워드", "아메리칸 뮤직 어워드", "그래미 어워드"], correctAnswer: 3, explanation: "그래미상(Grammy Awards)은 세계 대중음악계에서 가장 권위 있는 상으로 꼽힙니다." },
    { id: 239, category: "예술과 문화", difficulty: "very_easy", question: "14~16세기 이탈리아 피렌체를 중심으로 일어나 유럽 전역으로 퍼진 문화 부흥 운동으로, 프랑스어로 '재생' 또는 '부활'을 뜻하는 단어는?", options: ["르네상스", "바로크", "로코코", "계몽주의"], correctAnswer: 0, explanation: "르네상스는 신 중심의 중세에서 벗어나 인간 중심의 고대 그리스·로마 문화를 부흥시키려 한 운동입니다." },
    { id: 240, category: "예술과 문화", difficulty: "very_easy", question: "북, 장구, 꽹과리, 징의 네 가지 타악기를 중심으로 연주하며, 1978년 김덕수 패에 의해 창안된 한국의 현대적인 타악기 앙상블은?", options: ["농악", "마당놀이", "사물놀이", "풍물놀이"], correctAnswer: 2, explanation: "사물놀이는 야외에서 연주하던 풍물놀이를 무대 공연용으로 재구성한 한국의 대표적인 음악입니다." },
